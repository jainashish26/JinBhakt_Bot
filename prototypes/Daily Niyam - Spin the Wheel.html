<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niyam Wheel · नियम चक्र</title>
<style>
:root{
  --m:#c1272d; --m2:#8f1d22; --gold:#e8b64c; --gold2:#c99a2e;
  --ink:#2b2320; --paper:#fff8ec; --soft:#f6ead2;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans Devanagari",sans-serif;
  color:var(--ink); min-height:100vh;
  background:radial-gradient(1200px 600px at 50% -10%, #fff3d6 0%, transparent 60%),
             linear-gradient(160deg,#fdf6e7,#fbe9c9 55%,#f7dfb4);
}
button{font-family:inherit}
.hidden{display:none!important}
.wrap{max-width:1060px;margin:0 auto;padding:14px 16px 60px}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:.4px}
.brand .sym{font-size:1.6rem;color:var(--m)}
.hbtns{display:flex;gap:8px;align-items:center}
.pill{border:2px solid var(--gold2);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.8rem;cursor:pointer;color:#7a5a12}
.pill:hover{background:var(--soft)}
.iconbtn{border:none;background:transparent;font-size:1.3rem;cursor:pointer}

/* ---------- screens / cards ---------- */
.screen{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--paper);border:3px solid var(--gold);border-radius:22px;
  box-shadow:0 10px 30px rgba(120,80,10,.15);padding:26px 22px;margin:14px auto;max-width:760px;text-align:center}
.card h1{margin:.1em 0 .2em;font-size:clamp(1.4rem,4vw,2.1rem);color:var(--m2)}
.card p.sub{margin:.2em 0 1em;color:#6b5a3e}
.bigbtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.bigbtn{border:3px solid var(--gold2);background:linear-gradient(180deg,#fff,#ffefc9);border-radius:18px;
  padding:18px 26px;font-size:1.15rem;font-weight:800;cursor:pointer;min-width:180px;color:var(--m2);
  transition:transform .15s, box-shadow .15s}
.bigbtn:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(150,100,10,.25)}
.bigbtn .em{display:block;font-size:2.2rem;margin-bottom:6px}
.bigbtn.primary{background:linear-gradient(180deg,var(--m),var(--m2));color:#fff;border-color:var(--m2)}
.bigbtn.ghost{background:#fff;color:#7a5a12}

/* ---------- category chips ---------- */
.panel{background:var(--paper);border:3px solid var(--gold);border-radius:20px;padding:16px;margin:14px 0}
.panel h3{margin:0 0 10px;color:var(--m2);font-size:1.02rem;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--gold2);background:#fff;border-radius:999px;padding:7px 13px;font-size:.82rem;
  font-weight:700;cursor:pointer;color:#5d4a1c;transition:all .15s}
.chip:hover{background:var(--soft)}
.chip.on{background:var(--m);border-color:var(--m2);color:#fff;transform:scale(1.05)}
.chip .n{opacity:.75;font-weight:600}

/* ---------- wheel ---------- */
.wheelzone{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
.wheelwrap{position:relative;width:min(88vw,430px);aspect-ratio:1}
.wheelwrap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 18px rgba(120,70,0,.28))}
#wheelG{transform-box:view-box;transform-origin:50% 50%}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--m);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));z-index:3}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:19%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff6dd,var(--gold) 60%,var(--gold2));border:4px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:clamp(1.3rem,6vw,2.2rem);z-index:2;
  box-shadow:0 4px 10px rgba(0,0,0,.25)}
.wheelwrap.spin{animation:wob .5s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}}
#spinBtn{border:none;border-radius:999px;padding:16px 40px;font-size:1.25rem;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(180deg,var(--m),var(--m2));color:#fff;cursor:pointer;
  box-shadow:0 8px 0 var(--m2),0 14px 24px rgba(140,20,20,.35);transition:transform .12s}
#spinBtn:active{transform:translateY(4px);box-shadow:0 4px 0 var(--m2)}
#spinBtn:disabled{filter:grayscale(.6);cursor:wait}
.metaLine{font-size:.85rem;color:#6b5a3e;font-weight:600;text-align:center}

/* ---------- result ---------- */
#resultCard{border-color:var(--m);background:linear-gradient(180deg,#fffdf6,#fff3d8)}
.catBadge{display:inline-block;background:var(--gold);color:#5c430a;border-radius:999px;padding:5px 14px;
  font-weight:800;font-size:.8rem;margin-bottom:8px}
#rName{font-size:clamp(1.3rem,4.5vw,1.9rem);color:var(--m2);margin:.15em 0 .5em;font-weight:900}
.vowbox{background:#fff;border:2px dashed var(--gold2);border-radius:14px;padding:12px 14px;margin:10px 0;text-align:left}
.vowbox .lab{font-weight:900;color:var(--m);font-size:.82rem;text-transform:uppercase;letter-spacing:.6px}
.vowbox .txt{margin-top:4px;font-size:1.02rem;line-height:1.5}
.cheer{font-weight:800;color:#1c7c4a;margin-top:10px}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.mini{border:2px solid var(--gold2);background:#fff;border-radius:999px;padding:9px 18px;font-weight:800;cursor:pointer;color:#7a5a12}
.mini.primary{background:var(--m);border-color:var(--m2);color:#fff}
.mini.done{background:#1c7c4a;border-color:#145c37;color:#fff}

/* ---------- list ---------- */
#listPanel{margin-top:16px}
.catBlock{background:#fff;border:2px solid var(--gold);border-radius:14px;margin:10px 0;overflow:hidden}
.catHead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;
  background:var(--soft);font-weight:800;color:var(--m2)}
.catHead .cnt{background:var(--m);color:#fff;border-radius:999px;padding:2px 10px;font-size:.75rem}
.catBody{padding:6px 14px}
.nRow{border-top:1px solid #eee;padding:9px 4px}
.nRow:first-child{border-top:none}
.nTitle{font-weight:800;color:#4a3a1a}
.nSub{font-size:.85rem;color:#6b5a3e;margin-top:3px;line-height:1.45}
.nSub b{color:var(--m)}

/* ---------- confetti / toast ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#confetti i{position:absolute;top:-20px;display:block;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--m2);color:#fff;
  padding:12px 22px;border-radius:999px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:transform .35s;z-index:70}
#toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:#8a744d;font-size:.8rem;margin-top:26px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><span class="sym">☸</span><span id="brandTxt">Niyam Wheel</span></div>
  <div class="hbtns">
    <button class="pill hidden" id="streakPill"></button>
    <button class="iconbtn" id="sndBtn" title="Sound">🔊</button>
    <button class="pill hidden" id="langPill"></button>
    <button class="pill hidden" id="restartBtn"></button>
  </div>
</header>

<!-- 1 · LANGUAGE -->
<section class="screen" id="scrLang">
  <div class="card">
    <div style="font-size:3rem"></div>
    <h1>Choose your language</h1>
    <p class="sub">अपनी भाषा चुनिए</p>
    <div class="bigbtns">
      <button class="bigbtn" data-lang="en"><span class="em">🇬</span>English</button>
      <button class="bigbtn" data-lang="hi"><span class="em">🇮🇳</span>हिंदी</button>
    </div>
  </div>
</section>

<!-- 2 · AUDIENCE -->
<section class="screen hidden" id="scrAud">
  <div class="card">
    <div style="font-size:3rem">🪷</div>
    <h1 id="audTitle"></h1>
    <p class="sub" id="audSub"></p>
    <div class="bigbtns">
      <button class="bigbtn" data-aud="kids"><span class="em">🧒</span><span id="kidsLbl"></span></button>
      <button class="bigbtn" data-aud="adults"><span class="em">🧑🦱</span><span id="adLbl"></span></button>
    </div>
  </div>
</section>

<!-- 3 · WHEEL -->
<section class="screen hidden" id="scrMain">
  <div class="panel">
    <h3 id="catTitle"></h3>
    <div class="chips" id="chips"></div>
  </div>

  <div class="wheelzone">
    <div class="wheelwrap" id="wheelwrap">
      <div class="pointer"></div>
      <svg id="wheelSvg" viewBox="0 0 400 400" aria-label="Niyam wheel">
        <circle cx="200" cy="200" r="197" fill="#fff8ec" stroke="#c99a2e" stroke-width="5"/>
        <g id="wheelG"></g>
        <circle cx="200" cy="200" r="196" fill="none" stroke="#e8b64c" stroke-width="3"/>
      </svg>
      <div class="hub">☸</div>
    </div>
    <button id="spinBtn"></button>
    <div class="metaLine" id="metaLine"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <span class="catBadge" id="rCat"></span>
    <div id="rName"></div>
    <div class="vowbox"><div class="lab" id="labP"></div><div class="txt" id="rP"></div></div>
    <div class="vowbox"><div class="lab" id="labT"></div><div class="txt" id="rT"></div></div>
    <div class="cheer" id="rCheer"></div>
    <div class="rbtns">
      <button class="mini primary" id="acceptBtn"></button>
      <button class="mini" id="againBtn"></button>
      <button class="mini" id="listBtn2"></button>
    </div>
  </div>

  <div class="panel hidden" id="listPanel">
    <h3 id="listTitle"></h3>
    <div id="listBody"></div>
  </div>

  <footer id="footTxt"></footer>
</section>
</div>
<div id="confetti"></div>
<div id="toast"></div>

[2,"Eat What Is Served","To happily eat the food placed on my plate today.","Demanding a separate or special dish of my own.","जो मिला वही खाऊँ","आज थाली में रखे भोजन को प्रसन्न मन से खाना।","अलग या विशेष पकवान की जिद करना।"],

[4,"Shoes Off Indoors","To keep my shoes outside and walk softly inside the house.","Wearing shoes into rooms and on mats.","बाहर जूते, भीतर नंगे पाँव","जूते बाहर रखना और घर के भीतर धीमे पाँव चलना।","कमरों और चटाई पर जूते पहनकर जाना।"],

[11,"Gentle Ears","To listen to soft bhajans or stories instead of loud music.","Loud music and noisy video games.","कोमल कान","तेज़ संगीत के स्थान पर मधुर भजन या कथाएँ सुनना।","तेज़ संगीत और शोर भरे वीडियो गेम।"],

function beep(f,d,g){if(!sndOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();

 v.gain.setValueAtTime(g||.08,AC.currentTime);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.06));
 o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+(d||.06));}catch(e){}}

function setStreak(o){try{localStorage.setItem("niyamStreak",JSON.stringify(o))}catch(e){}}
function recordVow(){const k=todayKey(),o=getStreak();
 if(o.last===k)return;
 const y=new Date();y.setDate(y.getDate()-1);const yk=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
 o.n=(o.last===yk)?(o.n||0)+1:1;o.last=k;setStreak(o);showStreak();

 if(o.n&&o.n>0){p.textContent=UI[S.lang].streak.replace("{n}",o.n);p.classList.remove("hidden");}else p.classList.add("hidden");}
/* ---------- flow ---------- */
function show(id){["scrLang","scrAud","scrMain"].forEach(s=>$(s).classList.add("hidden"));$(id).classList.remove("hidden");}
function applyLang(){const t=UI[S.lang];document.documentElement.lang=S.lang==="hi"?"hi":"en";
 $("brandTxt").textContent=t.brand;$("langPill").textContent=t.lang;$("restartBtn").textContent=t.restart;
 $("audTitle").textContent=t.audTitle;$("audSub").textContent=t.audSub;
 $("kidsLbl").textContent=t.kids;$("adLbl").textContent=t.adults;
 $("catTitle").textContent=t.catTitle;$("spinBtn").textContent=t.spin;
 $("labP").textContent=t.labP;$("labT").textContent=t.labT;
 $("acceptBtn").textContent=t.accept;$("againBtn").textContent=t.again;$("listBtn2").textContent=t.list;
 $("footTxt").textContent=t.foot;showStreak();}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;applyLang();show("scrAud");beep(660,.1);});
$("langPill").onclick=()=>{S.lang=S.lang==="en"?"hi":"en";applyLang();if(S.aud)renderMain();};
document.querySelectorAll("[data-aud]").forEach(b=>b.onclick=()=>{S.aud=b.dataset.aud;S.cat="any";applyLang();renderMain();show("scrMain");beep(760,.1);});
$("restartBtn").onclick=()=>{S.aud=null;S.cat="any";$("resultCard").classList.add("hidden");$("listPanel").classList.add("hidden");show("scrLang");};
$("sndBtn").onclick=()=>{sndOn=!sndOn;$("sndBtn").textContent=sndOn?"🔊":"🔇";};
/* ---------- main render ---------- */
function pool(){let p=DATA[S.aud];if(S.cat!=="any")p=p.filter(e=>e[0]===+S.cat);return p;}
function renderMain(){const t=UI[S.lang];
 const chips=$("chips");chips.innerHTML="";
 const mk=(val,lab,n)=>{const b=document.createElement("button");b.className="chip"+(S.cat===val?" on":"");
  b.innerHTML=lab+(n!=null?` <span class="n">(${n})</span>`:"");b.onclick=()=>{if(S.spinning)return;S.cat=val;renderMain();beep(520,.06);};chips.appendChild(b);};
 const cntAny=DATA[S.aud].length;mk("any",t.any,cntAny);
 CATS.forEach((c,i)=>{const n=DATA[S.aud].filter(e=>e[0]===i+1).length;
  mk(String(i+1),`${c.ic} ${S.lang==="en"?c.en:c.hi}`,n);});
 S.pool=pool();buildWheel();
 $("metaLine").textContent=t.meta.replace("{n}",S.pool.length).replace("{who}",t.who[S.aud]);
 $("resultCard").classList.add("hidden");$("listPanel").classList.add("hidden");
 $("spinBtn").disabled=false;$("spinBtn").textContent=t.spin;}
/* ---------- wheel ---------- */
function buildWheel(){const g=$("wheelG");g.innerHTML="";const n=S.pool.length;
 const NS="http://www.w3.org/2000/svg";
 if(n===0){const c=document.createElementNS(NS,"circle");c.setAttribute("cx",200);c.setAttribute("cy",200);c.setAttribute("r",190);c.setAttribute("fill","#f6ead2");g.appendChild(c);return;}
 const step=360/n,R=190;
 for(let i=0;i<n;i++){const a0=(i*step-90)*Math.PI/180,a1=((i+1)*step-90)*Math.PI/180;
  const x0=200+R*Math.cos(a0),y0=200+R*Math.sin(a0),x1=200+R*Math.cos(a1),y1=200+R*Math.sin(a1);
  const p=document.createElementNS(NS,"path");
  p.setAttribute("d",`M200 200 L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${step>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`);
  p.setAttribute("fill",PAL[i%PAL.length]);p.setAttribute("stroke","#fff8ec");p.setAttribute("stroke-width",n>40?0.6:1.4);
  g.appendChild(p);
  if(n<=20){const mid=(i*step+step/2-90)*Math.PI/180;
   const tx=200+R*0.62*Math.cos(mid),ty=200+R*0.62*Math.sin(mid);
   const txt=document.createElementNS(NS,"text");txt.setAttribute("x",tx);txt.setAttribute("y",ty);
   txt.setAttribute("fill","#fff");txt.setAttribute("font-size",n<=8?15:12);txt.setAttribute("font-weight","700");
   txt.setAttribute("text-anchor","middle");txt.setAttribute("dominant-baseline","middle");
   txt.setAttribute("transform",`rotate(${i*step+step/2} ${tx} ${ty})`);
   const nm=S.pool[i][S.lang==="en"?1:4];txt.textContent=nm.length>16?nm.slice(0,15)+"…":nm;
   g.appendChild(txt);}
  else{const mid=(i*step+step/2-90)*Math.PI/180,r2=R*0.93;
   const d=document.createElementNS(NS,"circle");
   d.setAttribute("cx",200+r2*Math.cos(mid));d.setAttribute("cy",200+r2*Math.sin(mid));
   d.setAttribute("r",n>60?2.4:3.4);d.setAttribute("fill","#fff8ec");d.setAttribute("opacity",".9");g.appendChild(d);}}
 g.style.transform=`rotate(${S.rot}deg)`;}
/* ---------- spin ---------- */
$("spinBtn").onclick=()=>{if(S.spinning||!S.pool.length)return;S.spinning=true;S.accepted=false;
 const t=UI[S.lang];$("spinBtn").disabled=true;$("spinBtn").textContent=t.spinning;
 $("resultCard").classList.add("hidden");$("wheelwrap").classList.add("spin");
 const n=S.pool.length,idx=Math.floor(Math.random()*n),step=360/n;
 const target=-(idx*step+step/2);
 const cur=S.rot,base=((cur%360)+360)%360;
 let delta=(target-base)%360;if(delta<0)delta+=360;
 const turns=5+Math.floor(Math.random()*3);
 const finalRot=cur+turns*360+delta;
 const g=$("wheelG");g.style.transition="transform 5.2s cubic-bezier(.12,.64,.08,1)";
 g.style.transform=`rotate(${finalRot}deg)`;S.rot=finalRot;
 let last=0;const iv=setInterval(()=>{const m=Math.abs(((finalRot-(parseFloat(getComputedStyle(g).transform.split("(")[1])||0)))) ;tick();},140);
 setTimeout(()=>clearInterval(iv),5200);
 setTimeout(()=>{clearInterval(iv);S.spinning=false;$("wheelwrap").classList.remove("spin");
  $("spinBtn").disabled=false;$("spinBtn").textContent=t.spin;showResult(idx);},5350);};
function showResult(i){const e=S.pool[i],t=UI[S.lang],c=CATS[e[0]-1];
 const L=S.lang==="en"?1:4;
 $("rCat").textContent=`${c.ic} ${t.catLbl}: ${S.lang==="en"?c.en:c.hi} · ${c.sn}`;
 $("rName").textContent=e[L];
 $("rP").textContent=e[L+1];$("rT").textContent=e[L+2];
 $("rCheer").textContent=t.cheers[Math.floor(Math.random()*t.cheers.length)];
 const ab=$("acceptBtn");ab.textContent=t.accept;ab.classList.remove("done");
 $("resultCard").classList.remove("hidden");
 $("resultCard").scrollIntoView({behavior:"smooth",block:"center"});
 confetti();win();}
$("acceptBtn").onclick=()=>{if(S.accepted)return;S.accepted=true;recordVow();
 const t=UI[S.lang];$("acceptBtn").textContent=t.accepted;$("acceptBtn").classList.add("done");
 toast(t.toastAcc);confetti();};
$("againBtn").onclick=()=>{$("spinBtn").click();};
$("listBtn2").onclick=()=>{const p=$("listPanel");p.classList.toggle("hidden");if(!p.classList.contains("hidden"))renderList();};
function renderList(){const t=UI[S.lang],body=$("listBody");body.innerHTML="";
 $("listTitle").textContent=t.listTitle.replace("{who}",t.who[S.aud]).replace("{n}",DATA[S.aud].length);
 CATS.forEach((c,ci)=>{const items=DATA[S.aud].filter(e=>e[0]===ci+1);if(!items.length)return;
  const blk=document.createElement("div");blk.className="catBlock";
  const head=document.createElement("div");head.className="catHead";
  head.innerHTML=`<span>${c.ic} ${S.lang==="en"?c.en:c.hi} <small>· ${c.sn}</small></span><span class="cnt">${items.length}</span>`;
  const bd=document.createElement("div");bd.className="catBody";bd.style.display="none";
  items.forEach(e=>{const L=S.lang==="en"?1:4;const r=document.createElement("div");r.className="nRow";
   r.innerHTML=`<div class="nTitle">${e[L]}</div><div class="nSub"><b>${t.labP.split("·")[0].trim()}:</b> ${e[L+1]}<br><b>${t.labT.split("·")[0].trim()}:</b> ${e[L+2]}</div>`;
   bd.appendChild(r);});
  head.onclick=()=>{bd.style.display=bd.style.display==="none"?"block":"none";};
  blk.appendChild(head);blk.appendChild(bd);body.appendChild(blk);});}
show("scrLang");
</script>
</body>
