<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jain Tirthankar Learning Suite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-warm">

    <header>
        <div class="logo-area">
            <span class="om-symbol">ॐ</span>
            <h1 id="header-title">Tirthankar Quest</h1>
        </div>
        <div class="lang-toggle">
            <button class="lang-btn active" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" onclick="setLanguage('hi')">हिंदी</button>
        </div>
    </header>

    <!-- WELCOME SCREEN -->
    <main id="screen-welcome" class="screen active">
        <div class="card welcome-card">
            <h2 id="welcome-title">Learn, Play & Remember!</h2>
            <p id="welcome-desc">Discover the 24 Tirthankars through fun memory games.</p>
            
            <div class="input-group">
                <label id="name-label" for="player-name">Your Name / Nickname:</label>
                <input type="text" id="player-name" maxlength="15" placeholder="e.g., Aarav" autocomplete="off">
            </div>

            <div class="setup-group">
                <label id="mode-label">Choose Game Category:</label>
                <div class="radio-cards">
                    <label class="radio-card selected" data-val="chinh">
                        <input type="radio" name="gameMode" value="chinh" checked>
                        <span class="rc-icon">🦁</span>
                        <span class="rc-text" data-i18n="cat-chinh">Chinh (Symbol)</span>
                    </label>
                    <label class="radio-card" data-val="complexion">
                        <input type="radio" name="gameMode" value="complexion">
                        <span class="rc-icon">🎨</span>
                        <span class="rc-text" data-i18n="cat-complexion">Complexion</span>
                    </label>
                    <label class="radio-card" data-val="aasan">
                        <input type="radio" name="gameMode" value="aasan">
                        <span class="rc-icon">🧘</span>
                        <span class="rc-text" data-i18n="cat-aasan">Aasan (Posture)</span>
                    </label>
                    <label class="radio-card" data-val="moksha">
                        <input type="radio" name="gameMode" value="moksha">
                        <span class="rc-icon">⛰️</span>
                        <span class="rc-text" data-i18n="cat-moksha">Moksha Sthal</span>
                    </label>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btn-start" onclick="startGame()" disabled>Start Game</button>
                <button class="btn btn-secondary" onclick="toggleLeaderboard()">View Leaderboard</button>
            </div>
        </div>

        <!-- LEADERBOARD PANEL -->
        <div id="leaderboard-panel" class="card lb-panel hidden">
            <h3 id="lb-title">🏆 Top Players</h3>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th id="th-name">Name</th>
                        <th id="th-cat">Category</th>
                        <th id="th-time">Time</th>
                    </tr>
                </thead>
                <tbody id="lb-body"></tbody>
            </table>
            <button class="btn btn-small btn-danger" onclick="clearLB()">Clear</button>
        </div>
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
