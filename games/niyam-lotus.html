<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6D1B2F">
<meta name="description" content="श्वास लीजिए, कमल खिलने दीजिए और आज का नियम शांति से स्वीकार कीजिए। बालक हेतु 108 और व्यस्क हेतु 216 नियम। Breathe, let the lotus open, and accept today's niyam in quiet — 108 for children, 216 for adults.">
<title>नियम कमल · Niyam Lotus</title>
<style>
/* ============================================================
   स्मृति पट्ट · Memory Match
   Single file · no CDN · no images · no external fonts
   Motion: transform + opacity only · honours prefers-reduced-motion
   ============================================================ */
:root{
  --saffron:#E8800C; --maroon:#6D1B2F; --gold:#C8860A; --cream:#FFF8F0;
  --warm:#FFFBF5; --ink:#2D1B06; --ink2:#5C3D1E; --border:#D4A574;
  --success:#2E7D32; --rose:#B23A3A; --leaf:#3F7D4F; --info:#1565C0;
  --card-line:#EADBC0;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-full:9999px;
  --sh-sm:0 1px 3px rgba(45,27,6,.08), 0 1px 2px rgba(45,27,6,.06);
  --sh-md:0 4px 12px rgba(45,27,6,.10), 0 2px 4px rgba(45,27,6,.06);
  --sh-lg:0 10px 25px rgba(45,27,6,.12), 0 4px 8px rgba(45,27,6,.06);
  --fast:.15s ease; --base:.25s ease; --slow:.4s ease;
  --ritual:.7s cubic-bezier(.2,.7,.2,1);
  --font-head:'Noto Serif Devanagari', Georgia, 'Times New Roman', serif;
  --font-body:'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
@media (max-width:480px){html{font-size:15px}}
body{
  font-family:var(--font-body);color:var(--ink);line-height:1.6;min-height:100vh;
  background:
    radial-gradient(900px 480px at 50% -10%, #FFF6E2 0%, transparent 62%),
    linear-gradient(165deg,#FDF8EE,#F7ECD6 60%,#F1E2C4);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
img,svg{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:var(--r-sm)}
.is-hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

.g-wrap{max-width:900px;margin:0 auto;padding:14px 14px 40px}

/* ---------- header ---------- */
.g-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 2px 14px}
.g-brand{display:flex;align-items:center;gap:9px;min-width:0}
.g-mark{width:30px;height:30px;flex-shrink:0;color:var(--saffron)}
.g-brand-txt{display:flex;flex-direction:column;min-width:0}
.g-brand-hi{font-family:var(--font-head);font-weight:700;font-size:1.02rem;
  color:var(--maroon);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-brand-en{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);opacity:.85}
.g-head-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.g-pill{border:1.5px solid var(--border);background:rgba(255,255,255,.72);
  border-radius:var(--r-full);padding:6px 13px;font-weight:600;font-size:.76rem;
  color:#7A5A12;transition:background var(--fast),transform var(--fast);white-space:nowrap;min-height:36px}
.g-pill:hover{background:#fff;transform:translateY(-1px)}
.g-iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r-full);
  border:1.5px solid var(--border);background:rgba(255,255,255,.72);color:var(--maroon);
  transition:background var(--fast)}
.g-iconbtn:hover{background:#fff}
.g-iconbtn svg{width:19px;height:19px}

/* ---------- screens ---------- */
.g-screen{animation:g-rise .5s cubic-bezier(.2,.7,.2,1)}
@keyframes g-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.g-card{background:var(--warm);border:1px solid var(--card-line);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:26px 20px;margin:14px 0;text-align:center}
.g-rule{width:56px;height:2px;margin:0 auto 18px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.g-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);
  font-size:clamp(1.4rem,4.6vw,2rem);line-height:1.25;margin-bottom:.25em}
.g-sub{color:var(--ink2);font-size:.95rem;max-width:46ch;margin:0 auto 1.2em}
.g-glyph{display:block;width:64px;height:64px;margin:0 auto 10px;color:var(--saffron)}
.g-glyph svg{width:100%;height:100%}

/* ---------- choice tiles ---------- */
.g-choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.g-choice{border:1.5px solid var(--border);background:rgba(255,255,255,.62);
  border-radius:var(--r-lg);padding:18px 20px;min-width:140px;flex:0 1 190px;
  color:var(--maroon);text-align:center;
  transition:transform var(--base),background var(--base),border-color var(--base),box-shadow var(--base)}
.g-choice:hover{transform:translateY(-3px);background:#fff;box-shadow:var(--sh-md);border-color:var(--saffron)}
.g-choice.is-on{border-color:var(--maroon);background:#fff;box-shadow:0 0 0 2px rgba(109,27,47,.16)}
.g-choice-mark{width:34px;height:34px;margin:0 auto 8px;color:var(--saffron)}
.g-choice-name{display:block;font-family:var(--font-head);font-weight:700;font-size:1.02rem}
.g-choice-note{display:block;font-size:.74rem;color:var(--ink2);margin-top:3px;opacity:.9}
@media (pointer:coarse){.g-choice{min-height:44px}}

/* ---------- setup form ---------- */
.g-field{text-align:left;margin:20px auto 0;max-width:540px}
.g-label{display:block;font-weight:700;font-size:.84rem;color:var(--maroon);margin-bottom:8px;
  letter-spacing:.02em}
.g-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--r-md);
  background:#fff;font-size:1rem;min-height:46px;transition:border-color var(--fast)}
.g-input:focus{border-color:var(--saffron);outline:none}
.g-chips{display:flex;flex-wrap:wrap;gap:8px}
.g-chip{border:1.5px solid var(--border);background:rgba(255,255,255,.7);
  border-radius:var(--r-full);padding:8px 15px;font-size:.84rem;font-weight:600;color:#6B5733;
  min-height:42px;transition:background var(--fast),border-color var(--fast),color var(--fast)}
.g-chip:hover{background:#fff;border-color:var(--saffron)}
.g-chip.is-on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.g-hint{font-size:.8rem;color:var(--ink2);margin-top:16px;font-style:italic}

/* ---------- buttons ---------- */
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1.5px solid var(--border);background:rgba(255,255,255,.75);border-radius:var(--r-full);
  padding:12px 26px;font-weight:700;font-size:.95rem;color:#7A5A12;min-height:46px;
  transition:transform var(--fast),background var(--fast),box-shadow var(--fast)}
.g-btn:hover{background:#fff;transform:translateY(-2px);box-shadow:var(--sh-sm)}
.g-btn-primary{background:linear-gradient(180deg,var(--saffron),#D0710A);border-color:#B85F08;
  color:#fff;box-shadow:0 3px 0 #A85607}
.g-btn-primary:hover{background:linear-gradient(180deg,#F08C15,var(--saffron));color:#fff}
.g-btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #A85607}
.g-btn-primary:disabled{background:#D9CDB8;border-color:#C9BCA5;box-shadow:none;color:#8B7C63;
  cursor:not-allowed;transform:none}
.g-btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.g-btn-sm{padding:8px 16px;font-size:.82rem;min-height:38px}

/* ---------- HUD ---------- */
.g-hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:rgba(255,255,255,.6);border:1px solid var(--card-line);border-radius:var(--r-lg);
  padding:10px 12px;margin:6px 0 14px}
.g-stat{display:flex;flex-direction:column;align-items:center;min-width:66px;padding:2px 8px}
.g-stat-val{font-family:var(--font-head);font-weight:700;font-size:1.15rem;color:var(--maroon);
  line-height:1.15;font-variant-numeric:tabular-nums}
.g-stat-lbl{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);opacity:.85}
.g-hud-sep{width:1px;height:26px;background:var(--card-line)}
.g-progress{height:6px;background:rgba(212,165,116,.32);border-radius:var(--r-full);
  overflow:hidden;width:100%;margin-top:4px}
.g-progress-fill{height:100%;width:100%;border-radius:var(--r-full);transform-origin:left center;
  transform:scaleX(0);background:linear-gradient(90deg,var(--gold),var(--saffron));
  transition:transform var(--slow)}

/* ---------- memory grid ---------- */
.g-board{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);margin:4px 0 8px;
  perspective:1200px}
@media (min-width:620px){.g-board[data-cols="12"]{grid-template-columns:repeat(6,1fr)}}
@media (max-width:400px){.g-board{gap:7px}}
/* tight board: cards fill cells, no aspect-ratio constraint */
.g-board.is-tight{grid-auto-rows:1fr}
.g-board.is-tight .g-cardflip{aspect-ratio:auto;height:100%;min-height:0}
.g-board.is-tight .g-face{padding:4px 3px;gap:3px}
.g-board.is-tight .g-face-back .g-art{width:28px;height:28px}
.g-board.is-tight .g-face-back .g-txt{font-size:.62rem}
.g-board.is-tight .g-face-back .g-sub2{font-size:.54rem}
.g-board.is-tight .g-face-front svg{width:44%;height:auto}

/* The flip lives on the WRAPPER only. Neither face is itself rotated, so no
   glyph can ever be painted mirrored. The hidden face also drops to
   opacity 0 after the turn, which makes a mirrored render impossible even
   where backface-visibility is unsupported. */
.g-cardflip{position:relative;aspect-ratio:3/4;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.g-cardflip.is-flipped{transform:rotateY(180deg)}
.g-face{position:absolute;inset:0;border-radius:var(--r-md);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:8px 6px;text-align:center;overflow:hidden;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  transition:opacity .2s linear .35s, box-shadow var(--base)}
.g-cardflip.is-flipped .g-face-front{opacity:0}
.g-cardflip:not(.is-flipped) .g-face-back{opacity:0}
.g-face-front{background:linear-gradient(150deg,#FBEBCB,#F2DCB0);
  border:1.5px solid var(--border);box-shadow:var(--sh-sm);color:var(--gold)}
.g-face-front svg{width:64%;height:auto;color:var(--gold);opacity:.85}
.g-face-back{transform:rotateY(180deg);background:#fff;border:1.5px solid var(--card-line);
  box-shadow:var(--sh-sm);color:var(--ink)}
.g-face-back .g-art{width:44px;height:44px;flex-shrink:0}
.g-face-back .g-txt{font-size:.74rem;font-weight:700;line-height:1.3;color:var(--maroon);
  overflow-wrap:anywhere}
.g-face-back .g-sub2{font-size:.64rem;color:var(--ink2);opacity:.85;line-height:1.25}
.g-cardflip.is-matched{cursor:default}
.g-cardflip.is-matched .g-face-back{border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(200,134,10,.28), var(--sh-md)}
.g-cardflip.is-matched .g-face-back .g-txt{color:var(--leaf)}
.g-cardflip.is-wrong{animation:g-sway .42s ease}
@keyframes g-sway{0%,100%{transform:rotateY(180deg) translateX(0)}
  25%{transform:rotateY(180deg) translateX(-4px)}
  75%{transform:rotateY(180deg) translateX(4px)}}
.g-cardflip.is-hint .g-face-back{box-shadow:0 0 0 3px rgba(232,128,12,.45)}
@media (max-width:400px){
  .g-face-back .g-art{width:32px;height:32px}
  .g-face-back .g-txt{font-size:.66rem}
  .g-face-back .g-sub2{font-size:.58rem}
}

/* ---------- result ---------- */
.g-medal{display:block;width:76px;height:76px;margin:0 auto 8px;color:var(--gold);
  animation:g-bloom .8s cubic-bezier(.2,.8,.25,1)}
.g-medal svg{width:100%;height:100%}
@keyframes g-bloom{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
.g-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0}
.g-statbox{background:#fff;border:1px solid var(--card-line);border-radius:var(--r-md);padding:13px 8px}
.g-statbox b{display:block;font-family:var(--font-head);font-size:1.4rem;color:var(--saffron);
  line-height:1.2;font-variant-numeric:tabular-nums}
.g-statbox span{display:block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink2);margin-top:3px}
.g-review{text-align:left;margin:18px auto 0;max-width:640px}
.g-review-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);
  font-size:1.02rem;text-align:center;margin-bottom:10px}
.g-tablewrap{overflow-x:auto;border:1px solid var(--card-line);border-radius:var(--r-md);background:#fff}
.g-table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:430px}
.g-table th,.g-table td{padding:9px 10px;text-align:left;border-bottom:1px solid #F1E6D2;vertical-align:top}
.g-table th{background:#FBF3E2;font-weight:700;color:var(--maroon);font-size:.7rem;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.g-table tbody tr:last-child td{border-bottom:none}
.g-table td.g-num{font-variant-numeric:tabular-nums;color:var(--ink2);width:2.4em}
.g-note{font-size:.8rem;color:var(--ink2);background:#FBF3E2;border-left:3px solid var(--gold);
  padding:9px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:14px;line-height:1.55}
.g-rank{display:inline-block;background:var(--gold);color:#4A3508;border-radius:var(--r-full);
  padding:4px 14px;font-weight:700;font-size:.8rem;margin-top:12px}

/* ---------- leaderboard ---------- */
.g-lb{text-align:left;margin-top:18px}
.g-lb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-wrap:wrap;margin-bottom:10px}
.g-lb-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);font-size:1.02rem}
.g-lb-empty{font-size:.84rem;color:var(--ink2);font-style:italic;text-align:center;padding:14px 6px}
.g-medalcell{font-weight:700;color:var(--gold);width:2.6em}

/* ---------- toast / dialog / fx ---------- */
.g-toast{position:fixed;left:50%;bottom:24px;z-index:70;max-width:min(92vw,430px);
  transform:translateX(-50%) translateY(120px);opacity:0;pointer-events:none;
  background:rgba(60,40,20,.94);color:#FFF6E2;padding:11px 20px;border-radius:var(--r-full);
  font-weight:600;font-size:.86rem;box-shadow:var(--sh-lg);text-align:center;line-height:1.45;
  transition:transform var(--slow),opacity var(--slow)}
.g-toast.is-on{transform:translateX(-50%) translateY(0);opacity:1}
.g-fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.g-fx i{position:absolute;top:-24px;display:block;
  border-radius:60% 60% 60% 60%/70% 70% 30% 30%;
  animation:g-fall linear forwards;will-change:transform,opacity}
@keyframes g-fall{to{transform:translateY(112vh) rotate(420deg);opacity:.15}}
.g-dialog{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(45,27,6,.55)}
.g-dialog-card{background:var(--warm);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);padding:26px 22px;max-width:400px;width:100%;text-align:center;
  animation:g-rise .35s cubic-bezier(.2,.7,.2,1)}
.g-dialog-card h2{font-family:var(--font-head);color:var(--maroon);font-size:1.2rem;margin-bottom:8px}
.g-dialog-card p{font-size:.9rem;color:var(--ink2);margin-bottom:6px}
.g-foot{text-align:center;color:#A08A5E;font-size:.74rem;margin:28px auto 0;line-height:1.7;
  font-style:italic;max-width:60ch}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .g-fx{display:none!important}
}

/* ---------- short desktop: compact play screens so they fit the iframe without scrolling ---------- */
@media (min-width:900px) and (max-height:880px){
  .g-wrap{padding:8px 14px 20px}
  .g-card{padding:18px 16px;margin:8px 0}
  .g-title{font-size:clamp(1.2rem,3.6vw,1.6rem);margin-bottom:.15em}
  .g-sub{font-size:.85rem;margin-bottom:.8em}
  .g-hud{padding:8px 10px;margin:4px 0 8px}
  .g-stat-val{font-size:1rem}
  .g-stat-lbl{font-size:.58rem}
  .g-btn-row{margin-top:10px}
  .g-btn{padding:10px 20px;min-height:40px;font-size:.85rem}
  .g-btn-sm{padding:7px 14px;min-height:34px;font-size:.78rem}
  .g-foot{margin:14px auto 0;font-size:.68rem}
  .g-board{margin:2px 0 6px}
  .g-cardflip{aspect-ratio:auto;min-height:0}
  .g-face{padding:6px 4px;gap:4px}
  .g-face-back .g-art{width:36px;height:36px}
  .g-face-back .g-txt{font-size:.68rem}
  .g-face-front svg{width:50%;height:auto}
  .g-medal{width:56px;height:56px}
  .g-stats{margin:12px 0;gap:8px}
  .g-statbox{padding:10px 6px}
  .g-statbox b{font-size:1.2rem}
  .g-statbox span{font-size:.6rem}
  .g-review{margin:12px auto 0}
  .g-note{margin-top:10px;padding:7px 10px;font-size:.74rem}
}

/* ---------- vow ritual: shared by the wheel and the lotus ---------- */
.g-cat-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);
  font-size:1.02rem;text-align:center;margin-bottom:12px}
.g-chips-scroll{max-height:none;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding-bottom:4px;
  justify-content:flex-start}
.g-chips-scroll .g-chip{flex:0 0 auto;scroll-snap-align:start;white-space:nowrap}
.g-stage{display:flex;flex-direction:column;align-items:center;gap:12px;margin:6px 0 10px}
.g-meta{font-size:.78rem;color:var(--ink2);text-align:center;letter-spacing:.02em;margin-top:2px}
.g-catbadge{display:inline-block;background:rgba(200,134,10,.16);color:#7A5A12;
  border:1px solid var(--gold);border-radius:var(--r-full);padding:4px 14px;
  font-weight:700;font-size:.72rem;margin-bottom:10px;letter-spacing:.03em}
.g-vowname{font-family:var(--font-head);font-weight:700;color:var(--maroon);
  font-size:clamp(1.25rem,4.4vw,1.75rem);line-height:1.3;margin:.1em 0 .7em}
.g-vowbox{border-top:1px solid var(--card-line);border-bottom:1px solid var(--card-line);
  padding:14px 4px;margin:0 0 -1px;text-align:left}
.g-vowlab{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--saffron);font-weight:700;margin-bottom:6px}
.g-vowtxt{font-size:1rem;line-height:1.65;color:#4A3C2C}
.g-cheer{color:var(--leaf);font-style:italic;font-weight:600;margin-top:14px;font-size:.92rem}
.g-btn.is-done{background:var(--leaf);border-color:#2F6039;color:#fff;box-shadow:none}

/* full list groups */
.g-grp{border-top:1px solid var(--card-line)}
.g-grp:first-child{border-top:none}
.g-grp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:13px 2px;text-align:left;font-family:var(--font-head);font-weight:700;
  color:var(--maroon);font-size:.92rem;background:none;border:none;cursor:pointer;
  transition:opacity var(--fast)}
.g-grp-head:hover{opacity:.78}
.g-grp-cnt{flex-shrink:0;color:var(--gold);font-size:.76rem;font-weight:700;
  font-family:var(--font-body)}
.g-grp-body{padding:2px 2px 12px}
.g-nrow{padding:11px 2px;border-top:1px dashed var(--card-line)}
.g-nrow:first-child{border-top:none}
.g-ntitle{font-weight:700;color:#4A3A22;font-size:.9rem}
.g-nsub{font-size:.82rem;color:var(--ink2);margin-top:4px;line-height:1.55}
.g-nsub b{color:var(--saffron);font-weight:700}
.g-lb-actions{display:flex;gap:8px;flex-wrap:wrap}


/* ---------- lotus ritual ---------- */
.g-lotuswrap{position:relative;width:min(84vw,380px);aspect-ratio:1;
  display:flex;align-items:center;justify-content:center}
.g-lotus{width:100%;height:100%;overflow:visible;cursor:pointer;
  filter:drop-shadow(0 8px 18px rgba(120,70,0,.18))}
.g-petal{transform-box:view-box;
  transition:transform 1.1s cubic-bezier(.2,.8,.25,1),opacity 1s ease}
.g-bud{transition:opacity .8s ease}
/* The breathing guide animates transform only — never the SVG r attribute. */
.g-breath{fill:none;stroke:var(--saffron);stroke-width:1.4;opacity:0;
  transform-box:fill-box;transform-origin:center}
.g-lotuswrap.is-breathing .g-breath{animation:g-breathe 12s ease-in-out infinite}
@keyframes g-breathe{
  0%{opacity:0;transform:scale(.72)}
  33%{opacity:.55;transform:scale(1)}
  50%{opacity:.55;transform:scale(1)}
  100%{opacity:0;transform:scale(1.32)}
}
.g-budmark{position:absolute;top:50%;left:50%;width:15%;aspect-ratio:1;
  transform:translate(-50%,-50%);display:grid;place-items:center;z-index:2;
  pointer-events:none;color:#7E2424}
.g-budmark svg{width:100%;height:100%}
@media (prefers-reduced-motion: reduce){
  .g-lotuswrap.is-breathing .g-breath{animation:none;opacity:.35;transform:scale(1)}
  .g-petal{transition:none}
}

/* ============================================================
   LEADERBOARD · shared schema, one key for all six games
   ============================================================ */
function lbAll() {
  var o = parseJSON(rawGet(LB_KEY), {});
  return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
}
function lbList() {
  var l = lbAll()[GAME_ID];
  if (!Array.isArray(l)) return [];
  var out = [];
  for (var i = 0; i < l.length; i++) {
    var e = l[i];
    if (!e || typeof e !== 'object') continue;
    out.push({
      name: sanitizeName(e.name), level: String(e.level || ''), levelKey: String(e.levelKey || ''),
      duration: Math.max(0, Math.floor(Number(e.duration) || 0)),
      score: Math.max(0, Math.floor(Number(e.score) || 0)),
      meta: (e.meta && typeof e.meta === 'object') ? e.meta : {},
      ts: Math.floor(Number(e.ts) || Date.now())
    });
  }
  out.sort(lbCmp);
  return out;
}
function lbCmp(a, b) { return LB_CMP(a, b); }
function lbSave(entry) {
  var all = lbAll();
  var list = Array.isArray(all[GAME_ID]) ? all[GAME_ID] : [];
  list.push(entry);
  list.sort(lbCmp);
  if (list.length > LB_MAX) list = list.slice(0, LB_MAX);
  all[GAME_ID] = list;
  var okSave = rawSet(LB_KEY, JSON.stringify(all));
  var rank = 0;
  for (var i = 0; i < list.length; i++) {
    if (list[i].ts === entry.ts && list[i].name === entry.name &&
        list[i].levelKey === entry.levelKey) { rank = i + 1; break; }
  }
  return { saved: okSave, rank: rank };
}
function lbClear() {
  var all = lbAll();
  if (Object.prototype.hasOwnProperty.call(all, GAME_ID)) {
    delete all[GAME_ID];
    rawSet(LB_KEY, JSON.stringify(all));
  }
}

var S = {
  lang: 'hi', sound: true, aud: null, cat: 'any', name: '',
  pool: [], rot: 0, phase: 'idle',
  accepted: false, current: null,
  vowsToday: 0, streakDays: 0, startedAt: 0, elapsed: 0,
  lastRank: 0, listOpen: false
};

var DATA = { kids: KIDS, adults: ADULTS };

function setScreen(name) {
  ['scrLang', 'scrAud', 'scrMain'].forEach(function (id) {
    var e = $(id);
    if (e) e.classList.toggle('is-hidden', id !== 'scr' + name.charAt(0).toUpperCase() + name.slice(1));
  });
  var rb = $('restartBtn');
  if (rb) rb.classList.toggle('is-hidden', name !== 'main');
}

/* ============================================================
   VOW LEDGER · accepted vows + day streak (ISO day keys)
   ============================================================ */
function dayKey(d) {
  var x = d || new Date();
  var m = x.getMonth() + 1, day = x.getDate();
  return x.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}
function readVows() {
  var v = parseJSON(rawGet(VOW_KEY), null);
  if (!v || typeof v !== 'object') return { last: '', streak: 0, days: {} };
  if (!v.days || typeof v.days !== 'object') v.days = {};
  v.streak = Math.max(0, Math.floor(Number(v.streak) || 0));
  return v;
}
function writeVows(v) { rawSet(VOW_KEY, JSON.stringify(v)); }

/** Record one accepted vow; recompute the streak by day-number, not string. */
function recordVow(name) {
  var v = readVows();
  var today = dayKey();
  if (!Array.isArray(v.days[today])) v.days[today] = [];
  v.days[today].push(name);

  if (v.last !== today) {
    var y = new Date();
    y.setDate(y.getDate() - 1);
    v.streak = (v.last === dayKey(y)) ? (v.streak + 1) : 1;
    v.last = today;
  }
  writeVows(v);
  S.vowsToday = v.days[today].length;
  S.streakDays = v.streak;
  return v;
}

/* ============================================================
   POOL + CHIPS
   ============================================================ */
function computePool() {
  var all = DATA[S.aud] || [];
  S.pool = (S.cat === 'any') ? all.slice() : all.filter(function (e) { return e[0] === +S.cat; });
}

function renderChips() {
  var host = $('chips');
  if (!host) return;
  host.innerHTML = '';
  var all = DATA[S.aud] || [];

  function mk(val, label) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'g-chip' + (S.cat === val ? ' is-on' : '');
    b.textContent = label;
    b.setAttribute('aria-pressed', S.cat === val ? 'true' : 'false');
    b.addEventListener('click', function () {
      if (S.phase === 'moving') return;
      S.cat = val;
      computePool();
      renderChips();
      buildRitual();
      paintMeta();
      hideResult();
      sfx.tap();
    });
    host.appendChild(b);
  }

  mk('any', t('any'));
  CATS.forEach(function (c, i) {
    var n = all.filter(function (e) { return e[0] === i + 1; }).length;
    if (!n) return;
    mk(String(i + 1), c[1] + ' ' + (S.lang === 'hi' ? c[3] : c[2]));
  });
}

function paintMeta() {
  var m = $('metaLine');
  if (!m) return;
  var who = S.aud === 'adults' ? t('whoAdults') : t('whoKids');
  m.textContent = t('meta', { n: (S.lang === 'hi' ? devNum(S.pool.length) : S.pool.length), who: who });
}

/* ============================================================
   RITUAL ART · 14 sectors (wheel) or 14 petals (lotus), one per
   category — always readable whatever the corpus size.
   ============================================================ */
var NS = 'http://www.w3.org/2000/svg';
/* Soft pastel palette with gradient feel for the wheel sectors */
var PAL = ['#E8B4B8', '#F4D03F', '#82E0AA', '#85C1E9', '#D7BDE2', '#F0B27A',
           '#A9DFBF', '#AED6F1', '#F5CBA7', '#D2B4DE', '#FAD7A0', '#A3E4D7',
           '#F1948A', '#BB8FCE'];

function sectorPath(cx, cy, r, a0, a1) {
  var p0 = [cx + r * Math.cos(a0), cy + r * Math.sin(a0)];
  var p1 = [cx + r * Math.cos(a1), cy + r * Math.sin(a1)];
  var large = (a1 - a0) > Math.PI ? 1 : 0;
  return 'M' + cx + ' ' + cy + ' L' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
         ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) + ' Z';
}

function buildRitual() {
  if (RITUAL === 'wheel') buildWheel();
  else buildLotus();
}

function buildWheel() {
  var g = $('wheelG');
  if (!g) return;
  g.innerHTML = '';
  var n = CATS.length, cx = 200, cy = 200, R = 186, step = (Math.PI * 2) / n;

  for (var i = 0; i < n; i++) {
    var a0 = i * step - Math.PI / 2;
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', sectorPath(cx, cy, R, a0, a0 + step));
    p.setAttribute('fill', PAL[i % PAL.length]);
    p.setAttribute('stroke', '#FFF8F0');
    p.setAttribute('stroke-width', '1.6');
    p.setAttribute('opacity', '0.92');
    g.appendChild(p);

    /* No text labels on the wheel — category names live in the chips above */
  }
  g.style.transform = 'rotate(' + S.rot + 'deg)';
}

function buildLotus() {
  var g = $('petalG');
  if (!g) return;
  g.innerHTML = '';
  var n = CATS.length;
  for (var i = 0; i < n; i++) {
    var ang = i * (360 / n);
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M180 180 C 150 122, 150 74, 180 46 C 210 74, 210 122, 180 180 Z');
    p.setAttribute('fill', PAL[i % PAL.length]);
    p.setAttribute('opacity', '0.88');
    p.setAttribute('stroke', '#FFF8F0');
    p.setAttribute('stroke-width', '1.2');
    p.setAttribute('class', 'g-petal');
    p.setAttribute('data-ang', String(ang));
    p.setAttribute('data-cat', String(i + 1));
    p.style.transformOrigin = '180px 180px';
    p.style.transform = 'rotate(' + ang + 'deg) scale(.34)';
    g.appendChild(p);
  }
  resetLotus();
}

function resetLotus() {
  var ps = document.querySelectorAll('.g-petal');
  for (var i = 0; i < ps.length; i++) {
    ps[i].style.transform = 'rotate(' + ps[i].getAttribute('data-ang') + 'deg) scale(.34)';
    ps[i].style.opacity = '0.88';
  }
  var wrap = $('lotusWrap');
  if (wrap) wrap.classList.remove('is-breathing');
}


/* ============================================================
   DRAW · the ritual resolves a category, then a vow within it
   ============================================================ */
function beginRitual() {
  if (S.phase === 'moving' || !S.pool.length) return;
  S.phase = 'moving';
  S.accepted = false;
  hideResult();
  if (!S.startedAt) S.startedAt = Date.now();

  var btn = $('actBtn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = RITUAL === 'wheel' ? t('wheelTurning') : t('lotusBlooming');
  }
  var hint = $('hintLine');
  if (hint) hint.textContent = t('hintBreath');

  /* Which category does the ritual land on? */
  var catNo;
  if (S.cat === 'any') {
    var present = [];
    CATS.forEach(function (c, i) {
      if (S.pool.some(function (e) { return e[0] === i + 1; })) present.push(i + 1);
    });
    catNo = present.length ? pick(present) : 1;
  } else {
    catNo = +S.cat;
  }
  var inCat = S.pool.filter(function (e) { return e[0] === catNo; });
  var vow = inCat.length ? pick(inCat) : pick(S.pool);

  if (RITUAL === 'wheel') spinTo(catNo, vow);
  else bloomTo(catNo, vow);
}

function spinTo(catNo, vow) {
  var n = CATS.length, step = 360 / n;
  var target = -((catNo - 1) * step + step / 2);
  var base = ((S.rot % 360) + 360) % 360;
  var delta = (target - base) % 360;
  if (delta < 0) delta += 360;
  var turns = reduced() ? 0 : 4;
  var finalRot = S.rot + turns * 360 + delta;
  var g = $('wheelG');
  if (g) {
    g.style.transition = reduced() ? 'none' : 'transform 5.6s cubic-bezier(.12,.64,.08,1)';
    g.style.transform = 'rotate(' + finalRot + 'deg)';
  }
  S.rot = finalRot;
  bell(0.05);
  setTimeout(function () { reveal(vow); }, reduced() ? 120 : 5750);
}

function bloomTo(catNo, vow) {
  var wrap = $('lotusWrap');
  if (wrap && S.aud !== 'kids' && !reduced()) wrap.classList.add('is-breathing');
  var ps = document.querySelectorAll('.g-petal');
  for (var i = 0; i < ps.length; i++) {
    (function (p, k) {
      setTimeout(function () {
        p.style.transform = 'rotate(' + p.getAttribute('data-ang') + 'deg) scale(1)';
        if (!reduced()) tone(560 + k * 14, 0.05, 'sine', 0.022);
      }, reduced() ? 0 : k * 62);
    })(ps[i], i);
  }
  bell(0.05);
  var settle = reduced() ? 120 : (S.aud === 'kids' ? 900 : 2400);
  setTimeout(function () {
    var chosen = document.querySelector('.g-petal[data-cat="' + catNo + '"]');
    if (chosen) chosen.style.opacity = '1';
    if (wrap) wrap.classList.remove('is-breathing');
    reveal(vow);
  }, settle);
}

function reveal(vow) {
  S.phase = 'shown';
  S.current = vow;
  var cat = CATS[vow[0] - 1];
  var L = S.lang === 'hi' ? 4 : 1;

  var rc = $('rCat');
  if (rc) rc.textContent = cat[1] + '  ' + t('catLbl') + ' · ' +
    (S.lang === 'hi' ? cat[3] : cat[2]) + ' · ' + cat[4];
  var rn = $('rName');
  if (rn) rn.textContent = vow[L];
  var rp = $('rP');
  if (rp) rp.textContent = vow[L + 1];
  var rt = $('rT');
  if (rt) rt.textContent = vow[L + 2];
  var ch = $('rCheer');
  if (ch) ch.textContent = pick(t('cheers'));

  var ab = $('acceptBtn');
  if (ab) { ab.textContent = t('accept'); ab.classList.remove('is-done'); ab.disabled = false; }
  var card = $('resultCard');
  if (card) card.classList.remove('is-hidden');

  var btn = $('actBtn');
  if (btn) {
    btn.disabled = false;
    btn.textContent = RITUAL === 'wheel' ? t('wheelSpin') : t('lotusBloom');
  }
  var hint = $('hintLine');
  if (hint) hint.textContent = S.aud === 'kids' ? t('hintKids') : t('hintIdle');

  petals(reduced() ? 0 : 20);
  sfx.match();
  say(t('resTitle') + ': ' + vow[L]);
}

function hideResult() {
  var card = $('resultCard');
  if (card) card.classList.add('is-hidden');
}

function say(msg) { var e = $('live'); if (e) e.textContent = msg; }


/* ============================================================
   ACCEPT · records the vow, the day streak and the leaderboard row
   ============================================================ */
function acceptVow() {
  if (S.accepted || !S.current) return;
  S.accepted = true;
  var name = S.current[S.lang === 'hi' ? 4 : 1];
  recordVow(name);

  var ab = $('acceptBtn');
  if (ab) { ab.textContent = t('accepted'); ab.classList.add('is-done'); ab.disabled = true; }

  S.elapsed = S.startedAt ? Math.floor((Date.now() - S.startedAt) / 1000) : 0;
  var entry = {
    name: S.name || '',
    level: S.aud === 'adults' ? t('whoAdults') : t('whoKids'),
    levelKey: S.aud === 'adults' ? 'adults' : 'kids',
    duration: S.elapsed,
    score: S.vowsToday,
    meta: { vows: S.vowsToday, streakDays: S.streakDays },
    ts: Date.now()
  };
  var res = lbSave(entry);
  S.lastRank = res.saved ? res.rank : 0;

  paintStreak();
  renderTodayList();
  petals(reduced() ? 0 : 18);
  bell(0.06);
  toast(t('toastAcc'));
  if (S.streakDays > 1) setTimeout(function () {
    toast(t('toastStreak', { n: S.lang === 'hi' ? devNum(S.streakDays) : S.streakDays }));
  }, 1500);
}

function paintStreak() {
  var p = $('streakPill');
  if (!p) return;
  if (S.streakDays > 0) {
    p.textContent = t('streak', { n: S.lang === 'hi' ? devNum(S.streakDays) : S.streakDays });
    p.classList.remove('is-hidden');
  } else {
    p.classList.add('is-hidden');
  }
}

function renderTodayList() {
  var host = $('todayList');
  if (!host) return;
  host.innerHTML = '';
  var v = readVows();
  var list = v.days[dayKey()] || [];
  if (!list.length) {
    var e = document.createElement('p');
    e.className = 'g-lb-empty';
    e.textContent = t('noVowsYet');
    host.appendChild(e);
    return;
  }
  var h = document.createElement('h4');
  h.className = 'g-review-title';
  h.textContent = t('reviewTitle') + ' · ' + (S.lang === 'hi' ? devNum(list.length) : list.length);
  host.appendChild(h);
  var ul = document.createElement('ul');
  ul.style.cssText = 'list-style:none;padding:0;margin:0';
  list.forEach(function (nm, i) {
    var li = document.createElement('li');
    li.style.cssText = 'padding:7px 2px;border-top:1px dashed #EADBC0;font-size:.86rem';
    li.textContent = (S.lang === 'hi' ? devNum(i + 1) : (i + 1)) + '.  ' + nm;
    ul.appendChild(li);
  });
  host.appendChild(ul);
}

/* ============================================================
   FULL LIST · every niyam, grouped by the 14 categories
   ============================================================ */
function renderFullList() {
  var host = $('listBody');
  if (!host) return;
  host.innerHTML = '';
  var all = DATA[S.aud] || [];
  var title = $('listTitle');
  if (title) {
    title.textContent = t('listTitle', {
      who: S.aud === 'adults' ? t('whoAdults') : t('whoKids'),
      n: (S.lang === 'hi' ? devNum(all.length) : all.length)
    });
  }
  var L = S.lang === 'hi' ? 4 : 1;
  var labP = t('labP').split('·')[0].trim();
  var labT = t('labT').split('·')[0].trim();

  CATS.forEach(function (c, ci) {
    var items = all.filter(function (e) { return e[0] === ci + 1; });
    if (!items.length) return;

    var grp = document.createElement('div');
    grp.className = 'g-grp';

    var head = document.createElement('button');
    head.type = 'button';
    head.className = 'g-grp-head';
    head.setAttribute('aria-expanded', 'false');
    var lbl = document.createElement('span');
    lbl.textContent = c[1] + ' ' + (S.lang === 'hi' ? c[3] : c[2]) + ' · ' + c[4];
    var cnt = document.createElement('span');
    cnt.className = 'g-grp-cnt';
    cnt.textContent = S.lang === 'hi' ? devNum(items.length) : String(items.length);
    head.appendChild(lbl);
    head.appendChild(cnt);

    var bodyEl = document.createElement('div');
    bodyEl.className = 'g-grp-body is-hidden';
    items.forEach(function (e) {
      var row = document.createElement('div');
      row.className = 'g-nrow';
      var nm = document.createElement('div');
      nm.className = 'g-ntitle';
      nm.textContent = e[L];
      var sub = document.createElement('div');
      sub.className = 'g-nsub';
      var b1 = document.createElement('b');
      b1.textContent = labP + ': ';
      sub.appendChild(b1);
      sub.appendChild(document.createTextNode(e[L + 1]));
      sub.appendChild(document.createElement('br'));
      var b2 = document.createElement('b');
      b2.textContent = labT + ': ';
      sub.appendChild(b2);
      sub.appendChild(document.createTextNode(e[L + 2]));
      row.appendChild(nm);
      row.appendChild(sub);
      bodyEl.appendChild(row);
    });

    head.addEventListener('click', function () {
      var open = bodyEl.classList.toggle('is-hidden');
      head.setAttribute('aria-expanded', open ? 'false' : 'true');
      sfx.tap();
    });
    grp.appendChild(head);
    grp.appendChild(bodyEl);
    host.appendChild(grp);
  });
}


/* ============================================================
   LEADERBOARD
   ============================================================ */
function renderLbInto(id) {
  var host = $(id);
  if (!host) return;
  host.innerHTML = '';
  var list = lbList();
  if (!list.length) {
    var p = document.createElement('p');
    p.className = 'g-lb-empty';
    p.textContent = t('lbEmpty');
    host.appendChild(p);
    return;
  }
  var wrap = document.createElement('div');
  wrap.className = 'g-tablewrap';
  var tb = document.createElement('table');
  tb.className = 'g-table';
  var thead = document.createElement('thead');
  var hr = document.createElement('tr');
  [t('thRank'), t('thLbName'), t('thLbLevel'), t('thLbVows'), t('thLbTime')].forEach(function (h) {
    var th = document.createElement('th');
    th.textContent = h;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  tb.appendChild(thead);
  var body = document.createElement('tbody');
  var medals = ['\uD83E\uDD47', '\uD83E\uDD48', '\uD83E\uDD49'];
  list.slice(0, 10).forEach(function (e, i) {
    var tr = document.createElement('tr');
    var vals = [
      i < 3 ? medals[i] : String(i + 1),
      e.name || '—',
      e.level || e.levelKey || '—',
      (S.lang === 'hi' ? devNum((e.meta && e.meta.vows) || 0) : String((e.meta && e.meta.vows) || 0)),
      fmtClock(e.duration)
    ];
    vals.forEach(function (v, ci) {
      var td = document.createElement('td');
      td.textContent = v;                 // textContent only, never innerHTML
      if (ci === 0 && i < 3) td.className = 'g-medalcell';
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  tb.appendChild(body);
  wrap.appendChild(tb);
  host.appendChild(wrap);
}

function clearLb() {
  askDialog(t('lbConfirmTitle'), t('lbConfirmBody'), t('lbConfirmYes'), t('lbConfirmNo'), function () {
    lbClear();
    renderLbInto('lbBody');
    renderLbInto('resLbBody');
    toast(t('lbCleared'));
  });
}


/* ============================================================
   RENDER · a pure function of state, so a live language switch
   never loses the vow, the streak or the opened list.
   ============================================================ */
function applyText() {
  document.documentElement.lang = (S.lang === 'hi') ? 'hi' : 'en';
  document.title = (S.lang === 'hi' ? 'नियम · Daily Vow' : 'Daily Vow · नियम');

  var mark = $('brandMark');
  if (mark) mark.innerHTML = artSwastika();
  /* Ritual centres: the wheel hub takes a symmetric mandala, the lotus bud
     takes the Jain Swastika. Both are SVG paths, so neither can ever mirror. */
  var hub = $('wheelHub');
  if (hub) hub.innerHTML = artRosette();
  var bud = $('budMark');
  if (bud) bud.innerHTML = artSwastika();
  var bh = $('brandHi'); if (bh) bh.textContent = t('brandHi');
  var be = $('brandEn'); if (be) be.textContent = t('brandEn');
  var lb = $('langBtn'); if (lb) lb.textContent = t('langSwitch');
  var hb = $('hubBtn'); if (hb) hb.textContent = t('hub');
  var rb = $('restartBtn'); if (rb) rb.textContent = t('restart');
  paintSound();

  var s1t = $('s1Title'); if (s1t) s1t.textContent = t('s1Title');
  var s1s = $('s1Sub'); if (s1s) s1s.textContent = t('s1Sub');
  var glyph = $('langGlyph'); if (glyph) glyph.innerHTML = artRosette();

  var s2t = $('s2Title'); if (s2t) s2t.textContent = t('s2Title');
  var s2s = $('s2Sub'); if (s2s) s2s.textContent = t('s2Sub');
  var kl = $('kidsLbl'); if (kl) kl.textContent = t('kids');
  var kn = $('kidsNote'); if (kn) kn.textContent = t('kidsNote');
  var al = $('adultsLbl'); if (al) al.textContent = t('adults');
  var an = $('adultsNote'); if (an) an.textContent = t('adultsNote');

  var ct = $('catTitle'); if (ct) ct.textContent = t('catTitle');
  var ab = $('actBtn');
  if (ab && S.phase !== 'moving') {
    ab.textContent = RITUAL === 'wheel' ? t('wheelSpin') : t('lotusBloom');
  }
  var hint = $('hintLine');
  if (hint && S.phase !== 'moving') {
    hint.textContent = S.aud === 'kids' ? t('hintKids') : t('hintIdle');
  }
  var lp = $('labP'); if (lp) lp.textContent = t('labP');
  var lt = $('labT'); if (lt) lt.textContent = t('labT');
  var rtT = $('resTitle'); if (rtT) rtT.textContent = t('resTitle');
  var accB = $('acceptBtn');
  if (accB) accB.textContent = S.accepted ? t('accepted') : t('accept');
  var agB = $('againBtn'); if (agB) agB.textContent = t('again');
  var liB = $('listBtn'); if (liB) liB.textContent = S.listOpen ? t('hideList') : t('list');

  var nl = $('nameLabel'); if (nl) nl.textContent = t('nameLabel');
  var ni = $('nameInput'); if (ni) ni.placeholder = t('namePh');
  var no = $('nameNote'); if (no) no.textContent = t('nameOptional');

  var lbt = $('lbTitle'); if (lbt) lbt.textContent = t('lbTitle');
  var lbc = $('lbClearBtn'); if (lbc) lbc.textContent = t('lbClear');
  var rlt = $('resLbTitle'); if (rlt) rlt.textContent = t('lbTitle');
  var rlc = $('resLbClearBtn'); if (rlc) rlc.textContent = t('lbClear');
  var ft = $('footTxt'); if (ft) ft.textContent = t('foot');

  if (S.aud) {
    renderChips();
    paintMeta();
    buildRitual();
    renderFullList();
    renderTodayList();
    paintStreak();
    /* Re-label the open vow in the new language without re-running the ritual. */
    if (S.current) {
      var cat = CATS[S.current[0] - 1];
      var L = S.lang === 'hi' ? 4 : 1;
      var rc = $('rCat');
      if (rc) rc.textContent = cat[1] + '  ' + t('catLbl') + ' · ' +
        (S.lang === 'hi' ? cat[3] : cat[2]) + ' · ' + cat[4];
      var rn = $('rName'); if (rn) rn.textContent = S.current[L];
      var rp = $('rP'); if (rp) rp.textContent = S.current[L + 1];
      var rq = $('rT'); if (rq) rq.textContent = S.current[L + 2];
      $('resultCard').classList.remove('is-hidden');
    }
    if (!$('lbPanel').classList.contains('is-hidden')) renderLbInto('lbBody');
    if (!$('resLbPanel').classList.contains('is-hidden')) renderLbInto('resLbBody');
  }
}

function paintSound() {
  var b = $('sndBtn');
  if (!b) return;
  b.innerHTML = artBell(S.sound);
  b.setAttribute('aria-pressed', S.sound ? 'true' : 'false');
  b.setAttribute('aria-label', S.sound ? t('soundOn') : t('soundOff'));
  b.title = S.sound ? t('soundOn') : t('soundOff');
}


/* ============================================================
   WIRING
   ============================================================ */
function setLang(lang) {
  S.lang = (lang === 'en') ? 'en' : 'hi';
  writePrefs({ lang: S.lang });
  applyText();            // text only — the vow, streak and list state survive
}

function chooseAud(aud) {
  S.aud = aud;
  S.cat = 'any';
  S.phase = 'idle';
  S.current = null;
  S.accepted = false;
  writePrefs({ aud: aud });
  var v = readVows();
  S.streakDays = v.streak || 0;
  S.vowsToday = (v.days[dayKey()] || []).length;
  computePool();
  hideResult();
  setScreen('main');
  applyText();
  var lp = $('listPanel');
  if (lp) { lp.classList.add('is-hidden'); S.listOpen = false; }
  bell(0.045);
}

document.querySelectorAll('[data-lang]').forEach(function (b) {
  b.addEventListener('click', function () {
    ac();
    setLang(b.dataset.lang);
    sfx.tap();
    setScreen('aud');
  });
});
document.querySelectorAll('[data-aud]').forEach(function (b) {
  b.addEventListener('click', function () { ac(); chooseAud(b.dataset.aud); });
});

var langBtn = $('langBtn');
if (langBtn) langBtn.addEventListener('click', function () {
  ac();
  setLang(S.lang === 'hi' ? 'en' : 'hi');
  sfx.tap();
});

var sndBtn = $('sndBtn');
if (sndBtn) sndBtn.addEventListener('click', function () {
  S.sound = !S.sound;
  writePrefs({ sound: S.sound });
  paintSound();
  if (S.sound) { ac(); sfx.tap(); }
});

var hubBtn = $('hubBtn');
if (hubBtn) hubBtn.addEventListener('click', function () {
  sfx.tap();
  try {
    if (window.parent && window.parent !== window && window.parent.location) {
      window.parent.location.hash = '#/kids';
      return;
    }
  } catch (e) { /* cross-origin: fall through to the file hub */ }
  window.location.href = 'index.html';
});

var restartBtn = $('restartBtn');
if (restartBtn) restartBtn.addEventListener('click', function () {
  sfx.tap();
  S.aud = null; S.cat = 'any'; S.phase = 'idle'; S.current = null; S.accepted = false;
  hideResult();
  setScreen('lang');
});

var actBtn = $('actBtn');
if (actBtn) actBtn.addEventListener('click', function () { ac(); beginRitual(); });

var ritualStage = RITUAL === 'wheel' ? $('wheelSvg') : $('lotusSvg');
if (ritualStage) ritualStage.addEventListener('click', function () {
  if (S.phase !== 'moving') { ac(); beginRitual(); }
});

var acceptBtn = $('acceptBtn');
if (acceptBtn) acceptBtn.addEventListener('click', acceptVow);

var againBtn = $('againBtn');
if (againBtn) againBtn.addEventListener('click', function () { ac(); beginRitual(); });

var listBtn = $('listBtn');
if (listBtn) listBtn.addEventListener('click', function () {
  var p = $('listPanel');
  if (!p) return;
  S.listOpen = p.classList.toggle('is-hidden') ? false : true;
  listBtn.textContent = S.listOpen ? t('hideList') : t('list');
  if (S.listOpen) renderFullList();
  sfx.tap();
});

var nameInput = $('nameInput');
if (nameInput) nameInput.addEventListener('input', function () {
  S.name = sanitizeName(nameInput.value);
  writePrefs({ name: S.name });
});

[['lbBtn', 'lbPanel'], ['resLbBtn', 'resLbPanel']].forEach(function (pair) {
  var b = $(pair[0]), p = $(pair[1]);
  if (!b || !p) return;
  b.addEventListener('click', function () {
    p.classList.toggle('is-hidden');
    if (!p.classList.contains('is-hidden')) renderLbInto(p.id === 'lbPanel' ? 'lbBody' : 'resLbBody');
    sfx.tap();
  });
});
[['lbClearBtn'], ['resLbClearBtn']].forEach(function (pair) {
  var b = $(pair[0]);
  if (b) b.addEventListener('click', clearLb);
});

/* ============================================================
   BOOT
   ============================================================ */
function parseQuery() {
  var q = {};
  try {
    var sp = new URLSearchParams(window.location.search || '');
    sp.forEach(function (v, k) { q[k] = v; });
  } catch (e) { q = {}; }
  return q;
}

function boot() {
  var prefs = readPrefs();
  S.lang = (prefs.lang === 'en') ? 'en' : 'hi';
  S.sound = prefs.sound !== false;
  S.name = prefs.name || '';
  if (nameInput) nameInput.value = S.name;

  var q = parseQuery();
  if (q.lang === 'en' || q.lang === 'hi') S.lang = q.lang;
  if (q.embed === '1' && hubBtn) hubBtn.classList.add('is-hidden');

  writePrefs({ lang: S.lang, sound: S.sound, lastGame: GAME_ID });
  applyText();

  /* ?lang=&aud= skip both gates; the header pill still switches live. */
  if (q.lang && (q.aud === 'kids' || q.aud === 'adults')) chooseAud(q.aud);
  else if (q.lang) setScreen('aud');
  else setScreen('lang');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
