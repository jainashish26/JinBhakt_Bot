<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6D1B2F">
<meta name="description" content="भोजन को जैन-अनुकूल या जैन-प्रतिकूल में बाँटिए — हर उत्तर के साथ उसका कारण भी। Sort food into Jain-friendly or not, with the reason behind every answer — 97 items across 12 categories.">
<title>सात्त्विक रसोई · Sattvic Chef</title>
<style>
/* ============================================================
   स्मृति पट्ट · Memory Match
   Single file · no CDN · no images · no external fonts
   Motion: transform + opacity only · honours prefers-reduced-motion
   ============================================================ */
:root{
  --saffron:#E8800C; --maroon:#6D1B2F; --gold:#C8860A; --cream:#FFF8F0;
  --warm:#FFFBF5; --ink:#2D1B06; --ink2:#5C3D1E; --border:#D4A574;
  --success:#2E7D32; --rose:#B23A3A; --leaf:#3F7D4F; --info:#1565C0;
  --card-line:#EADBC0;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-full:9999px;
  --sh-sm:0 1px 3px rgba(45,27,6,.08), 0 1px 2px rgba(45,27,6,.06);
  --sh-md:0 4px 12px rgba(45,27,6,.10), 0 2px 4px rgba(45,27,6,.06);
  --sh-lg:0 10px 25px rgba(45,27,6,.12), 0 4px 8px rgba(45,27,6,.06);
  --fast:.15s ease; --base:.25s ease; --slow:.4s ease;
  --ritual:.7s cubic-bezier(.2,.7,.2,1);
  --font-head:'Noto Serif Devanagari', Georgia, 'Times New Roman', serif;
  --font-body:'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
@media (max-width:480px){html{font-size:15px}}
body{
  font-family:var(--font-body);color:var(--ink);line-height:1.6;min-height:100vh;
  background:
    radial-gradient(900px 480px at 50% -10%, #FFF6E2 0%, transparent 62%),
    linear-gradient(165deg,#FDF8EE,#F7ECD6 60%,#F1E2C4);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
img,svg{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:var(--r-sm)}
.is-hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

.g-wrap{max-width:900px;margin:0 auto;padding:14px 14px 40px}

/* ---------- header ---------- */
.g-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 2px 14px}
.g-brand{display:flex;align-items:center;gap:9px;min-width:0}
.g-mark{width:30px;height:30px;flex-shrink:0;color:var(--saffron)}
.g-brand-txt{display:flex;flex-direction:column;min-width:0}
.g-brand-hi{font-family:var(--font-head);font-weight:700;font-size:1.02rem;
  color:var(--maroon);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-brand-en{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);opacity:.85}
.g-head-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.g-pill{border:1.5px solid var(--border);background:rgba(255,255,255,.72);
  border-radius:var(--r-full);padding:6px 13px;font-weight:600;font-size:.76rem;
  color:#7A5A12;transition:background var(--fast),transform var(--fast);white-space:nowrap;min-height:36px}
.g-pill:hover{background:#fff;transform:translateY(-1px)}
.g-iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r-full);
  border:1.5px solid var(--border);background:rgba(255,255,255,.72);color:var(--maroon);
  transition:background var(--fast)}
.g-iconbtn:hover{background:#fff}
.g-iconbtn svg{width:19px;height:19px}

/* ---------- screens ---------- */
.g-screen{animation:g-rise .5s cubic-bezier(.2,.7,.2,1)}
@keyframes g-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.g-card{background:var(--warm);border:1px solid var(--card-line);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:26px 20px;margin:14px 0;text-align:center}
.g-rule{width:56px;height:2px;margin:0 auto 18px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.g-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);
  font-size:clamp(1.4rem,4.6vw,2rem);line-height:1.25;margin-bottom:.25em}
.g-sub{color:var(--ink2);font-size:.95rem;max-width:46ch;margin:0 auto 1.2em}
.g-glyph{display:block;width:64px;height:64px;margin:0 auto 10px;color:var(--saffron)}
.g-glyph svg{width:100%;height:100%}

/* ---------- choice tiles ---------- */
.g-choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.g-choice{border:1.5px solid var(--border);background:rgba(255,255,255,.62);
  border-radius:var(--r-lg);padding:18px 20px;min-width:140px;flex:0 1 190px;
  color:var(--maroon);text-align:center;
  transition:transform var(--base),background var(--base),border-color var(--base),box-shadow var(--base)}
.g-choice:hover{transform:translateY(-3px);background:#fff;box-shadow:var(--sh-md);border-color:var(--saffron)}
.g-choice.is-on{border-color:var(--maroon);background:#fff;box-shadow:0 0 0 2px rgba(109,27,47,.16)}
.g-choice-mark{width:34px;height:34px;margin:0 auto 8px;color:var(--saffron)}
.g-choice-name{display:block;font-family:var(--font-head);font-weight:700;font-size:1.02rem}
.g-choice-note{display:block;font-size:.74rem;color:var(--ink2);margin-top:3px;opacity:.9}
@media (pointer:coarse){.g-choice{min-height:44px}}

/* ---------- setup form ---------- */
.g-field{text-align:left;margin:20px auto 0;max-width:540px}
.g-label{display:block;font-weight:700;font-size:.84rem;color:var(--maroon);margin-bottom:8px;
  letter-spacing:.02em}
.g-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--r-md);
  background:#fff;font-size:1rem;min-height:46px;transition:border-color var(--fast)}
.g-input:focus{border-color:var(--saffron);outline:none}
.g-chips{display:flex;flex-wrap:wrap;gap:8px}
.g-chip{border:1.5px solid var(--border);background:rgba(255,255,255,.7);
  border-radius:var(--r-full);padding:8px 15px;font-size:.84rem;font-weight:600;color:#6B5733;
  min-height:42px;transition:background var(--fast),border-color var(--fast),color var(--fast)}
.g-chip:hover{background:#fff;border-color:var(--saffron)}
.g-chip.is-on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.g-hint{font-size:.8rem;color:var(--ink2);margin-top:16px;font-style:italic}

/* ---------- buttons ---------- */
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1.5px solid var(--border);background:rgba(255,255,255,.75);border-radius:var(--r-full);
  padding:12px 26px;font-weight:700;font-size:.95rem;color:#7A5A12;min-height:46px;
  transition:transform var(--fast),background var(--fast),box-shadow var(--fast)}
.g-btn:hover{background:#fff;transform:translateY(-2px);box-shadow:var(--sh-sm)}
.g-btn-primary{background:linear-gradient(180deg,var(--saffron),#D0710A);border-color:#B85F08;
  color:#fff;box-shadow:0 3px 0 #A85607}
.g-btn-primary:hover{background:linear-gradient(180deg,#F08C15,var(--saffron));color:#fff}
.g-btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #A85607}
.g-btn-primary:disabled{background:#D9CDB8;border-color:#C9BCA5;box-shadow:none;color:#8B7C63;
  cursor:not-allowed;transform:none}
.g-btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.g-btn-sm{padding:8px 16px;font-size:.82rem;min-height:38px}

/* ---------- HUD ---------- */
.g-hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:rgba(255,255,255,.6);border:1px solid var(--card-line);border-radius:var(--r-lg);
  padding:10px 12px;margin:6px 0 14px}
.g-stat{display:flex;flex-direction:column;align-items:center;min-width:66px;padding:2px 8px}
.g-stat-val{font-family:var(--font-head);font-weight:700;font-size:1.15rem;color:var(--maroon);
  line-height:1.15;font-variant-numeric:tabular-nums}
.g-stat-lbl{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);opacity:.85}
.g-hud-sep{width:1px;height:26px;background:var(--card-line)}
.g-progress{height:6px;background:rgba(212,165,116,.32);border-radius:var(--r-full);
  overflow:hidden;width:100%;margin-top:4px}
.g-progress-fill{height:100%;width:100%;border-radius:var(--r-full);transform-origin:left center;
  transform:scaleX(0);background:linear-gradient(90deg,var(--gold),var(--saffron));
  transition:transform var(--slow)}

/* ---------- memory grid ---------- */
.g-board{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);margin:4px 0 8px;
  perspective:1200px}
@media (min-width:620px){.g-board[data-cols="12"]{grid-template-columns:repeat(6,1fr)}}
@media (max-width:400px){.g-board{gap:7px}}
/* tight board: cards fill cells, no aspect-ratio constraint */
.g-board.is-tight{grid-auto-rows:1fr}
.g-board.is-tight .g-cardflip{aspect-ratio:auto;height:100%;min-height:0}
.g-board.is-tight .g-face{padding:4px 3px;gap:3px}
.g-board.is-tight .g-face-back .g-art{width:28px;height:28px}
.g-board.is-tight .g-face-back .g-txt{font-size:.62rem}
.g-board.is-tight .g-face-back .g-sub2{font-size:.54rem}
.g-board.is-tight .g-face-front svg{width:44%;height:auto}

/* The flip lives on the WRAPPER only. Neither face is itself rotated, so no
   glyph can ever be painted mirrored. The hidden face also drops to
   opacity 0 after the turn, which makes a mirrored render impossible even
   where backface-visibility is unsupported. */
.g-cardflip{position:relative;aspect-ratio:3/4;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.g-cardflip.is-flipped{transform:rotateY(180deg)}
.g-face{position:absolute;inset:0;border-radius:var(--r-md);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:8px 6px;text-align:center;overflow:hidden;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  transition:opacity .2s linear .35s, box-shadow var(--base)}
.g-cardflip.is-flipped .g-face-front{opacity:0}
.g-cardflip:not(.is-flipped) .g-face-back{opacity:0}
.g-face-front{background:linear-gradient(150deg,#FBEBCB,#F2DCB0);
  border:1.5px solid var(--border);box-shadow:var(--sh-sm);color:var(--gold)}
.g-face-front svg{width:64%;height:auto;color:var(--gold);opacity:.85}
.g-face-back{transform:rotateY(180deg);background:#fff;border:1.5px solid var(--card-line);
  box-shadow:var(--sh-sm);color:var(--ink)}
.g-face-back .g-art{width:44px;height:44px;flex-shrink:0}
.g-face-back .g-txt{font-size:.74rem;font-weight:700;line-height:1.3;color:var(--maroon);
  overflow-wrap:anywhere}
.g-face-back .g-sub2{font-size:.64rem;color:var(--ink2);opacity:.85;line-height:1.25}
.g-cardflip.is-matched{cursor:default}
.g-cardflip.is-matched .g-face-back{border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(200,134,10,.28), var(--sh-md)}
.g-cardflip.is-matched .g-face-back .g-txt{color:var(--leaf)}
.g-cardflip.is-wrong{animation:g-sway .42s ease}
@keyframes g-sway{0%,100%{transform:rotateY(180deg) translateX(0)}
  25%{transform:rotateY(180deg) translateX(-4px)}
  75%{transform:rotateY(180deg) translateX(4px)}}
.g-cardflip.is-hint .g-face-back{box-shadow:0 0 0 3px rgba(232,128,12,.45)}
@media (max-width:400px){
  .g-face-back .g-art{width:32px;height:32px}
  .g-face-back .g-txt{font-size:.66rem}
  .g-face-back .g-sub2{font-size:.58rem}
}

/* ---------- result ---------- */
.g-medal{display:block;width:76px;height:76px;margin:0 auto 8px;color:var(--gold);
  animation:g-bloom .8s cubic-bezier(.2,.8,.25,1)}
.g-medal svg{width:100%;height:100%}
@keyframes g-bloom{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
.g-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0}
.g-statbox{background:#fff;border:1px solid var(--card-line);border-radius:var(--r-md);padding:13px 8px}
.g-statbox b{display:block;font-family:var(--font-head);font-size:1.4rem;color:var(--saffron);
  line-height:1.2;font-variant-numeric:tabular-nums}
.g-statbox span{display:block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink2);margin-top:3px}
.g-review{text-align:left;margin:18px auto 0;max-width:640px}
.g-review-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);
  font-size:1.02rem;text-align:center;margin-bottom:10px}
.g-tablewrap{overflow-x:auto;border:1px solid var(--card-line);border-radius:var(--r-md);background:#fff}
.g-table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:430px}
.g-table th,.g-table td{padding:9px 10px;text-align:left;border-bottom:1px solid #F1E6D2;vertical-align:top}
.g-table th{background:#FBF3E2;font-weight:700;color:var(--maroon);font-size:.7rem;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.g-table tbody tr:last-child td{border-bottom:none}
.g-table td.g-num{font-variant-numeric:tabular-nums;color:var(--ink2);width:2.4em}
.g-note{font-size:.8rem;color:var(--ink2);background:#FBF3E2;border-left:3px solid var(--gold);
  padding:9px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:14px;line-height:1.55}
.g-rank{display:inline-block;background:var(--gold);color:#4A3508;border-radius:var(--r-full);
  padding:4px 14px;font-weight:700;font-size:.8rem;margin-top:12px}

/* ---------- leaderboard ---------- */
.g-lb{text-align:left;margin-top:18px}
.g-lb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-wrap:wrap;margin-bottom:10px}
.g-lb-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);font-size:1.02rem}
.g-lb-empty{font-size:.84rem;color:var(--ink2);font-style:italic;text-align:center;padding:14px 6px}
.g-medalcell{font-weight:700;color:var(--gold);width:2.6em}

/* ---------- toast / dialog / fx ---------- */
.g-toast{position:fixed;left:50%;bottom:24px;z-index:70;max-width:min(92vw,430px);
  transform:translateX(-50%) translateY(120px);opacity:0;pointer-events:none;
  background:rgba(60,40,20,.94);color:#FFF6E2;padding:11px 20px;border-radius:var(--r-full);
  font-weight:600;font-size:.86rem;box-shadow:var(--sh-lg);text-align:center;line-height:1.45;
  transition:transform var(--slow),opacity var(--slow)}
.g-toast.is-on{transform:translateX(-50%) translateY(0);opacity:1}
.g-fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.g-fx i{position:absolute;top:-24px;display:block;
  border-radius:60% 60% 60% 60%/70% 70% 30% 30%;
  animation:g-fall linear forwards;will-change:transform,opacity}
@keyframes g-fall{to{transform:translateY(112vh) rotate(420deg);opacity:.15}}
.g-dialog{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(45,27,6,.55)}
.g-dialog-card{background:var(--warm);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);padding:26px 22px;max-width:400px;width:100%;text-align:center;
  animation:g-rise .35s cubic-bezier(.2,.7,.2,1)}
.g-dialog-card h2{font-family:var(--font-head);color:var(--maroon);font-size:1.2rem;margin-bottom:8px}
.g-dialog-card p{font-size:.9rem;color:var(--ink2);margin-bottom:6px}
.g-foot{text-align:center;color:#A08A5E;font-size:.74rem;margin:28px auto 0;line-height:1.7;
  font-style:italic;max-width:60ch}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .g-fx{display:none!important}
}

/* ---------- short desktop: compact play screens so they fit the iframe without scrolling ---------- */
@media (min-width:900px) and (max-height:880px){
  .g-wrap{padding:8px 14px 20px}
  .g-card{padding:18px 16px;margin:8px 0}
  .g-title{font-size:clamp(1.2rem,3.6vw,1.6rem);margin-bottom:.15em}
  .g-sub{font-size:.85rem;margin-bottom:.8em}
  .g-hud{padding:8px 10px;margin:4px 0 8px}
  .g-stat-val{font-size:1rem}
  .g-stat-lbl{font-size:.58rem}
  .g-btn-row{margin-top:10px}
  .g-btn{padding:10px 20px;min-height:40px;font-size:.85rem}
  .g-btn-sm{padding:7px 14px;min-height:34px;font-size:.78rem}
  .g-foot{margin:14px auto 0;font-size:.68rem}
  .g-board{margin:2px 0 6px}
  .g-cardflip{aspect-ratio:auto;min-height:0}
  .g-face{padding:6px 4px;gap:4px}
  .g-face-back .g-art{width:36px;height:36px}
  .g-face-back .g-txt{font-size:.68rem}
  .g-face-front svg{width:50%;height:auto}
  .g-medal{width:56px;height:56px}
  .g-stats{margin:12px 0;gap:8px}
  .g-statbox{padding:10px 6px}
  .g-statbox b{font-size:1.2rem}
  .g-statbox span{font-size:.6rem}
  .g-review{margin:12px auto 0}
  .g-note{margin-top:10px;padding:7px 10px;font-size:.74rem}
}

/* ---------- sorting board ---------- */
.g-sortrow{display:grid;grid-template-columns:1fr minmax(180px,250px) 1fr;gap:12px;
  align-items:stretch;margin:4px 0 10px}
@media (max-width:700px){.g-sortrow{grid-template-columns:1fr;gap:10px}}

.g-bin{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:168px;padding:16px 12px;border-radius:var(--r-lg);border:3px solid transparent;
  cursor:pointer;text-align:center;transition:transform var(--fast),box-shadow var(--fast),
  background var(--fast),border-color var(--fast);position:relative}
.g-bin-yes{background:#EDF7EE;border-color:#A9D6AC;color:#1B4D22}
.g-bin-no{background:#FDF0F0;border-color:#E8B4B8;color:#7C2230}
.g-bin:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.g-bin:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.g-bin.is-drop{transform:scale(1.03);box-shadow:0 0 0 5px rgba(232,128,12,.35)}
.g-bin.is-good{animation:g-binGood .55s ease}
.g-bin.is-bad{animation:g-binBad .55s ease}
@keyframes g-binGood{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes g-binBad{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.g-bin-mark{width:38px;height:38px;opacity:.9}
.g-bin-mark svg{width:100%;height:100%}
.g-bin-name{font-family:var(--font-head);font-weight:700;font-size:1.02rem;line-height:1.25}
.g-bin-note{font-size:.72rem;opacity:.85;font-weight:600}
.g-bin-arrow{font-size:.66rem;opacity:.7;font-weight:600;letter-spacing:.02em}

.g-foodcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:168px;padding:18px 12px;text-align:center;background:var(--warm);
  border:2px solid var(--card-line);border-radius:var(--r-lg);box-shadow:var(--sh-md);
  cursor:grab;touch-action:pan-y;user-select:none;
  transition:transform var(--base),opacity var(--base)}
.g-foodcard.is-dragging{opacity:.5;transform:rotate(3deg) scale(.97)}
.g-foodcard.is-swipeL{transform:translateX(-140px) rotate(-8deg);opacity:0}
.g-foodcard.is-swipeR{transform:translateX(140px) rotate(8deg);opacity:0}
.g-foodcard.is-hidden{display:none!important}
.g-foodcard.is-in{animation:g-rise .38s cubic-bezier(.2,.7,.2,1)}
.g-foodart{width:76px;height:76px;color:var(--maroon)}
.g-foodart svg{width:100%;height:100%}
.g-foodname{font-family:var(--font-head);font-weight:700;font-size:1.18rem;color:var(--maroon);
  line-height:1.3}
.g-foodhint{font-size:.72rem;color:var(--ink2);opacity:.85;font-style:italic}

/* ---------- teaching feedback ---------- */
.g-fb{display:flex;gap:13px;align-items:flex-start;padding:16px 16px;border-radius:var(--r-lg);
  margin:6px 0 10px;background:#fff;border:1px solid var(--card-line);
  border-left:6px solid var(--gold);box-shadow:var(--sh-sm);animation:g-rise .35s ease;
  text-align:left}
.g-fb.is-correct{border-left-color:var(--success);background:#F3FAF3}
.g-fb.is-wrong{border-left-color:var(--rose);background:#FDF4F4}
.g-fb-mark{width:34px;height:34px;flex-shrink:0;color:var(--gold)}
.g-fb-mark svg{width:100%;height:100%}
.g-fb-body{flex:1;min-width:0}
.g-fb-head{font-family:var(--font-head);font-weight:700;font-size:.98rem;color:var(--maroon);
  margin-bottom:5px}
.g-fb-verdict{font-size:.88rem;font-weight:700;margin-bottom:5px}
.g-fb.is-correct .g-fb-verdict{color:var(--leaf)}
.g-fb.is-wrong .g-fb-verdict{color:var(--rose)}
.g-fb-why{font-size:.88rem;line-height:1.6;color:#4A3C2C}
.g-fb-note{font-size:.78rem;color:var(--ink2);background:rgba(200,134,10,.10);
  border-radius:var(--r-sm);padding:7px 10px;margin-top:9px;line-height:1.5}
.g-fb-note b{color:var(--gold)}
.g-fb-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:11px}
.g-fb-tag{font-size:.72rem;font-weight:700;padding:3px 11px;border-radius:var(--r-full);
  background:#fff;border:1px solid var(--card-line);color:var(--ink2)}
.g-fb-next{margin-left:auto}
@media (max-width:700px){
  .g-fb{flex-direction:column;gap:9px}
  .g-fb-next{margin-left:0}
}

/* Short desktop: compact play screens */
@media (min-width:900px) and (max-height:880px){
  .g-sortrow{margin:2px 0 6px}
  .g-bin{min-height:120px;padding:10px 8px}
  .g-bin-mark{width:28px;height:28px}
  .g-bin-name{font-size:.88rem}
  .g-bin-note{font-size:.66rem}
  .g-foodcard{min-height:120px;padding:12px 8px}
  .g-foodart{width:56px;height:56px}
  .g-foodname{font-size:1rem}
  .g-fb{padding:10px 12px;margin:4px 0 8px}
  .g-fb-mark{width:26px;height:26px}
  .g-fb-head{font-size:.88rem}
  .g-fb-why{font-size:.82rem}
  .g-fb-note{font-size:.72rem;padding:5px 8px}
}

/* ---------- review list ---------- */
.g-revitem{background:#FDFAF2;border:1px solid var(--card-line);border-radius:var(--r-md);
  padding:10px 13px;margin-bottom:8px;font-size:.86rem;line-height:1.55;text-align:left}
.g-revitem b{color:var(--saffron)}
.g-revitem .g-revwhy{color:var(--ink2);display:block;margin-top:3px}
</style>
</head>
<body data-game="sattvic-chef">
<div class="g-wrap">

  <header class="g-head">
    <div class="g-brand">
      <span class="g-mark" id="brandMark" aria-hidden="true"></span>
      <span class="g-brand-txt">
        <span class="g-brand-hi" id="brandHi"></span>
        <span class="g-brand-en" id="brandEn"></span>
      </span>
    </div>
    <div class="g-head-actions">
      <button type="button" class="g-iconbtn" id="sndBtn" aria-pressed="true"></button>
      <button type="button" class="g-pill" id="langBtn"></button>
      <button type="button" class="g-pill" id="hubBtn"></button>
      <button type="button" class="g-pill is-hidden" id="restartBtn"></button>
    </div>
  </header>

  <main id="main">
    <!-- S1 · LANGUAGE GATE -->
    <section class="g-screen" id="scrLang">
      <div class="g-card">
        <span class="g-glyph" id="langGlyph" aria-hidden="true"></span>
        <h1 class="g-title" id="s1Title"></h1>
        <p class="g-sub" id="s1Sub"></p>
        <div class="g-rule"></div>
        <div class="g-choices">
          <button type="button" class="g-choice" data-lang="en">
            <span class="g-choice-name">English</span>
            <span class="g-choice-note">Continue in English</span>
          </button>
          <button type="button" class="g-choice" data-lang="hi">
            <span class="g-choice-name" lang="hi">हिंदी</span>
            <span class="g-choice-note" lang="hi">हिंदी में जारी रखें</span>
          </button>
        </div>
      </div>
    </section>

    <!-- S2 · AUDIENCE GATE -->
    <section class="g-screen is-hidden" id="scrAud">
      <div class="g-card">
        <h1 class="g-title" id="s2Title"></h1>
        <p class="g-sub" id="s2Sub"></p>
        <div class="g-rule"></div>
        <div class="g-choices">
          <button type="button" class="g-choice" data-aud="kids">
            <span class="g-choice-name" id="kidsLbl"></span>
            <span class="g-choice-note" id="kidsNote"></span>
          </button>
          <button type="button" class="g-choice" data-aud="adults">
            <span class="g-choice-name" id="adultsLbl"></span>
            <span class="g-choice-note" id="adultsNote"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- S3 · SETUP GATE -->
    <section class="g-screen is-hidden" id="scrSetup">
      <div class="g-card">
        <h1 class="g-title" id="s3Title"></h1>
        <p class="g-sub" id="s3Sub"></p>
        <div class="g-rule"></div>

        <div class="g-field">
          <label class="g-label" for="nameInput" id="nameLabel"></label>
          <input class="g-input" type="text" id="nameInput" maxlength="20"
                 autocomplete="off" spellcheck="false">
        </div>

        <div class="g-field">
          <span class="g-label" id="roundLabel"></span>
          <div class="g-chips" id="roundChips" role="group"></div>
        </div>

        <p class="g-hint" id="setupHint"></p>
        <div class="g-btn-row">
          <button type="button" class="g-btn g-btn-primary" id="startBtn"></button>
          <button type="button" class="g-btn" id="lbBtn"></button>
        </div>
      </div>

      <div class="g-card g-lb is-hidden" id="lbPanel">
        <div class="g-lb-head">
          <span class="g-lb-title" id="lbTitle"></span>
          <button type="button" class="g-btn g-btn-sm" id="lbClearBtn"></button>
        </div>
        <div id="lbBody"></div>
      </div>
    </section>

    <!-- S4 · PLAY -->
    <section class="g-screen is-hidden" id="scrPlay">
      <div class="g-hud">
        <div class="g-stat"><span class="g-stat-val" id="hudScore">0</span>
          <span class="g-stat-lbl" id="hudScoreLbl"></span></div>
        <span class="g-hud-sep" aria-hidden="true"></span>
        <div class="g-stat"><span class="g-stat-val" id="hudStreak">0</span>
          <span class="g-stat-lbl" id="hudStreakLbl"></span></div>
        <span class="g-hud-sep" aria-hidden="true"></span>
        <div class="g-stat"><span class="g-stat-val" id="hudCount">0/0</span>
          <span class="g-stat-lbl" id="hudCountLbl"></span></div>
        <span class="g-hud-sep" aria-hidden="true"></span>
        <div class="g-stat"><span class="g-stat-val" id="hudTime">0:00</span>
          <span class="g-stat-lbl" id="hudTimeLbl"></span></div>
        <div class="g-progress"><div class="g-progress-fill" id="progFill"></div></div>
      </div>

      <div class="g-sortrow">
        <button type="button" class="g-bin g-bin-yes" id="binYes">
          <span class="g-bin-mark" id="binYesMark" aria-hidden="true"></span>
          <span class="g-bin-name" id="binYesName"></span>
          <span class="g-bin-note" id="binYesNote"></span>
          <span class="g-bin-arrow" id="binYesArrow"></span>
        </button>

        <div class="g-foodcard" id="foodCard">
          <span class="g-foodart" id="foodArt" aria-hidden="true"></span>
          <span class="g-foodname" id="foodName"></span>
          <span class="g-foodhint" id="foodHint"></span>
        </div>

        <button type="button" class="g-bin g-bin-no" id="binNo">
          <span class="g-bin-mark" id="binNoMark" aria-hidden="true"></span>
          <span class="g-bin-name" id="binNoName"></span>
          <span class="g-bin-note" id="binNoNote"></span>
          <span class="g-bin-arrow" id="binNoArrow"></span>
        </button>
      </div>

      <div id="feedback"></div>

      <div class="g-btn-row">
        <button type="button" class="g-btn g-btn-sm" id="quitBtn"></button>
      </div>
      <p class="sr-only" id="live" role="status" aria-live="polite"></p>
    </section>

    <!-- S5 · RESULT -->
    <section class="g-screen is-hidden" id="scrResult">
      <div class="g-card">
        <span class="g-medal" id="medalMark" aria-hidden="true"></span>
        <h1 class="g-title" id="resTitle"></h1>
        <p class="g-sub" id="resSub"></p>
        <span class="g-rank is-hidden" id="resRank"></span>
        <div class="g-stats">
          <div class="g-statbox"><b id="stScore">0</b><span id="stScoreLbl"></span></div>
          <div class="g-statbox"><b id="stCorrect">0</b><span id="stCorrectLbl"></span></div>
          <div class="g-statbox"><b id="stBest">0</b><span id="stBestLbl"></span></div>
          <div class="g-statbox"><b id="stTime">0:00</b><span id="stTimeLbl"></span></div>
        </div>
        <p class="g-note" id="cheerLine"></p>
        <div class="g-btn-row">
          <button type="button" class="g-btn g-btn-primary" id="againBtn"></button>
          <button type="button" class="g-btn" id="changeBtn"></button>
          <button type="button" class="g-btn" id="resLbBtn"></button>
        </div>
      </div>

      <div class="g-card g-lb is-hidden" id="resLbPanel">
        <div class="g-lb-head">
          <span class="g-lb-title" id="resLbTitle"></span>
          <button type="button" class="g-btn g-btn-sm" id="resLbClearBtn"></button>
        </div>
        <div id="resLbBody"></div>
      </div>

      <div class="g-card g-review">
        <h2 class="g-review-title" id="reviewTitle"></h2>
        <div id="reviewList"></div>
      </div>
    </section>
  </main>

  <footer class="g-foot" id="footTxt"></footer>
</div>

<div class="g-toast" id="toast" role="status" aria-live="polite"></div>
<div class="g-fx" id="fx" aria-hidden="true"></div>
<div class="g-dialog is-hidden" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="g-dialog-card">
    <h2 id="dlgTitle"></h2>
    <p id="dlgBody"></p>
    <div class="g-btn-row">
      <button type="button" class="g-btn g-btn-primary" id="dlgYes"></button>
      <button type="button" class="g-btn" id="dlgNo"></button>
    </div>
  </div>
</div>

/* ============================================================
   LEADERBOARD · shared schema, one key for all six games
   ============================================================ */
function lbAll() {
  var o = parseJSON(rawGet(LB_KEY), {});
  return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
}
function lbList() {
  var l = lbAll()[GAME_ID];
  if (!Array.isArray(l)) return [];
  var out = [];
  for (var i = 0; i < l.length; i++) {
    var e = l[i];
    if (!e || typeof e !== 'object') continue;
    out.push({
      name: sanitizeName(e.name), level: String(e.level || ''), levelKey: String(e.levelKey || ''),
      duration: Math.max(0, Math.floor(Number(e.duration) || 0)),
      score: Math.max(0, Math.floor(Number(e.score) || 0)),
      meta: (e.meta && typeof e.meta === 'object') ? e.meta : {},
      ts: Math.floor(Number(e.ts) || Date.now())
    });
  }
  out.sort(lbCmp);
  return out;
}
function lbCmp(a, b) { return LB_CMP(a, b); }
function lbSave(entry) {
  var all = lbAll();
  var list = Array.isArray(all[GAME_ID]) ? all[GAME_ID] : [];
  list.push(entry);
  list.sort(lbCmp);
  if (list.length > LB_MAX) list = list.slice(0, LB_MAX);
  all[GAME_ID] = list;
  var okSave = rawSet(LB_KEY, JSON.stringify(all));
  var rank = 0;
  for (var i = 0; i < list.length; i++) {
    if (list[i].ts === entry.ts && list[i].name === entry.name &&
        list[i].levelKey === entry.levelKey) { rank = i + 1; break; }
  }
  return { saved: okSave, rank: rank };
}
function lbClear() {
  var all = lbAll();
  if (Object.prototype.hasOwnProperty.call(all, GAME_ID)) {
    delete all[GAME_ID];
    rawSet(LB_KEY, JSON.stringify(all));
  }
}

                7 enWhy, 8 hiWhy, 9 note (optional) */

function foodWhy(f)  { return S.lang === 'hi' ? f[8] : f[7]; }

function catOf(key) {
  for (var i = 0; i < FCATS.length; i++) if (FCATS[i][0] === key) return FCATS[i];
  return null;
}

  var c = catOf(key);

/** The kids' pool excludes the strict adult-only observances. */
function buildPool() {
  S.pool = FOODS.filter(function (f) {
    return S.aud === 'adults' ? true : (f[3] !== 'adults');
  });
}

function stopClock() { if (S.clockId) { clearInterval(S.clockId); S.clockId = null; } }
function startClock() {
  if (S.startedAt) return;
  S.startedAt = Date.now();
  stopClock();
  S.clockId = setInterval(function () {
    S.elapsed = Math.floor((Date.now() - S.startedAt) / 1000);
    $('hudTime').textContent = fmtTime(S.elapsed);
  }, 500);
}

function startRound() {
  var nm = sanitizeName($('nameInput').value);
  if (!nm) { toast(t('nameNeeded')); $('nameInput').focus(); return; }
  S.name = nm;
  writePrefs({ name: nm, aud: S.aud, lastGame: GAME_ID });

  buildPool();
  var src = S.pool.slice();
  shuffle(src);
  S.deck = (S.round > 0) ? src.slice(0, Math.min(S.round, src.length)) : src;

  S.idx = 0; S.score = 0; S.streak = 0; S.best = 0; S.correct = 0;
  S.startedAt = 0; S.elapsed = 0; S.lock = false;
  S.mistakes = []; S.lastRank = 0; S.touchX = null;
  stopClock();
  $('feedback').innerHTML = '';
  $('lbPanel').classList.add('is-hidden');

  setScreen('play');
  paintBins();
  showCard();
  paintHud();
  bell(0.05);
}

/* ============================================================
   PLAY · card, bins, sorting, teaching feedback
   ============================================================ */
function paintBins() {
  $('binYesMark').innerHTML = binMarkYes();
  $('binNoMark').innerHTML = binMarkNo();
  $('binYesName').textContent = t('binYes');
  $('binYesNote').textContent = t('binYesNote');
  $('binNoName').textContent = t('binNo');
  $('binNoNote').textContent = t('binNoNote');
  /* The arrows always describe the bins' MEASURED on-screen order, so the
     swipe mapping can never disagree with what the player sees. */
  var yesLeft = binIsLeft();
  $('binYesArrow').textContent = yesLeft ? t('binYesArrow') : t('binYesArrow').replace('←', '→');
  $('binNoArrow').textContent = yesLeft ? t('binNoArrow') : t('binNoArrow').replace('→', '←');
}

/** True when the Jain-friendly bin is physically to the left of the other. */
function binIsLeft() {
  var y = $('binYes').getBoundingClientRect();
  var n = $('binNo').getBoundingClientRect();
  if (!y.width && !y.left) return true;      // jsdom / un laid-out: assume markup order
  return y.left <= n.left;
}

function showCard() {
  if (S.idx >= S.deck.length) { endRound(); return; }
  var f = S.deck[S.idx];
  var card = $('foodCard');
  card.classList.remove('is-hidden', 'is-swipeL', 'is-swipeR');
  $('foodArt').innerHTML = foodArt(f[4], foodName(f));
  $('foodName').textContent = foodName(f);
  $('foodHint').textContent = t('cardHint');
  card.setAttribute('aria-label', foodName(f));
  /* restart the entry animation */
  card.classList.remove('is-in');
  void card.offsetWidth;
  card.classList.add('is-in');
  S.lock = false;
  paintHud();
}

function paintHud() {
  var hi = (S.lang === 'hi');
  $('hudScore').textContent = hi ? devNum(S.score) : String(S.score);
  $('hudStreak').textContent = hi ? devNum(S.streak) : String(S.streak);
  $('hudCount').textContent = (hi ? devNum(S.idx) : S.idx) + '/' +
                              (hi ? devNum(S.deck.length) : S.deck.length);
  $('hudTime').textContent = fmtTime(S.elapsed);
  var pct = S.deck.length ? (S.idx / S.deck.length) : 0;
  $('progFill').style.transform = 'scaleX(' + pct.toFixed(4) + ')';
}

/** choice === true means the player sorted it into the Jain-friendly bin. */
function sortFood(choice) {
  if (S.lock || S.idx >= S.deck.length) return;
  S.lock = true;
  startClock();

  var f = S.deck[S.idx];
  var right = (choice === foodJain(f));
  var bin = choice ? $('binYes') : $('binNo');
  var gain = BASE + Math.min(S.streak, STREAK_MAX) * STREAK_STEP;

  bin.classList.add(right ? 'is-good' : 'is-bad');
  setTimeout(function () { bin.classList.remove('is-good', 'is-bad'); }, reduced() ? 60 : 560);

  if (right) {
    S.correct++;
    S.streak++;
    if (S.streak > S.best) S.best = S.streak;
    S.score += gain;
  } else {
    S.streak = 0;
    S.mistakes.push(f);
  }
  paintHud();
  renderFeedback(f, right, gain);
  if (right) sfx.match(); else sfx.miss();
}

/** Teaching card — built entirely with textContent, never innerHTML. */
function renderFeedback(f, right, gain) {
  var host = $('feedback');
  host.innerHTML = '';

  var box = document.createElement('div');
  box.className = 'g-fb ' + (right ? 'is-correct' : 'is-wrong');

  var mark = document.createElement('span');
  mark.className = 'g-fb-mark';
  mark.innerHTML = right ? artMedal() : artDiya();
  box.appendChild(mark);

  var body = document.createElement('div');
  body.className = 'g-fb-body';

  var head = document.createElement('div');
  head.className = 'g-fb-head';
  head.textContent = right ? t('correct') : t('wrong');
  body.appendChild(head);

  var verdict = document.createElement('div');
  verdict.className = 'g-fb-verdict';
  verdict.textContent = foodName(f) + ' ' + (foodJain(f) ? t('verdictYes') : t('verdictNo'));
  body.appendChild(verdict);

  var why = document.createElement('p');
  why.className = 'g-fb-why';
  why.textContent = foodWhy(f);
  body.appendChild(why);

  var cat = document.createElement('p');
  cat.className = 'g-fb-why';
  cat.style.opacity = '.8';
  cat.textContent = catName(f[1]);
  body.appendChild(cat);

  var note = foodNote(f);
  if (note) {
    var n = document.createElement('div');
    n.className = 'g-fb-note';
    var b = document.createElement('b');
    b.textContent = t('noteLabel') + ': ';
    n.appendChild(b);
    n.appendChild(document.createTextNode(note));
    body.appendChild(n);
  }

  var foot = document.createElement('div');
  foot.className = 'g-fb-foot';
  var tag = document.createElement('span');
  tag.className = 'g-fb-tag';
  tag.textContent = right ? t('points', { n: (S.lang === 'hi' ? devNum(gain) : gain) })
                          : t('keepLearning');
  foot.appendChild(tag);
  var next = document.createElement('button');
  next.type = 'button';
  next.className = 'g-btn g-btn-sm g-btn-primary g-fb-next';
  next.textContent = t('next');
  next.addEventListener('click', nextFood);
  foot.appendChild(next);
  body.appendChild(foot);

  box.appendChild(body);
  host.appendChild(box);
  next.focus();
  say(head.textContent + ' ' + verdict.textContent + ' ' + why.textContent);
}

function say(msg) { var e = $('live'); if (e) e.textContent = msg; }

function nextFood() {
  S.idx++;
  $('feedback').innerHTML = '';
  paintHud();
  if (S.idx >= S.deck.length) { endRound(); return; }
  showCard();
}


/* ============================================================
   RESULT
   ============================================================ */
function levelKey() {
  return (S.aud === 'adults' ? 'adults' : 'kids') + '-' + (S.round > 0 ? S.round : 'all');
}
function levelLabel() {
  var who = S.aud === 'adults' ? t('adults') : t('kids');
  var n = S.round > 0
    ? (S.lang === 'hi' ? devNum(S.round) : String(S.round))
    : t('roundAll');
  return who + ' · ' + n;
}

function tierOf() {
  var pct = S.deck.length ? (S.correct / S.deck.length) : 0;
  if (pct === 1) return 3;
  if (pct >= 0.8) return 2;
  if (pct >= 0.6) return 1;
  return 0;
}

function endRound() {
  stopClock();
  if (S.startedAt) S.elapsed = Math.floor((Date.now() - S.startedAt) / 1000);

  var entry = {
    name: S.name,
    level: levelLabel(),
    levelKey: levelKey(),
    duration: S.elapsed,
    score: S.score,
    meta: { correct: S.correct, total: S.deck.length, best: S.best, aud: S.aud },
    ts: Date.now()
  };
  var res = lbSave(entry);
  S.lastRank = res.saved ? res.rank : 0;

  setScreen('result');
  paintResultText();
  renderReview();
  if (tierOf() >= 1) petals(26);
  sfx.finish();
  toast(res.saved ? t('saved', { n: (S.lang === 'hi' ? devNum(S.score) : S.score) })
                  : t('storageOff'));
}

function paintResultText() {
  var tier = tierOf();
  var hi = (S.lang === 'hi');
  $('medalMark').innerHTML = artMedal();
  $('resTitle').textContent = t('resTitle')[tier];
  $('resSub').textContent = t('resSub')[tier];
  $('stScore').textContent = hi ? devNum(S.score) : String(S.score);
  $('stCorrect').textContent = (hi ? devNum(S.correct) : S.correct) + '/' +
                               (hi ? devNum(S.deck.length) : S.deck.length);
  $('stBest').textContent = hi ? devNum(S.best) : String(S.best);
  $('stTime').textContent = fmtClock(S.elapsed);
  $('cheerLine').textContent = pick(t('cheers'));
  var rk = $('resRank');
  if (S.lastRank) {
    rk.textContent = t('rankLine', { n: hi ? devNum(S.lastRank) : S.lastRank });
    rk.classList.remove('is-hidden');
  } else {
    rk.classList.add('is-hidden');
  }
  $('resLbPanel').classList.remove('is-hidden');
  renderLbInto('resLbBody');
}

/** Review the misses; when nothing was missed, show four worth remembering. */
function renderReview() {
  var host = $('reviewList');
  host.innerHTML = '';
  var items = S.mistakes.length ? S.mistakes : S.deck.slice(0, 4);

  if (!S.mistakes.length) {
    var note = document.createElement('p');
    note.className = 'g-fb-note';
    note.textContent = t('reviewEmpty');
    host.appendChild(note);
  }

  items.slice(0, 10).forEach(function (f) {
    var row = document.createElement('div');
    row.className = 'g-revitem';
    var b = document.createElement('b');
    b.textContent = foodName(f) + ' — ';
    row.appendChild(b);
    row.appendChild(document.createTextNode(
      foodJain(f) ? t('verdictYes') : t('verdictNo')));
    var why = document.createElement('span');
    why.className = 'g-revwhy';
    why.textContent = foodWhy(f);
    row.appendChild(why);
    var nt = foodNote(f);
    if (nt) {
      var nn = document.createElement('span');
      nn.className = 'g-revwhy';
      nn.style.fontStyle = 'italic';
      nn.textContent = t('noteLabel') + ': ' + nt;
      row.appendChild(nn);
    }
    host.appendChild(row);
  });
}

/* ============================================================
   LEADERBOARD
   ============================================================ */
function renderLbInto(id) {
  var host = $(id);
  if (!host) return;
  host.innerHTML = '';
  var list = lbList();
  if (!list.length) {
    var p = document.createElement('p');
    p.className = 'g-lb-empty';
    p.textContent = t('lbEmpty');
    host.appendChild(p);
    return;
  }
  var wrap = document.createElement('div');
  wrap.className = 'g-tablewrap';
  var tb = document.createElement('table');
  tb.className = 'g-table';
  var thead = document.createElement('thead');
  var hr = document.createElement('tr');
  [t('thRank'), t('thLbName'), t('thLbLevel'), t('thLbScore'), t('thLbTime')].forEach(function (h) {
    var th = document.createElement('th');
    th.textContent = h;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  tb.appendChild(thead);
  var body = document.createElement('tbody');
  var medals = ['\uD83E\uDD47', '\uD83E\uDD48', '\uD83E\uDD49'];
  list.slice(0, 10).forEach(function (e, i) {
    var tr = document.createElement('tr');
    var vals = [
      i < 3 ? medals[i] : String(i + 1),
      e.name || '—',
      e.level || e.levelKey || '—',
      (S.lang === 'hi' ? devNum(e.score) : String(e.score)),
      fmtClock(e.duration)
    ];
    vals.forEach(function (v, ci) {
      var td = document.createElement('td');
      td.textContent = v;               // textContent only, never innerHTML
      if (ci === 0 && i < 3) td.className = 'g-medalcell';
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  tb.appendChild(body);
  wrap.appendChild(tb);
  host.appendChild(wrap);
}

function clearLb() {
  askDialog(t('lbConfirmTitle'), t('lbConfirmBody'), t('lbClear'), t('no'), function () {
    lbClear();
    renderLbInto('lbBody');
    renderLbInto('resLbBody');
    toast(t('lbCleared'));
  });
}


/* ============================================================
   SETUP CHIPS
   ============================================================ */
function buildRoundChips() {
  var host = $('roundChips');
  host.innerHTML = '';
  ROUNDS.forEach(function (n) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'g-chip' + (S.round === n ? ' is-on' : '');
    b.textContent = (n === 0) ? t('roundAll')
      : (S.lang === 'hi' ? devNum(n) : String(n));
    b.setAttribute('aria-pressed', S.round === n ? 'true' : 'false');
    b.addEventListener('click', function () { S.round = n; buildRoundChips(); sfx.tap(); });
    host.appendChild(b);
  });
}

/* ============================================================
   RENDER · pure function of state; a language switch mid-round
   never loses the deck, the score or the clock
   ============================================================ */
function applyText() {
  document.documentElement.lang = (S.lang === 'hi') ? 'hi' : 'en';
  document.title = (S.lang === 'hi'
    ? 'सात्त्विक रसोई · Sattvic Chef'
    : 'Sattvic Chef · सात्त्विक रसोई');

  $('brandMark').innerHTML = artSwastika();
  $('brandHi').textContent = t('brandHi');
  $('brandEn').textContent = t('brandEn');
  $('langBtn').textContent = t('langSwitch');
  $('hubBtn').textContent = t('hub');
  $('restartBtn').textContent = t('restart');
  paintSound();

  $('langGlyph').innerHTML = artRosette();
  $('s1Title').textContent = t('s1Title');
  $('s1Sub').textContent = t('s1Sub');

  $('s2Title').textContent = t('s2Title');
  $('s2Sub').textContent = t('s2Sub');
  $('kidsLbl').textContent = t('kids');
  $('kidsNote').textContent = t('kidsNote');
  $('adultsLbl').textContent = t('adults');
  $('adultsNote').textContent = t('adultsNote');

  $('s3Title').textContent = t('s3Title');
  $('s3Sub').textContent = t('s3Sub');
  $('nameLabel').textContent = t('nameLabel');
  $('nameInput').placeholder = t('namePh');
  $('roundLabel').textContent = t('roundLabel');
  $('setupHint').textContent = t('setupHint');
  $('startBtn').textContent = t('start');
  $('lbBtn').textContent = t('leaderboard');
  $('lbTitle').textContent = t('lbTitle');
  $('lbClearBtn').textContent = t('lbClear');

  $('hudScoreLbl').textContent = t('hudScore');
  $('hudStreakLbl').textContent = t('hudStreak');
  $('hudCountLbl').textContent = t('hudCount');
  $('hudTimeLbl').textContent = t('hudTime');
  $('quitBtn').textContent = t('quit');

  $('stScoreLbl').textContent = t('statScore');
  $('stCorrectLbl').textContent = t('statCorrect');
  $('stBestLbl').textContent = t('statBest');
  $('stTimeLbl').textContent = t('statTime');
  $('againBtn').textContent = t('again');
  $('changeBtn').textContent = t('changeSetup');
  $('resLbBtn').textContent = t('showLb');
  $('resLbTitle').textContent = t('lbTitle');
  $('resLbClearBtn').textContent = t('lbClear');
  $('reviewTitle').textContent = t('reviewTitle');
  $('footTxt').textContent = t('foot');

  buildRoundChips();
  /* The bins live in the DOM at all times, so they must be repainted on every
     language switch — otherwise a mid-round switch leaves stale labels. */
  paintBins();
  if (!$('lbPanel').classList.contains('is-hidden')) renderLbInto('lbBody');
  if (!$('resLbPanel').classList.contains('is-hidden')) renderLbInto('resLbBody');
  if (S.screen === 'play') showCardText();
  if (S.screen === 'result') { paintResultText(); renderReview(); }
}

/** Repaint only the current card's text and art — the deck stays untouched. */
function showCardText() {
  var f = S.deck[S.idx];
  if (!f) return;
  $('foodArt').innerHTML = foodArt(f[4], foodName(f));
  $('foodName').textContent = foodName(f);
  $('foodHint').textContent = t('cardHint');
  $('foodCard').setAttribute('aria-label', foodName(f));
  paintHud();
}

function paintSound() {
  var b = $('sndBtn');
  b.innerHTML = artBell(S.sound);
  b.setAttribute('aria-pressed', S.sound ? 'true' : 'false');
  b.setAttribute('aria-label', S.sound ? t('soundOn') : t('soundOff'));
  b.title = S.sound ? t('soundOn') : t('soundOff');
}


/* ============================================================
   INPUT · drag-and-drop, swipe, tap and keyboard
   ============================================================ */
var card = $('foodCard');

/* --- HTML5 drag and drop (desktop) --- */
card.addEventListener('dragstart', function (e) {
  card.classList.add('is-dragging');
  try { e.dataTransfer.setData('text/plain', 'food'); } catch (err) { /* ignore */ }
  if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
});
card.addEventListener('dragend', function () { card.classList.remove('is-dragging'); });

['binYes', 'binNo'].forEach(function (id) {
  var bin = $(id);
  bin.addEventListener('dragover', function (e) { e.preventDefault(); bin.classList.add('is-drop'); });
  bin.addEventListener('dragleave', function () { bin.classList.remove('is-drop'); });
  bin.addEventListener('drop', function (e) {
    e.preventDefault();
    bin.classList.remove('is-drop');
    sortFood(id === 'binYes');
  });
  /* a tap on a bin always works, in every layout */
  bin.addEventListener('click', function () { ac(); sortFood(id === 'binYes'); });
});

/* --- swipe (touch). Direction is resolved against the bins' MEASURED
       on-screen order, so it can never disagree with what is visible. --- */
card.addEventListener('touchstart', function (e) {
  if (e.touches && e.touches.length) S.touchX = e.touches[0].clientX;
}, { passive: true });
card.addEventListener('touchend', function (e) {
  if (S.touchX === null || !e.changedTouches || !e.changedTouches.length) return;
  var dx = e.changedTouches[0].clientX - S.touchX;
  S.touchX = null;
  if (Math.abs(dx) < 70) return;               // a tap, not a swipe
  var wentRight = dx > 0;
  var yesIsLeft = binIsLeft();
  var choseYes = yesIsLeft ? !wentRight : wentRight;
  var cls = choseYes
    ? (yesIsLeft ? 'is-swipeL' : 'is-swipeR')
    : (yesIsLeft ? 'is-swipeR' : 'is-swipeL');
  card.classList.add(cls);
  setTimeout(function () {
    card.classList.remove('is-swipeL', 'is-swipeR');
    sortFood(choseYes);
  }, reduced() ? 0 : 180);
}, { passive: true });

/* --- keyboard: 1 / 2, or arrow keys toward the matching bin --- */
document.addEventListener('keydown', function (e) {
  if (S.screen !== 'play') return;
  var yesLeft = binIsLeft();
  if (e.key === '1') { e.preventDefault(); ac(); sortFood(true); }
  else if (e.key === '2') { e.preventDefault(); ac(); sortFood(false); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); ac(); sortFood(yesLeft); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); ac(); sortFood(!yesLeft); }
});

/* keep the swipe and arrow mapping honest after a rotation or resize */
window.addEventListener('resize', function () {
  if (S.screen === 'play') paintBins();
});

/* ============================================================
   WIRING
   ============================================================ */
function setLang(lang) {
  S.lang = (lang === 'en') ? 'en' : 'hi';
  writePrefs({ lang: S.lang });
  applyText();          // text only — deck, score and clock survive
}

function chooseAud(aud) {
  S.aud = aud;
  writePrefs({ aud: aud });
  buildPool();
  /* if the chosen round is bigger than the new pool, fall back to "all" */
  if (S.round > 0 && S.round > S.pool.length) S.round = 0;
  buildRoundChips();
  setScreen('setup');
  sfx.tap();
}


document.querySelectorAll('[data-lang]').forEach(function (b) {
  b.addEventListener('click', function () {
    ac();
    setLang(b.dataset.lang);
    sfx.tap();
    setScreen('aud');
  });
});
document.querySelectorAll('[data-aud]').forEach(function (b) {
  b.addEventListener('click', function () { ac(); chooseAud(b.dataset.aud); });
});

$('langBtn').addEventListener('click', function () {
  ac();
  setLang(S.lang === 'hi' ? 'en' : 'hi');
  sfx.tap();
});
$('sndBtn').addEventListener('click', function () {
  S.sound = !S.sound;
  writePrefs({ sound: S.sound });
  paintSound();
  if (S.sound) { ac(); sfx.tap(); }
});
$('hubBtn').addEventListener('click', function () {
  sfx.tap();
  try {
    if (window.parent && window.parent !== window && window.parent.location) {
      window.parent.location.hash = '#/kids';
      return;
    }
  } catch (e) { /* cross-origin: fall through to the file hub */ }
  window.location.href = 'index.html';
});
$('restartBtn').addEventListener('click', function () {
  stopClock();
  sfx.tap();
  setScreen(S.aud ? 'setup' : 'aud');
});

$('startBtn').addEventListener('click', function () { ac(); startRound(); });
$('nameInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); startRound(); }
});
$('quitBtn').addEventListener('click', function () {
  askDialog(t('quitConfirm'), t('quitBody'), t('yes'), t('no'), function () {
    stopClock();
    setScreen('setup');
    sfx.tap();
  });
});
$('againBtn').addEventListener('click', function () { ac(); startRound(); });
$('changeBtn').addEventListener('click', function () { stopClock(); sfx.tap(); setScreen('setup'); });

$('lbBtn').addEventListener('click', function () {
  var p = $('lbPanel');
  p.classList.toggle('is-hidden');
  if (!p.classList.contains('is-hidden')) renderLbInto('lbBody');
  sfx.tap();
});
$('resLbBtn').addEventListener('click', function () {
  var p = $('resLbPanel');
  p.classList.toggle('is-hidden');
  if (!p.classList.contains('is-hidden')) renderLbInto('resLbBody');
  sfx.tap();
});
$('lbClearBtn').addEventListener('click', clearLb);
$('resLbClearBtn').addEventListener('click', clearLb);

/* ============================================================
   BOOT
   ============================================================ */
function parseQuery() {
  var q = {};
  try {
    var sp = new URLSearchParams(window.location.search || '');
    sp.forEach(function (v, k) { q[k] = v; });
  } catch (e) { q = {}; }
  return q;
}

function storageOk() {
  try {
    localStorage.setItem('__jb_t__', '1');
    localStorage.removeItem('__jb_t__');
    return true;
  } catch (e) { return false; }
}

function boot() {
  var prefs = readPrefs();
  S.lang = (prefs.lang === 'en') ? 'en' : 'hi';
  S.sound = prefs.sound !== false;
  S.name = prefs.name || '';
  S.aud = (prefs.aud === 'adults') ? 'adults' : null;

  var q = parseQuery();
  var qLang = (q.lang === 'en' || q.lang === 'hi') ? q.lang : null;
  if (qLang) S.lang = qLang;
  var qAud = (q.aud === 'kids' || q.aud === 'adults') ? q.aud : null;
  if (qAud) S.aud = qAud;
  var qn = parseInt(q.n, 10);
  if (ROUNDS.indexOf(qn) >= 0) S.round = qn;
  if (q.embed === '1') $('hubBtn').classList.add('is-hidden');

  if (S.name) $('nameInput').value = S.name;
  writePrefs({ lang: S.lang, sound: S.sound, lastGame: GAME_ID });

  applyText();
  if (qLang && qAud) { buildPool(); setScreen('setup'); }
  else if (qLang) setScreen('aud');
  else setScreen('lang');

  if (!storageOk()) setTimeout(function () { toast(t('storageOff')); }, 400);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
