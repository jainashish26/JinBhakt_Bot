<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6D1B2F">
<meta name="description" content="चौबीस तीर्थंकरों को उनके क्रम, चिन्ह, वर्ण और निर्वाण स्थल से पहचानिए। Arrange the 24 Tirthankaras by order, emblem, complexion or nirvana place — choose 6 to 24 tiles.">
<title>तीर्थंकर क्रम · Tirthankar Sorting</title>
<style>
/* ============================================================
   स्मृति पट्ट · Memory Match
   Single file · no CDN · no images · no external fonts
   Motion: transform + opacity only · honours prefers-reduced-motion
   ============================================================ */
:root{
  --saffron:#E8800C; --maroon:#6D1B2F; --gold:#C8860A; --cream:#FFF8F0;
  --warm:#FFFBF5; --ink:#2D1B06; --ink2:#5C3D1E; --border:#D4A574;
  --success:#2E7D32; --rose:#B23A3A; --leaf:#3F7D4F; --info:#1565C0;
  --card-line:#EADBC0;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-full:9999px;
  --sh-sm:0 1px 3px rgba(45,27,6,.08), 0 1px 2px rgba(45,27,6,.06);
  --sh-md:0 4px 12px rgba(45,27,6,.10), 0 2px 4px rgba(45,27,6,.06);
  --sh-lg:0 10px 25px rgba(45,27,6,.12), 0 4px 8px rgba(45,27,6,.06);
  --fast:.15s ease; --base:.25s ease; --slow:.4s ease;
  --ritual:.7s cubic-bezier(.2,.7,.2,1);
  --font-head:'Noto Serif Devanagari', Georgia, 'Times New Roman', serif;
  --font-body:'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
@media (max-width:480px){html{font-size:15px}}
body{
  font-family:var(--font-body);color:var(--ink);line-height:1.6;min-height:100vh;
  background:
    radial-gradient(900px 480px at 50% -10%, #FFF6E2 0%, transparent 62%),
    linear-gradient(165deg,#FDF8EE,#F7ECD6 60%,#F1E2C4);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
img,svg{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:var(--r-sm)}
.is-hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

.g-wrap{max-width:900px;margin:0 auto;padding:14px 14px 40px}

/* ---------- header ---------- */
.g-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 2px 14px}
.g-brand{display:flex;align-items:center;gap:9px;min-width:0}
.g-mark{width:30px;height:30px;flex-shrink:0;color:var(--saffron)}
.g-brand-txt{display:flex;flex-direction:column;min-width:0}
.g-brand-hi{font-family:var(--font-head);font-weight:700;font-size:1.02rem;
  color:var(--maroon);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-brand-en{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);opacity:.85}
.g-head-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.g-pill{border:1.5px solid var(--border);background:rgba(255,255,255,.72);
  border-radius:var(--r-full);padding:6px 13px;font-weight:600;font-size:.76rem;
  color:#7A5A12;transition:background var(--fast),transform var(--fast);white-space:nowrap;min-height:36px}
.g-pill:hover{background:#fff;transform:translateY(-1px)}
.g-iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r-full);
  border:1.5px solid var(--border);background:rgba(255,255,255,.72);color:var(--maroon);
  transition:background var(--fast)}
.g-iconbtn:hover{background:#fff}
.g-iconbtn svg{width:19px;height:19px}

/* ---------- screens ---------- */
.g-screen{animation:g-rise .5s cubic-bezier(.2,.7,.2,1)}
@keyframes g-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.g-card{background:var(--warm);border:1px solid var(--card-line);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:26px 20px;margin:14px 0;text-align:center}
.g-rule{width:56px;height:2px;margin:0 auto 18px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.g-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);
  font-size:clamp(1.4rem,4.6vw,2rem);line-height:1.25;margin-bottom:.25em}
.g-sub{color:var(--ink2);font-size:.95rem;max-width:46ch;margin:0 auto 1.2em}
.g-glyph{display:block;width:64px;height:64px;margin:0 auto 10px;color:var(--saffron)}
.g-glyph svg{width:100%;height:100%}

/* ---------- choice tiles ---------- */
.g-choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.g-choice{border:1.5px solid var(--border);background:rgba(255,255,255,.62);
  border-radius:var(--r-lg);padding:18px 20px;min-width:140px;flex:0 1 190px;
  color:var(--maroon);text-align:center;
  transition:transform var(--base),background var(--base),border-color var(--base),box-shadow var(--base)}
.g-choice:hover{transform:translateY(-3px);background:#fff;box-shadow:var(--sh-md);border-color:var(--saffron)}
.g-choice.is-on{border-color:var(--maroon);background:#fff;box-shadow:0 0 0 2px rgba(109,27,47,.16)}
.g-choice-mark{width:34px;height:34px;margin:0 auto 8px;color:var(--saffron)}
.g-choice-name{display:block;font-family:var(--font-head);font-weight:700;font-size:1.02rem}
.g-choice-note{display:block;font-size:.74rem;color:var(--ink2);margin-top:3px;opacity:.9}
@media (pointer:coarse){.g-choice{min-height:44px}}

/* ---------- setup form ---------- */
.g-field{text-align:left;margin:20px auto 0;max-width:540px}
.g-label{display:block;font-weight:700;font-size:.84rem;color:var(--maroon);margin-bottom:8px;
  letter-spacing:.02em}
.g-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--r-md);
  background:#fff;font-size:1rem;min-height:46px;transition:border-color var(--fast)}
.g-input:focus{border-color:var(--saffron);outline:none}
.g-chips{display:flex;flex-wrap:wrap;gap:8px}
.g-chip{border:1.5px solid var(--border);background:rgba(255,255,255,.7);
  border-radius:var(--r-full);padding:8px 15px;font-size:.84rem;font-weight:600;color:#6B5733;
  min-height:42px;transition:background var(--fast),border-color var(--fast),color var(--fast)}
.g-chip:hover{background:#fff;border-color:var(--saffron)}
.g-chip.is-on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.g-hint{font-size:.8rem;color:var(--ink2);margin-top:16px;font-style:italic}

/* ---------- buttons ---------- */
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1.5px solid var(--border);background:rgba(255,255,255,.75);border-radius:var(--r-full);
  padding:12px 26px;font-weight:700;font-size:.95rem;color:#7A5A12;min-height:46px;
  transition:transform var(--fast),background var(--fast),box-shadow var(--fast)}
.g-btn:hover{background:#fff;transform:translateY(-2px);box-shadow:var(--sh-sm)}
.g-btn-primary{background:linear-gradient(180deg,var(--saffron),#D0710A);border-color:#B85F08;
  color:#fff;box-shadow:0 3px 0 #A85607}
.g-btn-primary:hover{background:linear-gradient(180deg,#F08C15,var(--saffron));color:#fff}
.g-btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #A85607}
.g-btn-primary:disabled{background:#D9CDB8;border-color:#C9BCA5;box-shadow:none;color:#8B7C63;
  cursor:not-allowed;transform:none}
.g-btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.g-btn-sm{padding:8px 16px;font-size:.82rem;min-height:38px}

/* ---------- HUD ---------- */
.g-hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:rgba(255,255,255,.6);border:1px solid var(--card-line);border-radius:var(--r-lg);
  padding:10px 12px;margin:6px 0 14px}
.g-stat{display:flex;flex-direction:column;align-items:center;min-width:66px;padding:2px 8px}
.g-stat-val{font-family:var(--font-head);font-weight:700;font-size:1.15rem;color:var(--maroon);
  line-height:1.15;font-variant-numeric:tabular-nums}
.g-stat-lbl{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);opacity:.85}
.g-hud-sep{width:1px;height:26px;background:var(--card-line)}
.g-progress{height:6px;background:rgba(212,165,116,.32);border-radius:var(--r-full);
  overflow:hidden;width:100%;margin-top:4px}
.g-progress-fill{height:100%;width:100%;border-radius:var(--r-full);transform-origin:left center;
  transform:scaleX(0);background:linear-gradient(90deg,var(--gold),var(--saffron));
  transition:transform var(--slow)}

/* ---------- memory grid ---------- */
.g-board{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);margin:4px 0 8px;
  perspective:1200px}
@media (min-width:620px){.g-board[data-cols="12"]{grid-template-columns:repeat(6,1fr)}}
@media (max-width:400px){.g-board{gap:7px}}
/* tight board: cards fill cells, no aspect-ratio constraint */
.g-board.is-tight{grid-auto-rows:1fr}
.g-board.is-tight .g-cardflip{aspect-ratio:auto;height:100%;min-height:0}
.g-board.is-tight .g-face{padding:4px 3px;gap:3px}
.g-board.is-tight .g-face-back .g-art{width:28px;height:28px}
.g-board.is-tight .g-face-back .g-txt{font-size:.62rem}
.g-board.is-tight .g-face-back .g-sub2{font-size:.54rem}
.g-board.is-tight .g-face-front svg{width:44%;height:auto}

/* The flip lives on the WRAPPER only. Neither face is itself rotated, so no
   glyph can ever be painted mirrored. The hidden face also drops to
   opacity 0 after the turn, which makes a mirrored render impossible even
   where backface-visibility is unsupported. */
.g-cardflip{position:relative;aspect-ratio:3/4;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.g-cardflip.is-flipped{transform:rotateY(180deg)}
.g-face{position:absolute;inset:0;border-radius:var(--r-md);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:8px 6px;text-align:center;overflow:hidden;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  transition:opacity .2s linear .35s, box-shadow var(--base)}
.g-cardflip.is-flipped .g-face-front{opacity:0}
.g-cardflip:not(.is-flipped) .g-face-back{opacity:0}
.g-face-front{background:linear-gradient(150deg,#FBEBCB,#F2DCB0);
  border:1.5px solid var(--border);box-shadow:var(--sh-sm);color:var(--gold)}
.g-face-front svg{width:64%;height:auto;color:var(--gold);opacity:.85}
.g-face-back{transform:rotateY(180deg);background:#fff;border:1.5px solid var(--card-line);
  box-shadow:var(--sh-sm);color:var(--ink)}
.g-face-back .g-art{width:44px;height:44px;flex-shrink:0}
.g-face-back .g-txt{font-size:.74rem;font-weight:700;line-height:1.3;color:var(--maroon);
  overflow-wrap:anywhere}
.g-face-back .g-sub2{font-size:.64rem;color:var(--ink2);opacity:.85;line-height:1.25}
.g-cardflip.is-matched{cursor:default}
.g-cardflip.is-matched .g-face-back{border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(200,134,10,.28), var(--sh-md)}
.g-cardflip.is-matched .g-face-back .g-txt{color:var(--leaf)}
.g-cardflip.is-wrong{animation:g-sway .42s ease}
@keyframes g-sway{0%,100%{transform:rotateY(180deg) translateX(0)}
  25%{transform:rotateY(180deg) translateX(-4px)}
  75%{transform:rotateY(180deg) translateX(4px)}}
.g-cardflip.is-hint .g-face-back{box-shadow:0 0 0 3px rgba(232,128,12,.45)}
@media (max-width:400px){
  .g-face-back .g-art{width:32px;height:32px}
  .g-face-back .g-txt{font-size:.66rem}
  .g-face-back .g-sub2{font-size:.58rem}
}

/* ---------- result ---------- */
.g-medal{display:block;width:76px;height:76px;margin:0 auto 8px;color:var(--gold);
  animation:g-bloom .8s cubic-bezier(.2,.8,.25,1)}
.g-medal svg{width:100%;height:100%}
@keyframes g-bloom{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
.g-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0}
.g-statbox{background:#fff;border:1px solid var(--card-line);border-radius:var(--r-md);padding:13px 8px}
.g-statbox b{display:block;font-family:var(--font-head);font-size:1.4rem;color:var(--saffron);
  line-height:1.2;font-variant-numeric:tabular-nums}
.g-statbox span{display:block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink2);margin-top:3px}
.g-review{text-align:left;margin:18px auto 0;max-width:640px}
.g-review-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);
  font-size:1.02rem;text-align:center;margin-bottom:10px}
.g-tablewrap{overflow-x:auto;border:1px solid var(--card-line);border-radius:var(--r-md);background:#fff}
.g-table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:430px}
.g-table th,.g-table td{padding:9px 10px;text-align:left;border-bottom:1px solid #F1E6D2;vertical-align:top}
.g-table th{background:#FBF3E2;font-weight:700;color:var(--maroon);font-size:.7rem;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.g-table tbody tr:last-child td{border-bottom:none}
.g-table td.g-num{font-variant-numeric:tabular-nums;color:var(--ink2);width:2.4em}
.g-note{font-size:.8rem;color:var(--ink2);background:#FBF3E2;border-left:3px solid var(--gold);
  padding:9px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:14px;line-height:1.55}
.g-rank{display:inline-block;background:var(--gold);color:#4A3508;border-radius:var(--r-full);
  padding:4px 14px;font-weight:700;font-size:.8rem;margin-top:12px}

/* ---------- leaderboard ---------- */
.g-lb{text-align:left;margin-top:18px}
.g-lb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-wrap:wrap;margin-bottom:10px}
.g-lb-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);font-size:1.02rem}
.g-lb-empty{font-size:.84rem;color:var(--ink2);font-style:italic;text-align:center;padding:14px 6px}
.g-medalcell{font-weight:700;color:var(--gold);width:2.6em}

/* ---------- toast / dialog / fx ---------- */
.g-toast{position:fixed;left:50%;bottom:24px;z-index:70;max-width:min(92vw,430px);
  transform:translateX(-50%) translateY(120px);opacity:0;pointer-events:none;
  background:rgba(60,40,20,.94);color:#FFF6E2;padding:11px 20px;border-radius:var(--r-full);
  font-weight:600;font-size:.86rem;box-shadow:var(--sh-lg);text-align:center;line-height:1.45;
  transition:transform var(--slow),opacity var(--slow)}
.g-toast.is-on{transform:translateX(-50%) translateY(0);opacity:1}
.g-fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.g-fx i{position:absolute;top:-24px;display:block;
  border-radius:60% 60% 60% 60%/70% 70% 30% 30%;
  animation:g-fall linear forwards;will-change:transform,opacity}
@keyframes g-fall{to{transform:translateY(112vh) rotate(420deg);opacity:.15}}
.g-dialog{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(45,27,6,.55)}
.g-dialog-card{background:var(--warm);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);padding:26px 22px;max-width:400px;width:100%;text-align:center;
  animation:g-rise .35s cubic-bezier(.2,.7,.2,1)}
.g-dialog-card h2{font-family:var(--font-head);color:var(--maroon);font-size:1.2rem;margin-bottom:8px}
.g-dialog-card p{font-size:.9rem;color:var(--ink2);margin-bottom:6px}
.g-foot{text-align:center;color:#A08A5E;font-size:.74rem;margin:28px auto 0;line-height:1.7;
  font-style:italic;max-width:60ch}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .g-fx{display:none!important}
}

/* ---------- short desktop: compact play screens so they fit the iframe without scrolling ---------- */
@media (min-width:900px) and (max-height:880px){
  .g-wrap{padding:8px 14px 20px}
  .g-card{padding:18px 16px;margin:8px 0}
  .g-title{font-size:clamp(1.2rem,3.6vw,1.6rem);margin-bottom:.15em}
  .g-sub{font-size:.85rem;margin-bottom:.8em}
  .g-hud{padding:8px 10px;margin:4px 0 8px}
  .g-stat-val{font-size:1rem}
  .g-stat-lbl{font-size:.58rem}
  .g-btn-row{margin-top:10px}
  .g-btn{padding:10px 20px;min-height:40px;font-size:.85rem}
  .g-btn-sm{padding:7px 14px;min-height:34px;font-size:.78rem}
  .g-foot{margin:14px auto 0;font-size:.68rem}
  .g-board{margin:2px 0 6px}
  .g-cardflip{aspect-ratio:auto;min-height:0}
  .g-face{padding:6px 4px;gap:4px}
  .g-face-back .g-art{width:36px;height:36px}
  .g-face-back .g-txt{font-size:.68rem}
  .g-face-front svg{width:50%;height:auto}
  .g-medal{width:56px;height:56px}
  .g-stats{margin:12px 0;gap:8px}
  .g-statbox{padding:10px 6px}
  .g-statbox b{font-size:1.2rem}
  .g-statbox span{font-size:.6rem}
  .g-review{margin:12px auto 0}
  .g-note{margin-top:10px;padding:7px 10px;font-size:.74rem}
}

/* ---------- sorting tiles ---------- */
.g-board{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  margin:4px 0 10px}
.g-tile{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;min-height:78px;padding:10px 6px;text-align:center;
  background:#fff;border:2px solid var(--card-line);border-radius:var(--r-md);
  box-shadow:var(--sh-sm);cursor:grab;user-select:none;touch-action:manipulation;
  transition:transform var(--fast),box-shadow var(--fast),border-color var(--fast),opacity var(--fast)}
.g-tile:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.g-tile .g-art{width:34px;height:34px;flex-shrink:0;color:var(--maroon)}
.g-tile .g-tname{font-size:.78rem;font-weight:700;color:var(--maroon);line-height:1.3;
  overflow-wrap:anywhere}
.g-tile .g-tnum{position:absolute;top:4px;left:7px;font-size:.62rem;font-weight:700;
  color:var(--ink2);opacity:.6;font-variant-numeric:tabular-nums}
.g-tile.is-selected{border-color:var(--saffron);
  box-shadow:0 0 0 3px rgba(232,128,12,.28),var(--sh-md);transform:scale(1.03)}
.g-tile.is-correct{border-color:var(--success);background:#F1F8F1}
.g-tile.is-correct .g-tname{color:var(--leaf)}
.g-tile.is-wrong{border-color:var(--rose);background:#FDF3F3}
.g-tile.is-wrong .g-tname{color:var(--rose)}
.g-tile.is-dragging{opacity:.45;transform:scale(.97)}
.g-tile.is-drop{border-style:dashed;border-color:var(--saffron);background:#FFF7E8}
.g-tile.is-hint{box-shadow:0 0 0 4px rgba(232,128,12,.45)}
.g-tile.is-done{cursor:default;opacity:.9}
.g-tile.is-shake{animation:g-sway .42s ease}

/* ---------- fixed name rail (emblem mode) ---------- */
.g-rail{display:grid;gap:7px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  margin:0 0 12px;padding:10px;border-radius:var(--r-md);
  background:rgba(255,255,255,.55);border:1px dashed var(--border)}
.g-slot{display:flex;align-items:center;gap:7px;min-height:46px;padding:6px 9px;
  background:#fff;border:1.5px solid var(--card-line);border-radius:var(--r-sm);
  transition:border-color var(--fast),box-shadow var(--fast)}
.g-slot-num{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:grid;
  place-items:center;background:rgba(200,134,10,.16);color:#7A5A12;
  font-size:.66rem;font-weight:700;font-variant-numeric:tabular-nums}
.g-slot-name{font-size:.74rem;font-weight:700;color:var(--maroon);line-height:1.25;
  overflow-wrap:anywhere}
.g-slot.is-drop{border-color:var(--saffron);border-style:dashed;
  box-shadow:0 0 0 3px rgba(232,128,12,.2)}
.g-slot.is-correct{border-color:var(--success);background:#F1F8F1}
.g-slot.is-wrong{border-color:var(--rose);background:#FDF3F3}

/* ============================================================
   LEADERBOARD · shared schema, one key for all six games
   ============================================================ */
function lbAll() {
  var o = parseJSON(rawGet(LB_KEY), {});
  return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
}
function lbList() {
  var l = lbAll()[GAME_ID];
  if (!Array.isArray(l)) return [];
  var out = [];
  for (var i = 0; i < l.length; i++) {
    var e = l[i];
    if (!e || typeof e !== 'object') continue;
    out.push({
      name: sanitizeName(e.name), level: String(e.level || ''), levelKey: String(e.levelKey || ''),
      duration: Math.max(0, Math.floor(Number(e.duration) || 0)),
      score: Math.max(0, Math.floor(Number(e.score) || 0)),
      meta: (e.meta && typeof e.meta === 'object') ? e.meta : {},
      ts: Math.floor(Number(e.ts) || Date.now())
    });
  }
  out.sort(lbCmp);
  return out;
}
function lbCmp(a, b) { return LB_CMP(a, b); }
function lbSave(entry) {
  var all = lbAll();
  var list = Array.isArray(all[GAME_ID]) ? all[GAME_ID] : [];
  list.push(entry);
  list.sort(lbCmp);
  if (list.length > LB_MAX) list = list.slice(0, LB_MAX);
  all[GAME_ID] = list;
  var okSave = rawSet(LB_KEY, JSON.stringify(all));
  var rank = 0;
  for (var i = 0; i < list.length; i++) {
    if (list[i].ts === entry.ts && list[i].name === entry.name &&
        list[i].levelKey === entry.levelKey) { rank = i + 1; break; }
  }
  return { saved: okSave, rank: rank };
}
function lbClear() {
  var all = lbAll();
  if (Object.prototype.hasOwnProperty.call(all, GAME_ID)) {
    delete all[GAME_ID];
    rawSet(LB_KEY, JSON.stringify(all));
  }
}

var S = {

  mode: 'order', count: 8, diff: 'hard',
  tiles: [],          // [{th, no}] in canonical order for the chosen subset
  order: [],          // current arrangement: order[pos] = index into tiles
  buckets: [],        // bucket mode: [{key,label,hex,items:[tileIdx]}]
  placed: {},         // bucket mode: tileIdx -> bucketKey

  startedAt: 0, clockId: null, elapsed: 0, bonus: 0,
  lastRank: 0, lock: false
};

function setScreen(name) {
  S.screen = name;
  ['scrLang', 'scrSetup', 'scrPlay', 'scrResult'].forEach(function (id) {
    $(id).classList.toggle('is-hidden',
      id !== 'scr' + name.charAt(0).toUpperCase() + name.slice(1));

  window.scrollTo(0, 0);

/* ============================================================
   ROUND SET-UP
   ============================================================ */
function bucketDefs() {
  return (S.mode === 'varna') ? VARNA_BUCKETS : MOKSHA_BUCKETS;
}
function isBucketMode() { return S.mode === 'varna' || S.mode === 'moksha'; }

/** Pick `count` Tirthankaras. Bucket modes draw a balanced subset so that
 *  every bucket present in the data can actually appear in the round. */
function pickSubset(n) {
  if (!isBucketMode()) {
    return shuffle(TIRTH.slice()).slice(0, n).sort(function (a, b) { return a.no - b.no; });
  }
  var key = (S.mode === 'varna') ? 'varnaKey' : 'mokshaKey';
  var groups = {};
  TIRTH.forEach(function (th) {
    var k = th[key];
    if (!groups[k]) groups[k] = [];
    groups[k].push(th);
  });
  var keys = Object.keys(groups).filter(function (k) { return groups[k].length; });
  shuffle(keys);
  var out = [];
  /* round-robin across buckets, capped, until we reach n */
  var i = 0;
  while (out.length < n && i < 400) {
    var k = keys[i % keys.length];
    var bucket = groups[k];
    var take = Math.floor(i / keys.length);
    if (take < Math.min(BUCKET_CAP, bucket.length)) {
      var cand = bucket[take];
      if (out.indexOf(cand) < 0) out.push(cand);
    }
    i++;
  }
  if (out.length < n) {
    shuffle(TIRTH.slice()).forEach(function (th) {
      if (out.length < n && out.indexOf(th) < 0) out.push(th);
    });
  }
  return out.sort(function (a, b) { return a.no - b.no; });
}

function startRound() {
  var nm = sanitizeName($('nameInput').value);
  if (!nm) { toast(t('nameNeeded')); $('nameInput').focus(); return; }
  if (S.mode === 'moksha' && S.count < 8) { toast(t('modeNeeds8')); return; }
  S.name = nm;
  writePrefs({ name: nm, lastGame: GAME_ID });

  S.tiles = pickSubset(S.count);
  S.moves = 0; S.hints = HINTS_MAX; S.hintsUsed = 0; S.bonus = 0;
  S.sel = -1; S.lock = false;
  S.startedAt = 0; S.elapsed = 0;
  stopClock();

  if (isBucketMode()) {
    var defs = bucketDefs();
    var key = (S.mode === 'varna') ? 'varnaKey' : 'mokshaKey';
    var present = {};
    S.tiles.forEach(function (th) { present[th[key]] = true; });
    S.buckets = defs.filter(function (b) { return present[b.key]; })
                    .map(function (b) { return { key: b.key, hex: b.hex || null, items: [] }; });
    S.placed = {};
    S.order = [];
    S.slots = [];
  } else if (S.mode === 'chinh') {
    S.slots = S.tiles.map(function () { return -1; });
    S.order = shuffle(S.tiles.map(function (_, i) { return i; }));
    S.buckets = [];
  } else {
    S.order = shuffle(S.tiles.map(function (_, i) { return i; }));
    S.slots = [];
    S.buckets = [];
  }

  setScreen('play');
  buildPlayField();
  paintHud();
  bell(0.05);
}

/* ============================================================
   PLAY FIELD · rail (emblem mode) + tiles + buckets
   ============================================================ */
function L(obj, hi, en) { return S.lang === 'hi' ? obj[hi] : obj[en]; }

function bucketLabel(key) {
  if (S.mode === 'varna') {
    var th = TIRTH.filter(function (x) { return x.varnaKey === key; })[0];
    return th ? L(th, 'varnaHi', 'varnaEn') : key;
  }
  var m = TIRTH.filter(function (x) { return x.mokshaKey === key; })[0];
  return m ? L(m, 'mokshaHi', 'mokshaEn') : key;
}

function buildPlayField() {
  var rail = $('rail'), board = $('board'), buck = $('buckets');
  rail.innerHTML = ''; board.innerHTML = ''; buck.innerHTML = '';

  rail.classList.toggle('is-hidden', S.mode !== 'chinh');
  buck.classList.toggle('is-hidden', !isBucketMode());
  board.classList.toggle('is-hidden', isBucketMode() === false ? false : false);

  /* Emblem mode: a fixed, numbered name rail the emblems drop into. */
  if (S.mode === 'chinh') {
    S.tiles.forEach(function (th, i) {
      var slot = document.createElement('div');
      slot.className = 'g-slot';
      slot.dataset.slot = String(i);
      var num = document.createElement('span');
      num.className = 'g-slot-num';
      num.textContent = S.lang === 'hi' ? devNum(th.no) : String(th.no);
      var nm = document.createElement('span');
      nm.className = 'g-slot-name';
      nm.textContent = L(th, 'hi', 'en');
      slot.appendChild(num);
      slot.appendChild(nm);
      addDropTarget(slot, 'slot', i);
      rail.appendChild(slot);
    });
  }

  /* Buckets for varna / moksha modes. */
  if (isBucketMode()) {
    S.buckets.forEach(function (b) {
      var box = document.createElement('div');
      box.className = 'g-bucket';
      box.dataset.bucket = b.key;
      var head = document.createElement('div');
      head.className = 'g-bucket-head';
      if (b.hex) {
        var sw = document.createElement('span');
        sw.className = 'g-swatch';
        sw.style.background = b.hex;
        head.appendChild(sw);
      }
      var lbl = document.createElement('span');
      lbl.className = 'g-bucket-name';
      lbl.textContent = bucketLabel(b.key);
      head.appendChild(lbl);
      var list = document.createElement('div');
      list.className = 'g-bucket-list';
      box.appendChild(head);
      box.appendChild(list);
      box.addEventListener('click', function () {
        if (S.sel >= 0) placeInBucket(S.sel, b.key);
      });
      addDropTarget(box, 'bucket', b.key);
      buck.appendChild(box);
    });
  }

  renderTiles();
  paintHintLine();
}

/** Tiles live in #board (the tray) for every mode; in bucket mode the tray
 *  holds only the tiles not yet placed, and the buckets show the placed ones. */
function renderTiles() {
  var board = $('board');
  board.innerHTML = '';

  if (isBucketMode()) {
    S.tiles.forEach(function (th, i) {
      if (S.placed[i] !== undefined) return;
      board.appendChild(makeTile(i));
    });
    if (!board.childNodes.length) {
      var empty = document.createElement('p');
      empty.className = 'g-hint';
      empty.style.textAlign = 'center';
      empty.textContent = t('playHintBucket');
      board.appendChild(empty);
    }
    /* repaint the buckets */
    S.buckets.forEach(function (b) {
      var box = document.querySelector('.g-bucket[data-bucket="' + b.key + '"]');
      if (!box) return;
      var list = box.querySelector('.g-bucket-list');
      list.innerHTML = '';
      S.tiles.forEach(function (th, i) {
        if (S.placed[i] !== b.key) return;
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'g-chipin';
        chip.dataset.tile = String(i);
        chip.setAttribute('aria-label', L(th, 'hi', 'en'));
        var art = document.createElement('span');
        art.className = 'g-art';
        art.innerHTML = artEmblem(th.chinhSvg);
        var nm = document.createElement('span');
        nm.textContent = L(th, 'hi', 'en');
        chip.appendChild(art);
        chip.appendChild(nm);
        chip.addEventListener('click', function () { unplace(i); });
        list.appendChild(chip);
      });
    });
    paintBuckets();
    return;
  }

  S.order.forEach(function (tileIdx, pos) {
    var el = makeTile(tileIdx);
    el.dataset.pos = String(pos);
    board.appendChild(el);
  });
  validateAll();
}

function makeTile(tileIdx) {
  var th = S.tiles[tileIdx];
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'g-tile' + (S.sel === tileIdx ? ' is-selected' : '');
  b.dataset.tile = String(tileIdx);
  b.setAttribute('aria-label', L(th, 'hi', 'en'));

  var num = document.createElement('span');
  num.className = 'g-tnum';
  /* Position numbers only shown in Easy mode (hard mode = no hints) */
  num.textContent = (S.mode === 'order' && S.diff === 'easy')
    ? (S.lang === 'hi' ? devNum(th.no) : String(th.no)) : '';
  b.appendChild(num);

  if (S.mode === 'chinh') {
    var art = document.createElement('span');
    art.className = 'g-art';
    art.innerHTML = artEmblem(th.chinhSvg);
    b.appendChild(art);
    var cap = document.createElement('span');
    cap.className = 'g-tname';
    cap.textContent = L(th, 'chinhHi', 'chinhEn');
    b.appendChild(cap);
  } else {
    var nm = document.createElement('span');
    nm.className = 'g-tname';
    nm.textContent = L(th, 'hi', 'en');
    b.appendChild(nm);
  }

  b.addEventListener('click', function () { tapTile(tileIdx); });
  addDragSource(b, tileIdx);
  return b;
}


/* ============================================================
   INTERACTION · tap-swap, HTML5 drag-and-drop and keyboard
   ============================================================ */
function startClock() {
  if (S.startedAt) return;
  S.startedAt = Date.now();
  stopClock();
  S.clockId = setInterval(function () {
    S.elapsed = Math.floor((Date.now() - S.startedAt) / 1000) + S.bonus;
    $('hudTime').textContent = fmtTime(S.elapsed);
  }, 500);
}
function stopClock() { if (S.clockId) { clearInterval(S.clockId); S.clockId = null; } }

function tapTile(tileIdx) {
  startClock();
  sfx.tap();

  if (isBucketMode()) {
    if (S.sel === tileIdx) { S.sel = -1; renderTiles(); return; }
    S.sel = tileIdx;
    renderTiles();
    say(t('selected', { name: L(S.tiles[tileIdx], 'hi', 'en') }));
    return;
  }

  if (S.mode === 'chinh') {
    if (S.sel === tileIdx) { S.sel = -1; repaintSel(); return; }
    S.sel = tileIdx;
    repaintSel();
    say(t('selected', { name: L(S.tiles[tileIdx], 'chinhHi', 'chinhEn') }));
    return;
  }

  /* order mode: tap one tile then another to swap their positions */
  if (S.sel < 0) { S.sel = tileIdx; repaintSel(); return; }
  if (S.sel === tileIdx) { S.sel = -1; repaintSel(); return; }
  var p1 = S.order.indexOf(S.sel);
  var p2 = S.order.indexOf(tileIdx);
  S.sel = -1;
  swapPositions(p1, p2);
}

function repaintSel() {
  var all = document.querySelectorAll('.g-tile');
  for (var i = 0; i < all.length; i++) {
    all[i].classList.toggle('is-selected', +all[i].dataset.tile === S.sel);
  }
}

function swapPositions(p1, p2) {
  if (p1 < 0 || p2 < 0 || p1 === p2) return;
  var tmp = S.order[p1];
  S.order[p1] = S.order[p2];
  S.order[p2] = tmp;
  S.moves++;
  var moved = S.tiles[S.order[p2]];
  renderTiles();
  paintHud();
  sfx.flip();
  say(t('swapped', { name: L(moved, 'hi', 'en') }));
}

/** Emblem mode: put the chosen emblem tile into a rail slot. */
function placeInSlot(tileIdx, slotPos) {
  startClock();
  var current = S.slots[slotPos];
  var from = S.slots.indexOf(tileIdx);
  S.slots[slotPos] = tileIdx;
  if (from >= 0 && from !== slotPos) S.slots[from] = current;
  if (current >= 0 && current !== tileIdx && from < 0) {
    var empty = S.slots.indexOf(-1);
    if (empty >= 0) S.slots[empty] = current;
  }
  S.sel = -1;
  S.moves++;
  renderTiles();
  paintSlots();
  paintHud();
  sfx.flip();
}

/** Bucket modes: assign a tile to a group. */
function placeInBucket(tileIdx, bucketKey) {
  startClock();
  S.placed[tileIdx] = bucketKey;
  S.sel = -1;
  S.moves++;
  renderTiles();
  paintHud();
  sfx.flip();
  var th = S.tiles[tileIdx];
  say(t('placedIn', { name: L(th, 'hi', 'en'), bucket: bucketLabel(bucketKey) }));
}

function unplace(tileIdx) {
  delete S.placed[tileIdx];
  S.sel = -1;
  renderTiles();
  paintHud();
  sfx.tap();
}


/* ---------- drag and drop (mouse + touch), tap as the accessible fallback ---------- */
var dragSrc = null;

function addDragSource(el, tileIdx) {
  el.setAttribute('draggable', 'true');
  el.addEventListener('dragstart', function (e) {
    dragSrc = tileIdx;
    el.classList.add('is-dragging');
    try { e.dataTransfer.setData('text/plain', String(tileIdx)); } catch (err) { /* ignore */ }
    if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragend', function () {
    el.classList.remove('is-dragging');
    clearDropMarks();
    dragSrc = null;
  });
}

function addDropTarget(el, kind, key) {
  el.addEventListener('dragover', function (e) {
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    el.classList.add('is-drop');
  });
  el.addEventListener('dragleave', function () { el.classList.remove('is-drop'); });
  el.addEventListener('drop', function (e) {
    e.preventDefault();
    e.stopPropagation();
    el.classList.remove('is-drop');
    var idx = dragSrc;
    if (idx === null || idx === undefined) {
      idx = parseInt((e.dataTransfer && e.dataTransfer.getData('text/plain')) || '', 10);
    }
    if (isNaN(idx)) return;
    if (kind === 'slot') placeInSlot(idx, +key);
    else if (kind === 'bucket') placeInBucket(idx, key);
    dragSrc = null;
  });
}

function clearDropMarks() {
  var m = document.querySelectorAll('.is-drop');
  for (var i = 0; i < m.length; i++) m[i].classList.remove('is-drop');
}

/* tile-to-tile drop in order mode, delegated so re-renders stay cheap */
document.addEventListener('dragover', function (e) {
  if (S.screen !== 'play' || S.mode !== 'order') return;
  var tl = e.target && e.target.closest ? e.target.closest('.g-tile') : null;
  if (tl) { e.preventDefault(); tl.classList.add('is-drop'); }
});
document.addEventListener('drop', function (e) {
  if (S.screen !== 'play' || S.mode !== 'order') return;
  var tl = e.target && e.target.closest ? e.target.closest('.g-tile') : null;
  if (!tl || dragSrc === null) return;
  e.preventDefault();
  tl.classList.remove('is-drop');
  swapPositions(S.order.indexOf(dragSrc), S.order.indexOf(+tl.dataset.tile));
  dragSrc = null;
});

/* ---------- keyboard ---------- */
function tileEls() {
  return Array.prototype.slice.call(document.querySelectorAll('#board .g-tile'));
}
document.addEventListener('keydown', function (e) {
  if (S.screen !== 'play') return;
  var els = tileEls();
  if (!els.length) return;
  var cur = els.indexOf(document.activeElement);
  var nav = ['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'];
  if (nav.indexOf(e.key) >= 0) {
    e.preventDefault();
    if (cur < 0) { els[0].focus(); return; }
    var d = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1;
    els[(cur + d + els.length) % els.length].focus();
  } else if (e.key === 'h' || e.key === 'H') {
    e.preventDefault();
    useHint();
  }
});


/* ============================================================
   VALIDATION · colour each tile / slot once the first move lands
   ============================================================ */
function correctCount() {
  if (S.mode === 'order') {
    var n = 0;
    S.order.forEach(function (ti, pos) { if (pos === ti) n++; });
    return n;
  }
  if (S.mode === 'chinh') {
    var c = 0;
    S.slots.forEach(function (ti, pos) { if (ti >= 0 && ti === pos) c++; });
    return c;
  }
  var key = (S.mode === 'varna') ? 'varnaKey' : 'mokshaKey';
  var k = 0;
  S.tiles.forEach(function (th, i) {
    if (S.placed[i] !== undefined && S.placed[i] === th[key]) k++;
  });
  return k;
}

function isComplete() {
  if (isBucketMode()) return correctCount() === S.tiles.length;
  if (S.mode === 'chinh') return S.slots.every(function (ti, pos) { return ti === pos; });
  return S.order.every(function (ti, pos) { return ti === pos; });
}

function validateAll() {
  if (S.moves < 1) return;
  if (S.mode === 'order') {
    var els = document.querySelectorAll('#board .g-tile');
    for (var i = 0; i < els.length; i++) {
      var ti = +els[i].dataset.tile;
      var pos = +els[i].dataset.pos;
      els[i].classList.remove('is-correct', 'is-wrong');
      els[i].classList.add(pos === ti ? 'is-correct' : 'is-wrong');
      /* once a tile settles it is locked, so the board cannot thrash */
      els[i].classList.toggle('is-done', pos === ti);
    }
  } else if (S.mode === 'chinh') {
    paintSlots();
  } else {
    paintBuckets();
  }
  /* Auto-finish: if every tile is correctly placed, transition after a brief beat */
  if (isComplete() && !S.lock) {
    S.lock = true;
    setTimeout(function () { finishRound(); }, reduced() ? 100 : 650);
  }
}

function paintSlots() {
  var slots = document.querySelectorAll('.g-slot');
  for (var i = 0; i < slots.length; i++) {
    var ti = S.slots[i];
    slots[i].classList.remove('is-correct', 'is-wrong');
    if (ti >= 0 && S.moves >= 1) slots[i].classList.add(ti === i ? 'is-correct' : 'is-wrong');
  }
  var tiles = document.querySelectorAll('#board .g-tile');
  for (var j = 0; j < tiles.length; j++) {
    var idx = +tiles[j].dataset.tile;
    tiles[j].classList.toggle('is-done', S.slots.indexOf(idx) >= 0);
    tiles[j].classList.remove('is-correct', 'is-wrong');
  }
}

function paintBuckets() {
  var key = (S.mode === 'varna') ? 'varnaKey' : 'mokshaKey';
  var chips = document.querySelectorAll('.g-chipin');
  for (var i = 0; i < chips.length; i++) {
    var idx = +chips[i].dataset.tile;
    var th = S.tiles[idx];
    if (!th) continue;
    chips[i].classList.remove('is-correct', 'is-wrong');
    chips[i].classList.add(S.placed[idx] === th[key] ? 'is-correct' : 'is-wrong');
  }
}

/* ============================================================
   HUD + HINTS
   ============================================================ */
function paintHud() {
  var hi = (S.lang === 'hi');
  var done = correctCount();
  var total = S.tiles.length;
  $('hudPlaced').textContent = hi ? devNum(done) + '/' + devNum(total) : done + '/' + total;
  $('hudMoves').textContent = hi ? devNum(S.moves) : String(S.moves);
  $('hudTime').textContent = fmtTime(S.elapsed);
  $('hudHints').textContent = hi ? devNum(S.hints) : String(S.hints);
  $('progFill').style.transform = 'scaleX(' + (total ? (done / total) : 0).toFixed(4) + ')';
  var hb = $('hintBtn');
  if (hb) hb.disabled = S.hints <= 0;
}

function useHint() {
  if (S.hints <= 0) { toast(t('hintNone')); return; }
  startClock();
  S.hints--;
  S.hintsUsed++;
  S.bonus += HINT_PENALTY;
  S.elapsed += HINT_PENALTY;

  /* glow one tile that is still out of place — it teaches, never gives it away */
  var target = -1;
  for (var i = 0; i < S.tiles.length; i++) {
    var pos = (S.mode === 'order') ? S.order.indexOf(i) : i;
    if (!tileIsCorrectAt(i, pos)) { target = i; break; }
  }
  if (target >= 0) {
    var el = document.querySelector('#board .g-tile[data-tile="' + target + '"]');
    if (el) {
      el.classList.add('is-hint');
      setTimeout(function () { el.classList.remove('is-hint'); }, reduced() ? 200 : 1600);
    }
  }
  paintHud();
  toast(t('hintUsed', {
    n: (S.lang === 'hi' ? devNum(S.hints) : S.hints),
    s: (S.lang === 'hi' ? devNum(HINT_PENALTY) : HINT_PENALTY)
  }));
  sfx.tap();
}

function tileIsCorrectAt(tileIdx, pos) {
  if (S.mode === 'order') return pos === tileIdx;
  if (S.mode === 'chinh') return S.slots[tileIdx] === tileIdx;
  var key = (S.mode === 'varna') ? 'varnaKey' : 'mokshaKey';
  return S.placed[tileIdx] === S.tiles[tileIdx][key];
}

function paintHintLine() {
  var h = $('playHint');
  if (!h) return;
  h.textContent = S.mode === 'order' ? t('playHintOrder')
    : S.mode === 'chinh' ? t('playHintChinh')
    : t('playHintBucket');
}


/* ============================================================
   FINISH · only reachable once every tile is correctly placed
   ============================================================ */
function tryFinish() {
  if (!isComplete()) {
    toast(t('incomplete'));
    sfx.miss();
    var els = document.querySelectorAll('#board .g-tile.is-wrong');
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        el.classList.add('is-shake');
        setTimeout(function () { el.classList.remove('is-shake'); }, reduced() ? 60 : 460);
      })(els[i]);
    }
    return;
  }
  finishRound();
}

function levelKey() { return S.mode + '-' + S.count; }
function levelLabel() {
  var m = t('mode')[S.mode][0];
  var n = (S.lang === 'hi') ? devNum(S.count) : String(S.count);
  return m + ' · ' + n;
}

function tierOf() {
  var ideal = S.count;
  var ratio = S.moves ? (ideal / S.moves) : 0;
  if (ratio >= 0.85 && S.hintsUsed === 0) return 3;
  if (ratio >= 0.6) return 2;
  if (ratio >= 0.35) return 1;
  return 0;
}

function finishRound() {
  stopClock();
  S.elapsed = S.startedAt
    ? Math.floor((Date.now() - S.startedAt) / 1000) + S.bonus
    : S.bonus;
  S.lock = true;

  var entry = {
    name: S.name,
    level: levelLabel(),
    levelKey: levelKey(),
    duration: S.elapsed,
    score: Math.max(0, Math.round(1000 * (S.count / Math.max(1, S.moves)))),
    meta: { moves: S.moves, tiles: S.count, hints: S.hintsUsed, mode: S.mode },
    ts: Date.now()
  };
  var res = lbSave(entry);
  S.lastRank = res.saved ? res.rank : 0;

  setScreen('result');
  paintResultText();
  renderReview();
  petals(26);
  sfx.finish();
  toast(res.saved ? t('saved', { time: fmtClock(S.elapsed) }) : t('storageOff'));
}

function paintResultText() {
  var tier = tierOf();
  $('medalMark').innerHTML = artMedal();
  $('resTitle').textContent = t('resTitle')[tier];
  $('resSub').textContent = t('resSub')[tier];
  $('stTime').textContent = fmtClock(S.elapsed);
  $('stMoves').textContent = (S.lang === 'hi') ? devNum(S.moves) : String(S.moves);
  $('stHints').textContent = (S.lang === 'hi') ? devNum(S.hintsUsed) : String(S.hintsUsed);
  $('stTiles').textContent = (S.lang === 'hi') ? devNum(S.count) : String(S.count);
  $('cheerLine').textContent = pick(t('cheers'));
  var rk = $('resRank');
  if (S.lastRank) {
    rk.textContent = t('rankLine', { n: (S.lang === 'hi' ? devNum(S.lastRank) : S.lastRank) });
    rk.classList.remove('is-hidden');
  } else {
    rk.classList.add('is-hidden');
  }
  $('resLbPanel').classList.remove('is-hidden');
  renderLbInto('resLbBody');
}

/* ============================================================
   REVIEW · the full 24-row reference table + tradition notes
   ============================================================ */
function renderReview() {
  var head = $('reviewHead');
  head.innerHTML = '';
  [t('thNo'), t('thName'), t('thChinh'), t('thVarna'), t('thAasan'),
   t('thMoksha'), t('thJanma')].forEach(function (h) {
    var th = document.createElement('th');
    th.textContent = h;
    head.appendChild(th);
  });

  var body = $('reviewBody');
  body.innerHTML = '';
  var played = {};
  S.tiles.forEach(function (th) { played[th.no] = true; });

  TIRTH.forEach(function (th) {
    var tr = document.createElement('tr');
    if (!played[th.no]) tr.style.opacity = '.55';
    var cells = [
      (S.lang === 'hi' ? devNum(th.no) : String(th.no)),
      L(th, 'hi', 'en') + (L(th, 'aliasHi', 'aliasEn') ? ' (' + L(th, 'aliasHi', 'aliasEn') + ')' : ''),
      L(th, 'chinhHi', 'chinhEn'),
      L(th, 'varnaHi', 'varnaEn'),
      AASAN[th.aasanKey][S.lang],
      L(th, 'mokshaHi', 'mokshaEn'),
      L(th, 'janmaHi', 'janmaEn')
    ];
    cells.forEach(function (v, ci) {
      var td = document.createElement('td');
      if (ci === 0) td.className = 'g-num';
      td.textContent = v;              // textContent only — never innerHTML
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });

  var notes = $('tradNotes');
  notes.innerHTML = '';
  var h = document.createElement('p');
  h.className = 'g-note';
  h.textContent = t('tradTitle') + ': ';
  var first = true;
  TIRTH.forEach(function (th) {
    var n = L(th, 'noteHi', 'noteEn');
    if (!n) return;
    if (!first) h.appendChild(document.createTextNode('  ·  '));
    h.appendChild(document.createTextNode(
      (S.lang === 'hi' ? devNum(th.no) : th.no) + '. ' + L(th, 'hi', 'en') + ' — ' + n));
    first = false;
  });
  notes.appendChild(h);
}


/* ============================================================
   LEADERBOARD
   ============================================================ */
function renderLbInto(id) {
  var host = $(id);
  if (!host) return;
  host.innerHTML = '';
  var list = lbList();
  if (!list.length) {
    var p = document.createElement('p');
    p.className = 'g-lb-empty';
    p.textContent = t('lbEmpty');
    host.appendChild(p);
    return;
  }
  var wrap = document.createElement('div');
  wrap.className = 'g-tablewrap';
  var tb = document.createElement('table');
  tb.className = 'g-table';
  var thead = document.createElement('thead');
  var hr = document.createElement('tr');
  [t('thRank'), t('thLbName'), t('thLbLevel'), t('thLbTime'), t('thLbMoves')].forEach(function (h) {
    var th = document.createElement('th');
    th.textContent = h;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  tb.appendChild(thead);
  var body = document.createElement('tbody');
  var medals = ['\uD83E\uDD47', '\uD83E\uDD48', '\uD83E\uDD49'];
  list.slice(0, 10).forEach(function (e, i) {
    var tr = document.createElement('tr');
    var vals = [
      i < 3 ? medals[i] : String(i + 1),
      e.name || '—',
      e.level || e.levelKey || '—',
      fmtClock(e.duration),
      (S.lang === 'hi' ? devNum((e.meta && e.meta.moves) || 0) : String((e.meta && e.meta.moves) || 0))
    ];
    vals.forEach(function (v, ci) {
      var td = document.createElement('td');
      td.textContent = v;              // textContent only, never innerHTML
      if (ci === 0 && i < 3) td.className = 'g-medalcell';
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  tb.appendChild(body);
  wrap.appendChild(tb);
  host.appendChild(wrap);
}

function clearLb() {
  askDialog(t('lbConfirmTitle'), t('lbConfirmBody'), t('lbClear'), t('no'), function () {
    lbClear();
    renderLbInto('lbBody');
    renderLbInto('resLbBody');
    toast(t('lbCleared'));
  });
}

/* ============================================================
   SETUP CHIPS
   ============================================================ */
function buildModeChips() {
  var host = $('modeChips');
  host.innerHTML = '';
  MODES.forEach(function (m) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'g-chip' + (S.mode === m ? ' is-on' : '');
    b.textContent = t('mode')[m][0];
    b.title = t('mode')[m][1];
    b.setAttribute('aria-pressed', S.mode === m ? 'true' : 'false');
    b.addEventListener('click', function () {
      S.mode = m;
      /* the nirvana round needs enough tiles for every place to appear */
      if (m === 'moksha' && S.count < 8) S.count = 8;
      buildModeChips();
      buildCountChips();
      sfx.tap();
    });
    host.appendChild(b);
  });
}

function buildCountChips() {
  var host = $('countChips');
  host.innerHTML = '';
  COUNTS.forEach(function (n) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'g-chip' + (S.count === n ? ' is-on' : '');
    b.textContent = (S.lang === 'hi') ? devNum(n) : String(n);
    b.setAttribute('aria-pressed', S.count === n ? 'true' : 'false');
    if (S.mode === 'moksha' && n < 8) b.disabled = true;
    b.addEventListener('click', function () {
      if (S.mode === 'moksha' && n < 8) { toast(t('modeNeeds8')); return; }
      S.count = n;
      buildCountChips();
      sfx.tap();
    });
    host.appendChild(b);
  });
}

function buildDiffChips() {
  var host = $('diffChips');
  if (!host) return;
  host.innerHTML = '';
  ['hard', 'easy'].forEach(function (d) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'g-chip' + (S.diff === d ? ' is-on' : '');
    b.textContent = t('diff')[d][0];
    b.title = t('diff')[d][1];
    b.setAttribute('aria-pressed', S.diff === d ? 'true' : 'false');
    b.addEventListener('click', function () {
      S.diff = d;
      buildDiffChips();
      sfx.tap();
    });
    host.appendChild(b);
  });
}

  if (!$('resLbPanel').classList.contains('is-hidden')) renderLbInto('resLbBody');
  if (S.screen === 'play') { buildPlayField(); paintHud(); }
  if (S.screen === 'result') { paintResultText(); renderReview(); }
}

function paintSound() {
  var b = $('sndBtn');
  b.innerHTML = artBell(S.sound);
  b.setAttribute('aria-pressed', S.sound ? 'true' : 'false');
  b.setAttribute('aria-label', S.sound ? t('soundOn') : t('soundOff'));
  b.title = S.sound ? t('soundOn') : t('soundOff');
}


/* ============================================================
   WIRING
   ============================================================ */
function setLang(lang) {
  S.lang = (lang === 'en') ? 'en' : 'hi';
  writePrefs({ lang: S.lang });
  applyText();          // text only — the arrangement and clock survive
}

document.querySelectorAll('[data-lang]').forEach(function (b) {
  b.addEventListener('click', function () {
    ac();
    setLang(b.dataset.lang);
    sfx.tap();
    setScreen('setup');
  });
});

$('langBtn').addEventListener('click', function () {
  ac();
  setLang(S.lang === 'hi' ? 'en' : 'hi');
  sfx.tap();
});

$('sndBtn').addEventListener('click', function () {
  S.sound = !S.sound;
  writePrefs({ sound: S.sound });
  paintSound();
  if (S.sound) { ac(); sfx.tap(); }
});

$('hubBtn').addEventListener('click', function () {
  sfx.tap();
  try {
    if (window.parent && window.parent !== window && window.parent.location) {
      window.parent.location.hash = '#/kids';
      return;
    }
  } catch (e) { /* cross-origin: fall through to the file hub */ }
  window.location.href = 'index.html';
});

$('restartBtn').addEventListener('click', function () {
  stopClock();
  sfx.tap();
  setScreen('setup');
});

$('startBtn').addEventListener('click', function () { ac(); startRound(); });
$('nameInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); startRound(); }
});
$('hintBtn').addEventListener('click', useHint);
$('quitBtn').addEventListener('click', function () {
  askDialog(t('quitConfirm'), t('quitBody'), t('yes'), t('no'), function () {
    stopClock();
    setScreen('setup');
    sfx.tap();
  });
});
$('againBtn').addEventListener('click', function () { ac(); startRound(); });
$('changeBtn').addEventListener('click', function () { stopClock(); sfx.tap(); setScreen('setup'); });

$('lbBtn').addEventListener('click', function () {
  var p = $('lbPanel');
  p.classList.toggle('is-hidden');
  if (!p.classList.contains('is-hidden')) renderLbInto('lbBody');
  sfx.tap();
});
$('resLbBtn').addEventListener('click', function () {
  var p = $('resLbPanel');
  p.classList.toggle('is-hidden');
  if (!p.classList.contains('is-hidden')) renderLbInto('resLbBody');
  sfx.tap();
});
$('lbClearBtn').addEventListener('click', clearLb);
$('resLbClearBtn').addEventListener('click', clearLb);

/* ============================================================
   BOOT
   ============================================================ */
function parseQuery() {
  var q = {};
  try {
    var sp = new URLSearchParams(window.location.search || '');
    sp.forEach(function (v, k) { q[k] = v; });
  } catch (e) { q = {}; }
  return q;
}

function storageOk() {
  try {
    localStorage.setItem('__jb_t__', '1');
    localStorage.removeItem('__jb_t__');
    return true;
  } catch (e) { return false; }
}

function boot() {
  var prefs = readPrefs();
  S.lang = (prefs.lang === 'en') ? 'en' : 'hi';
  S.sound = prefs.sound !== false;
  S.name = prefs.name || '';

  var q = parseQuery();
  if (q.lang === 'en' || q.lang === 'hi') S.lang = q.lang;
  if (q.mode && MODES.indexOf(q.mode) >= 0) S.mode = q.mode;
  var qn = parseInt(q.n, 10);
  if (COUNTS.indexOf(qn) >= 0) S.count = qn;
  if (S.mode === 'moksha' && S.count < 8) S.count = 8;
  if (q.embed === '1') $('hubBtn').classList.add('is-hidden');

  if (S.name) $('nameInput').value = S.name;
  writePrefs({ lang: S.lang, sound: S.sound, lastGame: GAME_ID });

  applyText();
  setScreen(q.lang ? 'setup' : 'lang');
  if (!storageOk()) setTimeout(function () { toast(t('storageOff')); }, 400);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
