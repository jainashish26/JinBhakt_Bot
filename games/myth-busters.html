<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6D1B2F">
<meta name="description" content="जैन धर्म के बारे में सत्य या मिथ्या — हर भूल पर एक छोटा स्पष्टीकरण। True or false about Jainism — every miss unlocks a short correction. 72 bilingual statements across 8 topics.">
<title>मिथक भंजन · Myth Busters</title>
<style>
/* ============================================================
   स्मृति पट्ट · Memory Match
   Single file · no CDN · no images · no external fonts
   Motion: transform + opacity only · honours prefers-reduced-motion
   ============================================================ */
:root{
  --saffron:#E8800C; --maroon:#6D1B2F; --gold:#C8860A; --cream:#FFF8F0;
  --warm:#FFFBF5; --ink:#2D1B06; --ink2:#5C3D1E; --border:#D4A574;
  --success:#2E7D32; --rose:#B23A3A; --leaf:#3F7D4F; --info:#1565C0;
  --card-line:#EADBC0;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-full:9999px;
  --sh-sm:0 1px 3px rgba(45,27,6,.08), 0 1px 2px rgba(45,27,6,.06);
  --sh-md:0 4px 12px rgba(45,27,6,.10), 0 2px 4px rgba(45,27,6,.06);
  --sh-lg:0 10px 25px rgba(45,27,6,.12), 0 4px 8px rgba(45,27,6,.06);
  --fast:.15s ease; --base:.25s ease; --slow:.4s ease;
  --ritual:.7s cubic-bezier(.2,.7,.2,1);
  --font-head:'Noto Serif Devanagari', Georgia, 'Times New Roman', serif;
  --font-body:'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
@media (max-width:480px){html{font-size:15px}}
body{
  font-family:var(--font-body);color:var(--ink);line-height:1.6;min-height:100vh;
  background:
    radial-gradient(900px 480px at 50% -10%, #FFF6E2 0%, transparent 62%),
    linear-gradient(165deg,#FDF8EE,#F7ECD6 60%,#F1E2C4);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
img,svg{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:var(--r-sm)}
.is-hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

.g-wrap{max-width:900px;margin:0 auto;padding:14px 14px 40px}

/* ---------- header ---------- */
.g-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 2px 14px}
.g-brand{display:flex;align-items:center;gap:9px;min-width:0}
.g-mark{width:30px;height:30px;flex-shrink:0;color:var(--saffron)}
.g-brand-txt{display:flex;flex-direction:column;min-width:0}
.g-brand-hi{font-family:var(--font-head);font-weight:700;font-size:1.02rem;
  color:var(--maroon);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-brand-en{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);opacity:.85}
.g-head-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.g-pill{border:1.5px solid var(--border);background:rgba(255,255,255,.72);
  border-radius:var(--r-full);padding:6px 13px;font-weight:600;font-size:.76rem;
  color:#7A5A12;transition:background var(--fast),transform var(--fast);white-space:nowrap;min-height:36px}
.g-pill:hover{background:#fff;transform:translateY(-1px)}
.g-iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r-full);
  border:1.5px solid var(--border);background:rgba(255,255,255,.72);color:var(--maroon);
  transition:background var(--fast)}
.g-iconbtn:hover{background:#fff}
.g-iconbtn svg{width:19px;height:19px}

/* ---------- screens ---------- */
.g-screen{animation:g-rise .5s cubic-bezier(.2,.7,.2,1)}
@keyframes g-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.g-card{background:var(--warm);border:1px solid var(--card-line);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:26px 20px;margin:14px 0;text-align:center}
.g-rule{width:56px;height:2px;margin:0 auto 18px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.g-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);
  font-size:clamp(1.4rem,4.6vw,2rem);line-height:1.25;margin-bottom:.25em}
.g-sub{color:var(--ink2);font-size:.95rem;max-width:46ch;margin:0 auto 1.2em}
.g-glyph{display:block;width:64px;height:64px;margin:0 auto 10px;color:var(--saffron)}
.g-glyph svg{width:100%;height:100%}

/* ---------- choice tiles ---------- */
.g-choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.g-choice{border:1.5px solid var(--border);background:rgba(255,255,255,.62);
  border-radius:var(--r-lg);padding:18px 20px;min-width:140px;flex:0 1 190px;
  color:var(--maroon);text-align:center;
  transition:transform var(--base),background var(--base),border-color var(--base),box-shadow var(--base)}
.g-choice:hover{transform:translateY(-3px);background:#fff;box-shadow:var(--sh-md);border-color:var(--saffron)}
.g-choice.is-on{border-color:var(--maroon);background:#fff;box-shadow:0 0 0 2px rgba(109,27,47,.16)}
.g-choice-mark{width:34px;height:34px;margin:0 auto 8px;color:var(--saffron)}
.g-choice-name{display:block;font-family:var(--font-head);font-weight:700;font-size:1.02rem}
.g-choice-note{display:block;font-size:.74rem;color:var(--ink2);margin-top:3px;opacity:.9}
@media (pointer:coarse){.g-choice{min-height:44px}}

/* ---------- setup form ---------- */
.g-field{text-align:left;margin:20px auto 0;max-width:540px}
.g-label{display:block;font-weight:700;font-size:.84rem;color:var(--maroon);margin-bottom:8px;
  letter-spacing:.02em}
.g-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--r-md);
  background:#fff;font-size:1rem;min-height:46px;transition:border-color var(--fast)}
.g-input:focus{border-color:var(--saffron);outline:none}
.g-chips{display:flex;flex-wrap:wrap;gap:8px}
.g-chip{border:1.5px solid var(--border);background:rgba(255,255,255,.7);
  border-radius:var(--r-full);padding:8px 15px;font-size:.84rem;font-weight:600;color:#6B5733;
  min-height:42px;transition:background var(--fast),border-color var(--fast),color var(--fast)}
.g-chip:hover{background:#fff;border-color:var(--saffron)}
.g-chip.is-on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.g-hint{font-size:.8rem;color:var(--ink2);margin-top:16px;font-style:italic}

/* ---------- buttons ---------- */
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1.5px solid var(--border);background:rgba(255,255,255,.75);border-radius:var(--r-full);
  padding:12px 26px;font-weight:700;font-size:.95rem;color:#7A5A12;min-height:46px;
  transition:transform var(--fast),background var(--fast),box-shadow var(--fast)}
.g-btn:hover{background:#fff;transform:translateY(-2px);box-shadow:var(--sh-sm)}
.g-btn-primary{background:linear-gradient(180deg,var(--saffron),#D0710A);border-color:#B85F08;
  color:#fff;box-shadow:0 3px 0 #A85607}
.g-btn-primary:hover{background:linear-gradient(180deg,#F08C15,var(--saffron));color:#fff}
.g-btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #A85607}
.g-btn-primary:disabled{background:#D9CDB8;border-color:#C9BCA5;box-shadow:none;color:#8B7C63;
  cursor:not-allowed;transform:none}
.g-btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.g-btn-sm{padding:8px 16px;font-size:.82rem;min-height:38px}

/* ---------- HUD ---------- */
.g-hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:rgba(255,255,255,.6);border:1px solid var(--card-line);border-radius:var(--r-lg);
  padding:10px 12px;margin:6px 0 14px}
.g-stat{display:flex;flex-direction:column;align-items:center;min-width:66px;padding:2px 8px}
.g-stat-val{font-family:var(--font-head);font-weight:700;font-size:1.15rem;color:var(--maroon);
  line-height:1.15;font-variant-numeric:tabular-nums}
.g-stat-lbl{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);opacity:.85}
.g-hud-sep{width:1px;height:26px;background:var(--card-line)}
.g-progress{height:6px;background:rgba(212,165,116,.32);border-radius:var(--r-full);
  overflow:hidden;width:100%;margin-top:4px}
.g-progress-fill{height:100%;width:100%;border-radius:var(--r-full);transform-origin:left center;
  transform:scaleX(0);background:linear-gradient(90deg,var(--gold),var(--saffron));
  transition:transform var(--slow)}

/* ---------- memory grid ---------- */
.g-board{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);margin:4px 0 8px;
  perspective:1200px}
@media (min-width:620px){.g-board[data-cols="12"]{grid-template-columns:repeat(6,1fr)}}
@media (max-width:400px){.g-board{gap:7px}}
/* tight board: cards fill cells, no aspect-ratio constraint */
.g-board.is-tight{grid-auto-rows:1fr}
.g-board.is-tight .g-cardflip{aspect-ratio:auto;height:100%;min-height:0}
.g-board.is-tight .g-face{padding:4px 3px;gap:3px}
.g-board.is-tight .g-face-back .g-art{width:28px;height:28px}
.g-board.is-tight .g-face-back .g-txt{font-size:.62rem}
.g-board.is-tight .g-face-back .g-sub2{font-size:.54rem}
.g-board.is-tight .g-face-front svg{width:44%;height:auto}

/* The flip lives on the WRAPPER only. Neither face is itself rotated, so no
   glyph can ever be painted mirrored. The hidden face also drops to
   opacity 0 after the turn, which makes a mirrored render impossible even
   where backface-visibility is unsupported. */
.g-cardflip{position:relative;aspect-ratio:3/4;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.g-cardflip.is-flipped{transform:rotateY(180deg)}
.g-face{position:absolute;inset:0;border-radius:var(--r-md);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:8px 6px;text-align:center;overflow:hidden;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  transition:opacity .2s linear .35s, box-shadow var(--base)}
.g-cardflip.is-flipped .g-face-front{opacity:0}
.g-cardflip:not(.is-flipped) .g-face-back{opacity:0}
.g-face-front{background:linear-gradient(150deg,#FBEBCB,#F2DCB0);
  border:1.5px solid var(--border);box-shadow:var(--sh-sm);color:var(--gold)}
.g-face-front svg{width:64%;height:auto;color:var(--gold);opacity:.85}
.g-face-back{transform:rotateY(180deg);background:#fff;border:1.5px solid var(--card-line);
  box-shadow:var(--sh-sm);color:var(--ink)}
.g-face-back .g-art{width:44px;height:44px;flex-shrink:0}
.g-face-back .g-txt{font-size:.74rem;font-weight:700;line-height:1.3;color:var(--maroon);
  overflow-wrap:anywhere}
.g-face-back .g-sub2{font-size:.64rem;color:var(--ink2);opacity:.85;line-height:1.25}
.g-cardflip.is-matched{cursor:default}
.g-cardflip.is-matched .g-face-back{border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(200,134,10,.28), var(--sh-md)}
.g-cardflip.is-matched .g-face-back .g-txt{color:var(--leaf)}
.g-cardflip.is-wrong{animation:g-sway .42s ease}
@keyframes g-sway{0%,100%{transform:rotateY(180deg) translateX(0)}
  25%{transform:rotateY(180deg) translateX(-4px)}
  75%{transform:rotateY(180deg) translateX(4px)}}
.g-cardflip.is-hint .g-face-back{box-shadow:0 0 0 3px rgba(232,128,12,.45)}
@media (max-width:400px){
  .g-face-back .g-art{width:32px;height:32px}
  .g-face-back .g-txt{font-size:.66rem}
  .g-face-back .g-sub2{font-size:.58rem}
}

/* ---------- result ---------- */
.g-medal{display:block;width:76px;height:76px;margin:0 auto 8px;color:var(--gold);
  animation:g-bloom .8s cubic-bezier(.2,.8,.25,1)}
.g-medal svg{width:100%;height:100%}
@keyframes g-bloom{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
.g-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0}
.g-statbox{background:#fff;border:1px solid var(--card-line);border-radius:var(--r-md);padding:13px 8px}
.g-statbox b{display:block;font-family:var(--font-head);font-size:1.4rem;color:var(--saffron);
  line-height:1.2;font-variant-numeric:tabular-nums}
.g-statbox span{display:block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink2);margin-top:3px}
.g-review{text-align:left;margin:18px auto 0;max-width:640px}
.g-review-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);
  font-size:1.02rem;text-align:center;margin-bottom:10px}
.g-tablewrap{overflow-x:auto;border:1px solid var(--card-line);border-radius:var(--r-md);background:#fff}
.g-table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:430px}
.g-table th,.g-table td{padding:9px 10px;text-align:left;border-bottom:1px solid #F1E6D2;vertical-align:top}
.g-table th{background:#FBF3E2;font-weight:700;color:var(--maroon);font-size:.7rem;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.g-table tbody tr:last-child td{border-bottom:none}
.g-table td.g-num{font-variant-numeric:tabular-nums;color:var(--ink2);width:2.4em}
.g-note{font-size:.8rem;color:var(--ink2);background:#FBF3E2;border-left:3px solid var(--gold);
  padding:9px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:14px;line-height:1.55}
.g-rank{display:inline-block;background:var(--gold);color:#4A3508;border-radius:var(--r-full);
  padding:4px 14px;font-weight:700;font-size:.8rem;margin-top:12px}

/* ---------- leaderboard ---------- */
.g-lb{text-align:left;margin-top:18px}
.g-lb-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-wrap:wrap;margin-bottom:10px}
.g-lb-title{font-family:var(--font-head);font-weight:700;color:var(--maroon);font-size:1.02rem}
.g-lb-empty{font-size:.84rem;color:var(--ink2);font-style:italic;text-align:center;padding:14px 6px}
.g-medalcell{font-weight:700;color:var(--gold);width:2.6em}

/* ---------- toast / dialog / fx ---------- */
.g-toast{position:fixed;left:50%;bottom:24px;z-index:70;max-width:min(92vw,430px);
  transform:translateX(-50%) translateY(120px);opacity:0;pointer-events:none;
  background:rgba(60,40,20,.94);color:#FFF6E2;padding:11px 20px;border-radius:var(--r-full);
  font-weight:600;font-size:.86rem;box-shadow:var(--sh-lg);text-align:center;line-height:1.45;
  transition:transform var(--slow),opacity var(--slow)}
.g-toast.is-on{transform:translateX(-50%) translateY(0);opacity:1}
.g-fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.g-fx i{position:absolute;top:-24px;display:block;
  border-radius:60% 60% 60% 60%/70% 70% 30% 30%;
  animation:g-fall linear forwards;will-change:transform,opacity}
@keyframes g-fall{to{transform:translateY(112vh) rotate(420deg);opacity:.15}}
.g-dialog{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(45,27,6,.55)}
.g-dialog-card{background:var(--warm);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);padding:26px 22px;max-width:400px;width:100%;text-align:center;
  animation:g-rise .35s cubic-bezier(.2,.7,.2,1)}
.g-dialog-card h2{font-family:var(--font-head);color:var(--maroon);font-size:1.2rem;margin-bottom:8px}
.g-dialog-card p{font-size:.9rem;color:var(--ink2);margin-bottom:6px}
.g-foot{text-align:center;color:#A08A5E;font-size:.74rem;margin:28px auto 0;line-height:1.7;
  font-style:italic;max-width:60ch}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .g-fx{display:none!important}
}

/* ---------- short desktop: compact play screens so they fit the iframe without scrolling ---------- */
@media (min-width:900px) and (max-height:880px){
  .g-wrap{padding:8px 14px 20px}
  .g-card{padding:18px 16px;margin:8px 0}
  .g-title{font-size:clamp(1.2rem,3.6vw,1.6rem);margin-bottom:.15em}
  .g-sub{font-size:.85rem;margin-bottom:.8em}
  .g-hud{padding:8px 10px;margin:4px 0 8px}
  .g-stat-val{font-size:1rem}
  .g-stat-lbl{font-size:.58rem}
  .g-btn-row{margin-top:10px}
  .g-btn{padding:10px 20px;min-height:40px;font-size:.85rem}
  .g-btn-sm{padding:7px 14px;min-height:34px;font-size:.78rem}
  .g-foot{margin:14px auto 0;font-size:.68rem}
  .g-board{margin:2px 0 6px}
  .g-cardflip{aspect-ratio:auto;min-height:0}
  .g-face{padding:6px 4px;gap:4px}
  .g-face-back .g-art{width:36px;height:36px}
  .g-face-back .g-txt{font-size:.68rem}
  .g-face-front svg{width:50%;height:auto}
  .g-medal{width:56px;height:56px}
  .g-stats{margin:12px 0;gap:8px}
  .g-statbox{padding:10px 6px}
  .g-statbox b{font-size:1.2rem}
  .g-statbox span{font-size:.6rem}
  .g-review{margin:12px auto 0}
  .g-note{margin-top:10px;padding:7px 10px;font-size:.74rem}
}

/* ---------- statement card ---------- */
.g-qnum{text-align:center;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink2);opacity:.85;font-weight:700;margin:2px 0 8px}
.g-statementcard{padding:22px 18px}
.g-statement{font-family:var(--font-head);font-weight:700;color:var(--maroon);
  font-size:clamp(1.05rem,4.2vw,1.4rem);line-height:1.45;text-align:center;
  min-height:3.2em;display:flex;align-items:center;justify-content:center;margin:0 0 8px}
.g-statementcard.is-shake{animation:g-sway .45s ease}
.g-topic{text-align:center;font-size:.72rem;color:var(--ink2);opacity:.8;margin-bottom:16px;
  letter-spacing:.04em}
.g-tfrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.g-tfbtn{flex:1 1 150px;max-width:230px;min-height:56px;border-radius:var(--r-md);
  font-family:var(--font-head);font-weight:700;font-size:1.08rem;color:#fff;
  letter-spacing:.04em;transition:transform var(--fast),box-shadow var(--fast),opacity var(--fast)}
.g-tfbtn:active{transform:translateY(2px)}
.g-tfbtn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.g-tf-true{background:linear-gradient(180deg,#3F7D4F,#2E6240);box-shadow:0 3px 0 #234E32}
.g-tf-false{background:linear-gradient(180deg,#B23A3A,#8E2B2B);box-shadow:0 3px 0 #712121}
.g-timerbar{margin-top:8px}
.g-timerbar .g-progress-fill{background:linear-gradient(90deg,#3F7D4F,#6E9E5A)}
.g-timerbar.is-warn .g-progress-fill{background:linear-gradient(90deg,#C8860A,#B23A3A)}

/* ---------- teaching feedback (inline, not a modal) ---------- */
.g-lesson{margin:4px 0 10px;padding:16px 16px;border-radius:var(--r-lg);background:#fff;
  border:1px solid var(--card-line);border-left:6px solid var(--gold);
  box-shadow:var(--sh-sm);text-align:left;animation:g-rise .35s ease}
.g-lesson.is-correct{border-left-color:var(--success);background:#F3FAF3}
.g-lesson.is-wrong{border-left-color:var(--rose);background:#FDF4F4}
.g-lesson-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.g-lesson-mark{width:30px;height:30px;flex-shrink:0;color:var(--gold)}
.g-lesson-mark svg{width:100%;height:100%}
.g-lesson-title{font-family:var(--font-head);font-weight:700;font-size:1rem;color:var(--maroon)}
.g-stamp{display:inline-block;margin:0 auto 10px;padding:4px 14px;border-radius:var(--r-sm);
  border:2.4px solid var(--rose);color:var(--rose);font-family:var(--font-head);
  font-weight:700;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;
  animation:g-stampIn .45s cubic-bezier(.2,.8,.25,1)}
@keyframes g-stampIn{from{opacity:0;transform:scale(2.4)}to{opacity:1;transform:scale(1)}}
.g-stampwrap{text-align:center}
.g-lesson-body{font-size:.9rem;line-height:1.65;color:#4A3C2C}

<body data-game="myth-busters">
<div class="g-wrap">

  <header class="g-head">
    <div class="g-brand">
      <span class="g-mark" id="brandMark" aria-hidden="true"></span>
      <span class="g-brand-txt">
        <span class="g-brand-hi" id="brandHi"></span>
        <span class="g-brand-en" id="brandEn"></span>
      </span>
    </div>
    <div class="g-head-actions">
      <button type="button" class="g-iconbtn" id="sndBtn" aria-pressed="true"></button>
      <button type="button" class="g-pill" id="langBtn"></button>
      <button type="button" class="g-pill" id="hubBtn"></button>
      <button type="button" class="g-pill is-hidden" id="restartBtn"></button>
    </div>
  </header>

  <main id="main">
    <!-- S1 · LANGUAGE GATE -->
    <section class="g-screen" id="scrLang">
      <div class="g-card">
        <span class="g-glyph" id="langGlyph" aria-hidden="true"></span>
        <h1 class="g-title" id="s1Title"></h1>
        <p class="g-sub" id="s1Sub"></p>
        <div class="g-rule"></div>
        <div class="g-choices">
          <button type="button" class="g-choice" data-lang="en">
            <span class="g-choice-name">English</span>
            <span class="g-choice-note">Continue in English</span>
          </button>
          <button type="button" class="g-choice" data-lang="hi">
            <span class="g-choice-name" lang="hi">हिंदी</span>
            <span class="g-choice-note" lang="hi">हिंदी में जारी रखें</span>
          </button>
        </div>
      </div>
    </section>

    <!-- S2 · AUDIENCE GATE -->
    <section class="g-screen is-hidden" id="scrAud">
      <div class="g-card">
        <h1 class="g-title" id="s2Title"></h1>
        <p class="g-sub" id="s2Sub"></p>
        <div class="g-rule"></div>
        <div class="g-choices">
          <button type="button" class="g-choice" data-aud="kids">
            <span class="g-choice-name" id="kidsLbl"></span>
            <span class="g-choice-note" id="kidsNote"></span>
          </button>
          <button type="button" class="g-choice" data-aud="adults">
            <span class="g-choice-name" id="adultsLbl"></span>
            <span class="g-choice-note" id="adultsNote"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- S3 · SETUP GATE -->
    <section class="g-screen is-hidden" id="scrSetup">
      <div class="g-card">
        <h1 class="g-title" id="s3Title"></h1>
        <p class="g-sub" id="s3Sub"></p>
        <div class="g-rule"></div>

        <div class="g-field">
          <label class="g-label" for="nameInput" id="nameLabel"></label>
          <input class="g-input" type="text" id="nameInput" maxlength="20"
                 autocomplete="off" spellcheck="false">
        </div>

        <div class="g-field">
          <span class="g-label" id="roundLabel"></span>
          <div class="g-chips" id="roundChips" role="group"></div>
        </div>

        <div class="g-field">
          <span class="g-label" id="timerLabel"></span>
          <div class="g-chips" id="timerChips" role="group"></div>
        </div>

        <p class="g-hint" id="setupHint"></p>
        <div class="g-btn-row">
          <button type="button" class="g-btn g-btn-primary" id="startBtn"></button>
          <button type="button" class="g-btn" id="lbBtn"></button>
        </div>
      </div>

      <div class="g-card g-lb is-hidden" id="lbPanel">
        <div class="g-lb-head">
          <span class="g-lb-title" id="lbTitle"></span>
          <button type="button" class="g-btn g-btn-sm" id="lbClearBtn"></button>
        </div>
        <div id="lbBody"></div>
      </div>
    </section>

    <!-- S4 · PLAY -->
    <section class="g-screen is-hidden" id="scrPlay">
      <div class="g-hud">
        <div class="g-stat"><span class="g-stat-val" id="hudScore">0</span>
          <span class="g-stat-lbl" id="hudScoreLbl"></span></div>
        <span class="g-hud-sep" aria-hidden="true"></span>
        <div class="g-stat"><span class="g-stat-val" id="hudStreak">0</span>
          <span class="g-stat-lbl" id="hudStreakLbl"></span></div>
        <span class="g-hud-sep" aria-hidden="true"></span>
        <div class="g-stat"><span class="g-stat-val" id="hudAcc">—</span>
          <span class="g-stat-lbl" id="hudAccLbl"></span></div>
        <div class="g-progress"><div class="g-progress-fill" id="progFill"></div></div>
        <div class="g-progress g-timerbar"><div class="g-progress-fill" id="timerFill"></div></div>
      </div>

      <p class="g-qnum" id="qNum"></p>

      <div class="g-card g-statementcard" id="statementCard">
        <p class="g-statement" id="statement"></p>
        <p class="g-topic" id="topicLine"></p>
        <div class="g-tfrow">
          <button type="button" class="g-tfbtn g-tf-true" id="btnTrue"></button>
          <button type="button" class="g-tfbtn g-tf-false" id="btnFalse"></button>
        </div>
      </div>

      <div class="g-btn-row">
        <button type="button" class="g-btn g-btn-sm" id="quitBtn"></button>
      </div>
      <p class="sr-only" id="live" role="status" aria-live="polite"></p>
    </section>

    <!-- S5 · RESULT -->
    <section class="g-screen is-hidden" id="scrResult">
      <div class="g-card">
        <span class="g-medal" id="medalMark" aria-hidden="true"></span>
        <h1 class="g-title" id="resTitle"></h1>
        <p class="g-sub" id="resSub"></p>
        <span class="g-rank is-hidden" id="resRank"></span>
        <div class="g-stats">
          <div class="g-statbox"><b id="stScore">0</b><span id="stScoreLbl"></span></div>
          <div class="g-statbox"><b id="stAcc">0%</b><span id="stAccLbl"></span></div>
          <div class="g-statbox"><b id="stCorrect">0</b><span id="stCorrectLbl"></span></div>
          <div class="g-statbox"><b id="stBest">0</b><span id="stBestLbl"></span></div>
        </div>
        <p class="g-note" id="cheerLine"></p>
        <div class="g-btn-row">
          <button type="button" class="g-btn g-btn-primary" id="againBtn"></button>
          <button type="button" class="g-btn" id="changeBtn"></button>
          <button type="button" class="g-btn" id="resLbBtn"></button>
        </div>
      </div>

      <div class="g-card g-lb is-hidden" id="resLbPanel">
        <div class="g-lb-head">
          <span class="g-lb-title" id="resLbTitle"></span>
          <button type="button" class="g-btn g-btn-sm" id="resLbClearBtn"></button>
        </div>
        <div id="resLbBody"></div>
      </div>

      <div class="g-card g-review">
        <h2 class="g-review-title" id="reviewTitle"></h2>
        <div id="reviewList"></div>
      </div>
    </section>
  </main>

  <footer class="g-foot" id="footTxt"></footer>
</div>

<div class="g-toast" id="toast" role="status" aria-live="polite"></div>
<div class="g-fx" id="fx" aria-hidden="true"></div>
<div class="g-dialog is-hidden" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="g-dialog-card">
    <h2 id="dlgTitle"></h2>
    <p id="dlgBody"></p>
    <div class="g-btn-row">
      <button type="button" class="g-btn g-btn-primary" id="dlgYes"></button>
      <button type="button" class="g-btn" id="dlgNo"></button>
    </div>
  </div>
</div>
<script>
(function () {

'use strict';

/* Identity + rules for Myth Busters. */
var GAME_ID = 'myth-busters';
var LB_KEY = 'jinbhakt:kids:leaderboard:v1';
var PREF_KEY = 'jinbhakt:kids:prefs:v1';
var LB_MAX = 20;

/** Higher score wins; more correct answers breaks a tie. */
var LB_CMP = function (a, b) {
  return (b.score - a.score) ||
         (((b.meta && b.meta.correct) || 0) - ((a.meta && a.meta.correct) || 0)) ||
         (a.duration - b.duration) ||
         (b.ts - a.ts);
};

var ROUNDS = [10, 20, 0];                 // 0 === "all"
var TIMERS = [                              // seconds per statement, 0 = none
  { key: 'relaxed',  sec: 20 },
  { key: 'standard', sec: 12 },
  { key: 'quick',    sec: 8 },
  { key: 'none',     sec: 0 }
];
var BASE = 10, STREAK_BONUS = 5, STREAK_AT = 3;
var WARN_AT = 0.4;                        // timer bar turns amber at 40% left

var TOPICS = [
  ['tirthankara', 'Tirthankaras', 'तीर्थंकर'],
  ['ahimsa',      'Ahimsa & food', 'अहिंसा और आहार'],
  ['doctrine',    'Anekant · Ratnatraya · Karma', 'अनेकान्त · रत्नत्रय · कर्म'],
  ['monastic',    'Monks, nuns & vows', 'मुनि-साध्वी और व्रत'],
  ['symbol',      'Symbols & mantras', 'प्रतीक और मंत्र'],
  ['festival',    'Festivals & calendar', 'पर्व और संवत्'],
  ['scripture',   'Scriptures & Acharyas', 'ग्रन्थ और आचार्य'],
  ['digambar',    'Digambar tradition', 'दिगंबर परंपरा']
];

/* Row: [id, aud('kids'|'adults'|'both'), topic, answer(1=true,0=false),
         enStatement, hiStatement, enCorrection, hiCorrection] */
var QUESTIONS = [
['m01','both','tirthankara',0,'Lord Mahavira founded Jainism.','भगवान महावीर ने जैन धर्म की स्थापना की।','Mahavira was the 24th and last Tirthankara — a teacher who revived an ancient path. Jains hold the tradition to be beginningless, with Rishabhdev as the first Tirthankara of this cycle.','महावीर स्वामी चौबीसवें और अंतिम तीर्थंकर थे — एक प्राचीन पथ को पुनः प्रकाशित करने वाले शिक्षक। जैन परंपरा को अनादि मानते हैं, और इस कालखंड के प्रथम तीर्थंकर ऋषभदेव हैं।'],
['m02','both','tirthankara',1,'There are 24 Tirthankaras in the present cycle.','वर्तमान कालखंड में चौबीस तीर्थंकर हुए हैं।','Correct. From Rishabhdev to Mahavira, each Tirthankara re-established the same path of non-violence, truth and restraint.','सही। ऋषभदेव से महावीर तक, प्रत्येक तीर्थंकर ने अहिंसा, सत्य और संयम का एक ही मार्ग पुनः स्थापित किया।'],
['m03','kids','tirthankara',1,'The first Tirthankara is called Rishabhdev.','प्रथम तीर्थंकर ऋषभदेव कहलाते हैं।','Yes. Rishabhdev is also honoured as Adinatha, the first lord, and his emblem is the bull.','जी। ऋषभदेव को आदिनाथ भी कहा जाता है, और उनका लांछन वृषभ है।'],
['m04','kids','tirthankara',0,'Lord Mahavira’s emblem is the elephant.','भगवान महावीर का चिन्ह हाथी है।','Mahavira’s emblem is the lion. The elephant belongs to the second Tirthankara, Ajitanatha.','महावीर का लांछन सिंह है। हाथी दूसरे तीर्थंकर अजितनाथ का चिन्ह है।'],
['m05','adults','tirthankara',0,'All 24 Tirthankaras attained moksha at Sammed Shikharji.','सभी चौबीस तीर्थंकरों को सम्मेद शिखरजी पर मोक्ष प्राप्त हुआ।','Twenty of them did. Rishabhdev attained moksha at Ashtapada, Vasupujya at Champapuri, Neminatha at Girnar and Mahavira at Pavapuri.','बीस को वहाँ मोक्ष मिला। ऋषभदेव को अष्टापद, वासुपूज्य को चम्पापुरी, नेमिनाथ को गिरनार और महावीर को पावापुरी में।'],
['m06','adults','tirthankara',1,'Only three Tirthankaras are traditionally shown seated in padmasana.','परंपरा में केवल तीन तीर्थंकर पद्मासन में बैठे दिखाए जाते हैं।','Correct — Rishabhdev, Neminatha and Mahavira. The other twenty-one are shown standing in kayotsarga.','सही — ऋषभदेव, नेमिनाथ और महावीर। शेष इक्कीस कायोत्सर्ग में खड़े दिखाए जाते हैं।'],
['m07','both','tirthankara',0,'Tirthankaras grant boons to those who pray to them.','तीर्थंकर प्रार्थना करने वालों को वरदान देते हैं।','A Tirthankara is a liberated soul beyond the universe, free of all attachment. Jains venerate them to absorb their qualities, not to ask for favours.','तीर्थंकर विश्व के पार मुक्त आत्मा हैं, सब आसक्ति से रहित। जैन उनके गुण ग्रहण करने हेतु उनकी वंदना करते हैं, वरदान माँगने हेतु नहीं।'],
['m08','kids','tirthankara',1,'Parshvanatha’s emblem is the serpent.','पार्श्वनाथ का चिन्ह सर्प है।','Yes. He is shown with a serpent hood above him, and his complexion is blue.','जी। उनके ऊपर फण दिखाया जाता है, और उनका वर्ण नील है।'],
['m09','adults','tirthankara',1,'The 7th Tirthankara Suparshvanatha bears the swastika as his emblem.','सातवें तीर्थंकर सुपार्श्वनाथ का लांछन स्वस्तिक है।','Correct. The swastika is an ancient Jain auspicious mark, long predating any other use of that shape.','सही। स्वस्तिक एक प्राचीन जैन मंगल-चिन्ह है, जो इस आकृति के किसी भी अन्य प्रयोग से बहुत पूर्व का है।'],
['m10','kids','tirthankara',0,'Mahavira was born in Pavapuri.','महावीर का जन्म पावापुरी में हुआ था।','He was born at Kundagrama, near Vaishali. Pavapuri is where he attained nirvana.','उनका जन्म कुण्डग्राम में, वैशाली के समीप हुआ। पावापुरी वे स्थान है जहाँ उन्हें निर्वाण प्राप्त हुआ।'],
['m11','adults','tirthankara',1,'Neminatha is also known as Arishtanemi.','नेमिनाथ को अरिष्टनेमि भी कहा जाता है।','Correct. He is the 22nd Tirthankara, his emblem is the conch, and he attained moksha at Girnar.','सही। वे बाईसवें तीर्थंकर हैं, उनका लांछन शंख है, और उन्हें गिरनार पर मोक्ष प्राप्त हुआ।'],
['m12','kids','tirthankara',1,'Mallinatha’s emblem is the water pot.','मल्लिनाथ का चिन्ह कलश है।','Yes. In the Digambar tradition Mallinatha is shown with a kalash and a blue complexion.','जी। दिगंबर परंपरा में मल्लिनाथ कलश के साथ और नील वर्ण में दिखाए जाते हैं।'],
['m13','both','ahimsa',1,'Ahimsa Paramo Dharmah means non-violence is the supreme duty.','अहिंसा परमो धर्मः का अर्थ है — अहिंसा ही परम धर्म है।','Correct. Ahimsa in thought, word and deed toward every being, great and tiny, is the highest principle in Jainism.','सही। मन, वचन और काया से हर जीव के प्रति — बड़े हो या सूक्ष्म — अहिंसा ही जैन धर्म का परम सिद्धांत है।'],
['m14','both','ahimsa',1,'Jains avoid root vegetables because uprooting kills the whole plant.','जैन कंद-मूल सब्ज़ियाँ इसलिए त्यागते हैं क्योंकि उखाड़ने से पूरा पौधा मर जाता है।','Yes. Pulling a root ends the plant’s whole life and disturbs countless tiny beings living in that soil.','जी। जड़ खींचने से पौधे का पूरा जीवन समाप्त होता है और उस मिट्टी में बसे असंख्य सूक्ष्म जीव हिलते हैं।'],
['m15','kids','ahimsa',0,'Honey is fine because bees make too much of it anyway.','शहद ठीक है क्योंकि मधुमक्खियाँ वैसे भी अधिक बना लेती हैं।','Bees labour for every drop, and taking it harms the hive. That is why honey is given up entirely.','हर बूँद के लिए मधुमक्खियाँ श्रम करती हैं, और इसे लेने से छत्ते को हानि होती है। इसीलिए शहद पूर्णतः त्याग किया जाता है।'],
['m16','both','ahimsa',1,'Jains believe every living being, even the smallest, has a soul.','जैन मानते हैं कि हर जीव — सबसे सूक्ष्म भी — आत्मा रखता है।','Correct. From elephants to micro-organisms, every jiva has a soul of infinite potential. That belief is the root of Jain care for all life.','सही। हाथी से लेकर सूक्ष्मजीव तक, हर जीव की आत्मा अनंत सामर्थ्य वाली है। यही मान्यता सभी जीवन के प्रति जैन सावधानी का मूल है।'],
['m17','adults','ahimsa',0,'Anantkāy foods are avoided only because they taste strong.','अनंतकाय भोजन केवल तीखे स्वाद के कारण त्यागे जाते हैं।','Anantkāy means one body housing countless lives. Figs and banyan fruit are set aside to avoid that harm, not because of taste.','अनंतकाय का अर्थ है एक ही शरीर में असंख्य जीवन। अंजीर और बरगदी इस हानि से बचने हेतु त्यागे जाते हैं, स्वाद के कारण नहीं।'],
['m18','adults','ahimsa',1,'Jain kitchens usually close before sunset.','जैन रसोई सामान्यतः सूर्यास्त से पूर्व बंद हो जाती है।','Correct. Tiny beings gather near light, water and food after dark, so food is cooked and eaten in daylight.','सही। अँधेरे के पश्चात सूक्ष्म जीव प्रकाश, जल और भोजन के पास एकत्र होते हैं, अतः भोजन दिन के प्रकाश में बनता और खाया जाता है।'],
['m19','kids','ahimsa',1,'Eating above-ground food harms fewer living beings.','ज़मीन के ऊपर का भोजन खाने से कम जीवों को हानि पहुँचती है।','Yes. Grains, pulses, nuts and most fruits are harvested without ending the plant’s life.','जी। अन्न, दाल, मेवा और अधिकांश फल पौधे का जीवन समाप्त किए बिना एकत्र होते हैं।'],
['m20','adults','ahimsa',0,'Jainism permits eating fish in coastal regions.','जैन धर्म तटीय क्षेत्रों में मछली खाने की अनुमति देता है।','Ahimsa admits no exception of place. Flesh of any kind, from any region, is wholly outside a Jain diet.','अहिंसा में स्थान का कोई अपवाद नहीं। किसी भी क्षेत्र का, किसी भी प्रकार का मांस जैन आहार से पूर्णतः बाहर है।'],
['m21','kids','ahimsa',1,'Jain monks gently clear the path before they walk.','जैन मुनि चलने से पूर्व मार्ग को धीरे से साफ़ करते हैं।','Yes. A soft broom is used to move insects out of harm’s way so no creature is crushed underfoot.','जी। कोमल बुहारी से कीटों को हटाया जाता है ताकि कोई भी जीव पैर के नीचे न कुचला जाए।'],
['m22','adults','ahimsa',1,'Milk is accepted in the Jain diet.','दूध जैन आहार में स्वीकार्य है।','Correct. Dairy taken without harming the animal is traditionally accepted, though many families keep strict rules about when and how it is used.','सही। पशु को हानि पहुँचाए बिना लिया गया दुग्ध उत्पाद परंपरा में स्वीकार्य है, तथापि अनेक परिवार इसके समय और विधि पर कड़े नियम रखते हैं।'],
['m23','both','doctrine',0,'Jains believe a Creator God made the universe.','जैन मानते हैं कि ईश्वर ने विश्व की रचना की।','Jainism teaches the universe is uncreated and eternal, running on its own natural laws. Liberated souls are revered, but there is no creator.','जैन सिद्धांत में लोक अनादि और नित्य है, जो अपने स्वाभाविक नियमों से चलता है। मुक्त आत्माओं की वंदना होती है, पर कोई कर्ता-निर्माता नहीं है।'],
['m24','both','doctrine',0,'Anekantavada means there is only one correct way to see anything.','अनेकान्तवाद का अर्थ है कि किसी भी वस्तु को देखने का केवल एक ही सही मार्ग है।','It means the opposite — truth has many valid sides, like the blind men and the elephant. It teaches intellectual humility.','इसका अर्थ ठीक विपरीत है — सत्य के अनेक वैध पक्ष होते हैं, जैसे अंधों और हाथी की कथा। यह बौद्धिक नम्रता सिखाता है।'],
['m25','both','doctrine',1,'The Ratnatraya are Right Faith, Right Knowledge and Right Conduct.','रत्नत्रय हैं — सम्यक् दर्शन, सम्यक् ज्ञान और सम्यक् चारित्र।','Correct. These three jewels together form the Jain path to liberation; none of them works alone.','सही। ये तीनों रत्न मिलकर मोक्ष का मार्ग बनाते हैं; इनमें से कोई भी अकेले सिद्ध नहीं होता।'],
['m26','adults','doctrine',1,'In Jainism karma is described as subtle matter that clings to the soul.','जैन धर्म में कर्म को सूक्ष्म पुद्गल बताया गया है जो आत्मा से चिपकता है।','Yes. Karma is understood as karmic particles that bind to the soul through passion and action, like dust settling on wet cloth.','जी। कर्म को कर्मण-पुद्गल माना जाता है जो कषाय और क्रिया से आत्मा से बँधते हैं, जैसे गीले वस्त्र पर धूल।'],
['m27','kids','doctrine',1,'The soul never dies; it takes a new body.','आत्मा कभी नहीं मरती; वह नया शरीर लेती है।','Correct. The soul is eternal and moves through rebirth, shaped by its karma, until it is liberated.','सही। आत्मा नित्य है और कर्मों के अनुसार पुनर्जन्म से गुज़रती है, जब तक वह मुक्त नहीं हो जाती।'],
['m28','adults','doctrine',0,'Liberation in Jainism means merging into God.','जैन धर्म में मोक्ष का अर्थ है ईश्वर में विलीन हो जाना।','Moksha means the soul rises to Siddhashila at the summit of the universe, alone in its own infinite knowledge and bliss — not merged into anything.','मोक्ष में आत्मा लोक के शिखर पर सिद्धशिला को प्राप्त होती है, अपने अनंत ज्ञान और आनंद में स्वतंत्र — किसी में विलीन नहीं होती।'],
['m29','kids','doctrine',1,'Parasparopagraho Jivanam means souls help one another.','परस्परोपग्रहो जीवानाम् का अर्थ है — जीव एक-दूसरे की सहायता करते हैं।','Yes. This line from the Tattvartha Sutra is the Jain motto: all life is interconnected.','जी। तत्त्वार्थसूत्र का यह वाक्य ही जैन का आदर्श वाक्य है — समस्त जीवन परस्पर जुड़ा हुआ है।'],
['m30','adults','doctrine',0,'Only human beings can attain moksha.','केवल मनुष्य ही मोक्ष प्राप्त कर सकते हैं।','Any soul capable of right faith, knowledge and conduct may rise to liberation; the potential is infinite in every jiva.','सम्यक् दर्शन, ज्ञान और चारित्र का सामर्थ्य रखने वाली कोई भी आत्मा मोक्ष को प्राप्त कर सकती है; हर जीव में यह सामर्थ्य अनंत है।'],
['m31','both','doctrine',1,'The five great vows include truthfulness and non-stealing.','पाँच महाव्रतों में सत्य और अस्तेय भी शामिल हैं।','Correct. They are ahimsa, satya, achaurya, brahmacharya and aparigraha — non-violence, truth, non-stealing, celibacy and non-possession.','सही। वे हैं अहिंसा, सत्य, अस्तेय, ब्रह्मचर्य और अपरिग्रह।'],
['m32','adults','doctrine',1,'Aparigraha means non-possession.','अपरिग्रह का अर्थ है परिग्रह-त्याग।','Correct. It covers outer possessions and inner attachment to them both; monks live it fully, householders in measure.','सही। इसमें बाहरी संपत्ति और उसके भीतर का मोह दोनों आते हैं; मुनि इसे पूर्णतः और श्रावक परिमित रूप में साधते हैं।'],
['m33','adults','doctrine',0,'Syadvada is a doctrine of doubt and uncertainty.','स्याद्वाद संदेह और अनिश्चय का सिद्धांत है।','Syadvada is the careful method of holding that every judgement is true from some standpoint. It refines certainty; it does not abandon it.','स्याद्वाद वह सतर्क पद्धति है जो मानती है कि हर निर्णय किसी न किसी नय से सत्य है। यह निश्चय को परिष्कृत करता है, त्यागता नहीं।'],
['m34','both','doctrine',1,'Karma can be shed as well as bound.','कर्म का बंधन और निर्जरा दोनों होती है।','Correct. Bandha binds karma through passion; samvara stops the inflow and nirjara burns off what is already gathered.','सही। कषाय से कर्म का बंध होता है; संवर से आगमन रुकता है और निर्जरा से संचित कर्म क्षीण होते हैं।'],
['m35','both','monastic',0,'Digambara monks wear bright saffron robes.','दिगंबर मुनि गहरे केसरिया वस्त्र धारण करते हैं।','Digambara means sky-clad. A Digambara monk owns nothing, not even cloth, as the ultimate practice of aparigraha. It is Shvetambara monks who wear simple white robes.','दिगंबर का अर्थ है आकाश-वस्त्र। दिगंबर मुनि कुछ भी परिग्रह नहीं रखते, वस्त्र भी नहीं — यही अपरिग्रह की परम साधना है। श्वेतांबर मुनि सादे श्वेत वस्त्र धारण करते हैं।'],
['m36','both','monastic',1,'Jain monks and nuns own almost nothing.','जैन मुनि और साध्वियाँ लगभग कुछ भी परिग्रह नहीं रखते।','Correct. Their possessions are limited to the bare essential, and many accept food only as alms.','सही। उनका परिग्रह केवल नितावश्यक वस्तुओं तक सीमित है, और अनेक केवल भिक्षा ही ग्रहण करते हैं।'],
['m37','adults','monastic',1,'Householders observe twelve vows in all.','श्रावक कुल बारह व्रतों का पालन करते हैं।','Correct. The five anuvratas, three gunavratas and four shikshavratas together form the twelve vows of a householder.','सही। पाँच अणुव्रत, तीन गुणव्रत और चार शिक्षाव्रत मिलकर श्रावक के बारह व्रत बनते हैं।'],
['m38','kids','monastic',0,'Jain monks travel everywhere by car.','जैन मुनि हर स्थान पर कार से यात्रा करते हैं।','Monks and nuns walk, and they walk carefully. A vehicle would risk harm to beings along the way.','मुनि और साध्वियाँ पैदल चलते हैं, और अति सावधानी से। वाहन से मार्ग में जीवों को हानि का भय रहता है।'],
['m39','adults','monastic',1,'Pratikramana is a ritual of reflection and seeking forgiveness.','प्रतिक्रमण आलोचना और क्षमा-याचना की विधि है।','Correct. It is performed at set times to review one’s conduct, repent for lapses and ask forgiveness of all beings.','सही। इसे नियत काल में किया जाता है — अपने आचरण की समीक्षा, भूल पर पश्चात्ताप और सभी जीवों से क्षमा-प्रार्थना।'],
['m40','kids','monastic',1,'Micchami Dukkadam is a way of asking forgiveness.','मिच्छामि दुक्कड़म् क्षमा माँगने का भाव है।','Yes. It means may all my wrong actions bear no fruit — spoken especially on Samvatsari and Kshamavani.','जी। इसका भाव है कि मेरे सभी दुष्कर्म निष्फल हो जाएँ — विशेषतः संवत्सरी और क्षमावाणी पर कहा जाता है।'],
['m41','adults','monastic',0,'Jain nuns hold a higher rank than monks.','जैन साध्वियों का स्थान मुनियों से ऊँचा है।','Rank follows conduct and seniority, not gender. The path of restraint is equally open to every soul.','स्थान आचरण और ज्येष्ठता से निर्धारित होता है, लिंग से नहीं। संयम का मार्ग हर आत्मा के लिए समान रूप से खुला है।'],
['m42','both','monastic',1,'Samayika is a practice of sitting in equanimity.','सामायिक समभाव में बैठने की साधना है।','Correct. For a fixed period one withdraws from activity and rests the mind in evenness toward all beings.','सही। नियत काल तक क्रियाओं से हटकर मन को सभी जीवों के प्रति समभाव में स्थिर किया जाता है।'],
['m43','adults','monastic',1,'Monks accept food only within set daylight hours.','मुनि केवल नियत दिन-काल में ही भोजन ग्रहण करते हैं।','Correct. Alms are taken once, before sunset, from households that prepared the food with care.','सही। भिक्षा एक बार, सूर्यास्त से पूर्व, उन घरों से ली जाती है जिन्होंने भोजन सावधानी से बनाया हो।'],
['m44','both','symbol',0,'The Jain emblem shows a hand holding a sword.','जैन प्रतीक में तलवार थामे हाथ दिखाया गया है।','The raised palm means stop, do no harm. The wheel in the palm is the cycle of birth and rebirth that ahimsa helps us leave.','ऊपर उठा हुआ हाथ कहता है — रुकिए, किसी को हानि न पहुँचाइए। हथेली का चक्र जन्म-मरण का वह चक्र है जिसे अहिंसा छोड़ने में सहायता करती है।'],
['m45','both','symbol',1,'The raised palm on the Jain emblem means stop and do no harm.','जैन प्रतीक का ऊपर उठा हाथ कहता है — रुकिए और हानि मत कीजिए।','Correct. It asks the viewer to pause and consider before any action that could injure a living being.','सही। यह दर्शक से कहता है कि किसी भी जीव को हानि पहुँचाने वाली क्रिया से पूर्व रुकें और विचार करें।'],
['m46','adults','symbol',0,'The Namokar Mantra asks God for wishes and boons.','णमोकार मंत्र ईश्वर से मनोकामना और वरदान माँगता है।','The Navkar Mantra asks for nothing. It simply bows to the virtues of the five supreme beings so that we may become like them.','णमोकार मंत्र कुछ भी नहीं माँगता। वह केवल पंच परमेष्ठी के गुणों को नमन करता है, ताकि हम भी उन जैसे बन सकें।'],
['m47','kids','symbol',1,'The Namokar Mantra bows to five kinds of great souls.','णमोकार मंत्र पाँच प्रकार की महान आत्माओं को नमन करता है।','Yes — Arihanta, Siddha, Acharya, Upadhyaya and Sadhu. These five are the Panch Parmeshthi.','जी — अरिहंत, सिद्ध, आचार्य, उपाध्याय और साधु। इन्हीं पाँच को पंच परमेष्ठी कहा जाता है।'],
['m48','adults','symbol',1,'The Jain swastika’s four arms recall the four states of existence.','जैन स्वस्तिक की चार भुजाएँ चार गतियों का बोध कराती हैं।','Correct. They point to the four destinations — heavenly, human, animal and infernal — through which a soul may pass.','सही। वे चार गतियों का स्मरण कराती हैं — देव, मनुष्य, तिर्यंच और नारक — जिनसे आत्मा गुज़र सकती है।'],
['m49','kids','symbol',1,'The swastika is an ancient auspicious mark in Jainism.','स्वस्तिक जैन धर्म में एक प्राचीन मंगल-चिन्ह है।','Yes. It is the emblem of the seventh Tirthankara and is used in worship and in drawing ritual diagrams.','जी। यह सातवें तीर्थंकर का लांछन है और पूजा तथा मंडल-रचना में प्रयुक्त होता है।'],
['m50','adults','symbol',0,'The three dots above the Jain swastika represent three Gods.','जैन स्वस्तिक के ऊपर के तीन बिंदु तीन देवताओं को दर्शाते हैं।','They stand for the three jewels — right faith, right knowledge and right conduct — not for three deities.','वे तीन रत्नों का बोध कराते हैं — सम्यक् दर्शन, सम्यक् ज्ञान और सम्यक् चारित्र — तीन देवताओं का नहीं।'],
['m51','both','symbol',1,'The outline of the Jain emblem represents the shape of the universe.','जैन प्रतीक की बाहरी रेखा लोक के आकार को दर्शाती है।','Correct. It shows the loka as narrow at the top, wide in the middle and broad at the base.','सही। यह लोक को ऊपर संकीर्ण, मध्य में विस्तृत और आधार पर चौड़ा दिखाती है।'],
['m52','kids','symbol',1,'Hreem is a sacred syllable used in Jain worship.','ह्रीं जैन पूजा में प्रयुक्त एक पवित्र बीजाक्षर है।','Yes. It is a bija mantra held in great reverence, written on ritual diagrams and manuscripts.','जी। यह अति आदरणीय बीज मंत्र है, जिसे मंडल और ग्रंथों पर लिखा जाता है।'],
['m53','both','festival',1,'Jains celebrate Diwali because Lord Mahavira attained nirvana that day.','जैन दीपावली इसलिए मनाते हैं क्योंकि उस दिन भगवान महावीर को निर्वाण प्राप्त हुआ।','Yes. For Jains Diwali marks Mahavira’s liberation at Pavapuri, and the next day begins the Jain New Year, Veer Samvat.','जी। जैनों हेतु दीपावली पावापुरी में महावीर के मोक्ष का स्मरण है, और अगले दिन से जैन नववर्ष वीर संवत् आरंभ होता है।'],
['m54','adults','festival',1,'Paryushana is a period of fasting, study and forgiveness.','पर्युषण उपवास, स्वाध्याय और क्षमा का काल है।','Correct. It is the holiest period of the Jain year, ending with Samvatsari, when forgiveness is asked of everyone.','सही। यह जैन वर्ष का सबसे पवित्र काल है, जिसका समापन संवत्सरी पर होता है, जब सभी से क्षमा माँगी जाती है।'],
['m55','kids','festival',0,'Mahavir Jayanti celebrates Mahavira’s nirvana.','महावीर जयंती महावीर के निर्वाण का उत्सव है।','It celebrates his birth. His nirvana is remembered on Diwali.','यह उनके जन्म का उत्सव है। उनके निर्वाण का स्मरण दीपावली पर किया जाता है।'],
['m56','adults','festival',1,'Akshaya Tritiya remembers Rishabhdev ending his year-long fast.','अक्षय तृतीया ऋषभदेव के वर्ष-व्यापी उपवास के समापन का स्मरण है।','Correct. He broke the fast with sugarcane juice offered by his son Bharata.','सही। उनके पुत्र भरत द्वारा दिए गए ईख के रस से उन्होंने उपवास तोड़ा।'],
['m57','both','festival',1,'Kshamavani is the day set aside for asking forgiveness.','क्षमावाणी क्षमा माँगने हेतु नियत दिवस है।','Yes. On this day Jains seek forgiveness from everyone they may have hurt, knowingly or unknowingly.','जी। इस दिन जैन सभी से क्षमा माँगते हैं, जिनें उन्होंने जानते-अनजाने में कष्ट पहुँचाया हो।'],
['m58','adults','festival',0,'Jain festivals are chiefly occasions for feasting.','जैन पर्व मुख्यतः भोज-उत्सव के अवसर हैं।','They are occasions for restraint, study and charity. Fasting and simplicity mark them far more than feasting.','वे संयम, स्वाध्याय और दान के अवसर हैं। इनमें उपवास और सादगी का स्थान भोज से कहीं अधिक है।'],
['m59','kids','festival',1,'Shrut Panchami honours sacred knowledge.','श्रुत पंचमी ज्ञान का सम्मान करती है।','Yes. On this day scriptures and teachers are honoured, and manuscripts are reverently cleaned and worshipped.','जी। इस दिन ग्रंथों और गुरुओं का सम्मान होता है, तथा पाण्डुलिपियों को आदरपूर्वक शुद्ध कर पूजा जाता है।'],
['m60','adults','festival',1,'The Jain New Year begins the day after Diwali.','जैन नववर्ष दीपावली के अगले दिन आरंभ होता है।','Correct. It is called Veer Samvat, counted from the year of Mahavira’s nirvana.','सही। इसे वीर संवत् कहते हैं, जो महावीर के निर्वाण वर्ष से गिना जाता है।'],
['m61','both','scripture',1,'Kundakunda, author of the Samayasara, was a great Digambara Acharya.','समयसार के रचयिता कुन्दकुन्द एक महान दिगंबर आचार्य थे।','Correct. His works, among them the Samayasara and the Pravachanasara, are among the most revered in Digambar philosophy.','सही। समयसार और प्रवचनसार सहित उनकी रचनाएँ दिगंबर दर्शन में सर्वोच्च आदरणीय मानी जाती हैं।'],
['m62','both','scripture',1,'The Tattvartha Sutra is accepted by both major Jain traditions.','तत्त्वार्थसूत्र दोनों प्रमुख जैन परंपराओं में स्वीकार्य है।','Correct. Written by Acharya Umasvati, it is the rare text both Digambaras and Shvetambaras hold as authoritative.','सही। आचार्य उमास्वाति की इस रचना को दिगंबर और श्वेतांबर दोनों प्रमाण मानते हैं — यह दुर्लभ सहमति है।'],
['m63','adults','scripture',0,'The Jain Agamas were written down immediately after Mahavira’s nirvana.','जैन आगम महावीर के निर्वाण के तुरंत बाद लिख लिए गए थे।','They were carried orally for many centuries before being committed to writing, which is part of why traditions differ today.','वे अनेक शताब्दियों तक मौखिक परंपरा में रहे, उसके पश्चात लिखे गए — आज परंपराओं में भेद का एक कारण यही है।'],
['m64','kids','scripture',1,'Jain holy books are treated with great respect.','जैन ग्रंथों का अति आदर किया जाता है।','Yes. Scriptures are not placed on the floor, are handled with clean hands, and are honoured on Shrut Panchami.','जी। ग्रंथों को भूमि पर नहीं रखा जाता, शुद्ध हाथों से छुआ जाता है, और श्रुत पंचमी पर उनका सम्मान किया जाता है।'],
['m65','adults','scripture',1,'The Samayasara teaches that the soul alone is the agent of its own karma.','समयसार का उपदेश है कि आत्मा ही अपने कर्मों की कर्ता है।','Correct. Kundakunda insists that the soul, not the body or the world, binds and sheds karma — and so the soul alone can free itself.','सही। कुन्दकुन्द कहते हैं कि कर्म का बंध और निर्जरा शरीर या लोक नहीं, आत्मा स्वयं करती है — अतः मुक्ति भी आत्मा ही साध सकती है।'],
['m66','both','scripture',0,'Jain scriptures teach that ritual alone brings liberation.','जैन ग्रंथ कहते हैं कि केवल कर्मकांड से मोक्ष मिलता है।','Ritual without right faith, knowledge and conduct is empty. The texts insist that inner transformation is what liberates.','सम्यक् दर्शन, ज्ञान और चारित्र के बिना कर्मकांड निष्फल है। ग्रंथ कहते हैं कि मुक्ति भीतर का परिवर्तन ही दिलाता है।'],
['m67','adults','scripture',1,'Umasvati is also known as Umasvami.','उमास्वाति को उमास्वामी भी कहा जाता है।','Correct. Both forms of the name are used for the author of the Tattvartha Sutra.','सही। तत्त्वार्थसूत्र के रचयिता हेतु दोनों रूप प्रचलित हैं।'],
['m68','both','digambar',0,'Digambara means white-clad.','दिगंबर का अर्थ है श्वेत वस्त्रधारी।','Digambara means sky-clad — clothed in the directions alone, owning nothing. Shvetambara is the tradition that means white-clad.','दिगंबर का अर्थ है आकाश-वस्त्र — केवल दिशाओं को ही वस्त्र मानने वाले, जो कुछ भी परिग्रह नहीं रखते। श्वेत वस्त्रधारी को श्वेतांबर कहते हैं।'],
['m69','both','digambar',1,'Digambar tradition holds that Mahavira never married.','दिगंबर परंपरा मानती है कि महावीर ने विवाह नहीं किया।','Correct. The Digambar tradition records him as unmarried, while other traditions differ on this point.','सही। दिगंबर परंपरा में उन्हें अविवाहित बताया जाता है, जबकि अन्य परंपराएँ इस विषय में भिन्न मत रखती हैं।'],
['m70','adults','digambar',0,'Digambar and Shvetambara disagree on every doctrine.','दिगंबर और श्वेतांबर हर सिद्धांत पर असहमत हैं।','They agree on the essentials — the Tirthankaras, karma, the three jewels and the five great vows. Their differences are chiefly monastic practice and a few details.','मूल बातों पर दोनों सहमत हैं — तीर्थंकर, कर्म, रत्नत्रय और पाँच महाव्रत। भेद मुख्यतः मुनि-आचार और कुछ विवरणों में है।'],
['m71','kids','digambar',1,'Digambar temples often have very simple, calm images.','दिगंबर मंदिरों की मूर्तियाँ प्रायः अति सरल और शांत होती हैं।','Yes. The images are unadorned and face serene, reflecting a soul wholly free of attachment.','जी। मूर्तियाँ अलंकृत नहीं होतीं और मुख शांत होता है — यह सब आसक्ति से पूर्णतः मुक्त आत्मा का बोध कराता है।'],
['m72','adults','digambar',1,'Digambar tradition reveres the Samavasarana as a universal assembly.','दिगंबर परंपरा समवसरण को सार्वभौम सभा के रूप में आदरती है।','Correct. It is the divine assembly where a Tirthankara’s teaching reaches every being in its own language, without exclusion.','सही। यह वह दिव्य सभा है जहाँ तीर्थंकर का उपदेश हर जीव तक उसकी अपनी भाषा में पहुँचता है, किसी को बाहर रखे बिना।']
];

    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;

}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  try {

}

   ============================================================ */
var AC = null;
function ac() {
  if (AC) return AC;
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C();

  } catch (e) { AC = null; }
  return AC;
}
function tone(freq, dur, type, gain, delay) {
  if (!S.sound) return;
  var c = ac(); if (!c) return;
  try {
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain || 0.06), t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.12));
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + (dur || 0.12) + 0.03);
  } catch (e) { /* audio is never fatal */ }
}

  if (!S.sound) return;

var toastId = null;
function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('is-on');
  if (toastId) clearTimeout(toastId);
  toastId = setTimeout(function () { el.classList.remove('is-on'); }, 3200);
}
function say(msg) { var el = $('live'); if (el) el.textContent = msg; }

var dlgYesFn = null, dlgLastFocus = null;
function askDialog(title, body, yesLabel, noLabel, onYes) {
  dlgLastFocus = document.activeElement;
  $('dlgTitle').textContent = title;
  $('dlgBody').textContent = body;
  $('dlgYes').textContent = yesLabel;
  $('dlgNo').textContent = noLabel;
  dlgYesFn = onYes;
  $('dialog').classList.remove('is-hidden');
  $('dlgNo').focus();
}
function closeDialog() {
  $('dialog').classList.add('is-hidden');
  dlgYesFn = null;
  if (dlgLastFocus && dlgLastFocus.focus) dlgLastFocus.focus();
}
$('dlgYes').addEventListener('click', function () { var f = dlgYesFn; closeDialog(); if (f) f(); });
$('dlgNo').addEventListener('click', closeDialog);
$('dialog').addEventListener('click', function (e) { if (e.target === $('dialog')) closeDialog(); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !$('dialog').classList.contains('is-hidden')) closeDialog();
});

/** Muted marigold petals — transform + opacity only, skipped for reduced motion. */
function petals(count) {
  if (reduced()) return;
  var host = $('fx');
  var cols = ['#E8800C', '#C8860A', '#B23A3A', '#D4A574', '#E3B23C'];
  var n = count || 24;
  for (var i = 0; i < n; i++) {
    var p = document.createElement('i');
    var size = 7 + Math.random() * 8;
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.width = size + 'px';
    p.style.height = (size * 1.35) + 'px';
    p.style.background = cols[i % cols.length];
    p.style.opacity = '.8';
    p.style.animationDuration = (2.6 + Math.random() * 2.2) + 's';
    p.style.animationDelay = (Math.random() * 0.7) + 's';
    host.appendChild(p);
    (function (node) { setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 5600); })(p);
  }
}

/* ============================================================
   LEADERBOARD · shared schema, one key for all six games
   ============================================================ */
function lbAll() {
  var o = parseJSON(rawGet(LB_KEY), {});
  return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
}
function lbList() {
  var l = lbAll()[GAME_ID];
  if (!Array.isArray(l)) return [];
  var out = [];
  for (var i = 0; i < l.length; i++) {
    var e = l[i];
    if (!e || typeof e !== 'object') continue;
    out.push({
      name: sanitizeName(e.name), level: String(e.level || ''), levelKey: String(e.levelKey || ''),
      duration: Math.max(0, Math.floor(Number(e.duration) || 0)),
      score: Math.max(0, Math.floor(Number(e.score) || 0)),
      meta: (e.meta && typeof e.meta === 'object') ? e.meta : {},
      ts: Math.floor(Number(e.ts) || Date.now())
    });
  }
  out.sort(lbCmp);
  return out;
}
function lbCmp(a, b) { return LB_CMP(a, b); }
function lbSave(entry) {
  var all = lbAll();
  var list = Array.isArray(all[GAME_ID]) ? all[GAME_ID] : [];
  list.push(entry);
  list.sort(lbCmp);
  if (list.length > LB_MAX) list = list.slice(0, LB_MAX);
  all[GAME_ID] = list;
  var okSave = rawSet(LB_KEY, JSON.stringify(all));
  var rank = 0;
  for (var i = 0; i < list.length; i++) {
    if (list[i].ts === entry.ts && list[i].name === entry.name &&
        list[i].levelKey === entry.levelKey) { rank = i + 1; break; }
  }
  return { saved: okSave, rank: rank };
}
function lbClear() {
  var all = lbAll();
  if (Object.prototype.hasOwnProperty.call(all, GAME_ID)) {
    delete all[GAME_ID];
    rawSet(LB_KEY, JSON.stringify(all));
  }
}




/* ============================================================
   STATE
   ============================================================ */
var S = {
  lang: 'hi', sound: true, aud: null, name: '', screen: 'lang',
  round: 10, timerKey: 'standard', timerSec: 12,
  pool: [], deck: [], idx: 0,
  score: 0, streak: 0, best: 0, correct: 0, answered: 0,
  startedAt: 0, clockId: null, timerId: null, elapsed: 0,
  lock: false, missed: [], lastRank: 0
};

function setScreen(name) {
  S.screen = name;
  ['scrLang', 'scrAud', 'scrSetup', 'scrPlay', 'scrResult'].forEach(function (id) {
    $(id).classList.toggle('is-hidden',
      id !== 'scr' + name.charAt(0).toUpperCase() + name.slice(1));
  });
  $('restartBtn').classList.toggle('is-hidden', name !== 'play' && name !== 'result');
  window.scrollTo(0, 0);
}

/* Row: [id, aud, topic, answer(1|0), enS, hiS, enX, hiX] */
function qText(q)  { return S.lang === 'hi' ? q[5] : q[4]; }
function qWhy(q)   { return S.lang === 'hi' ? q[7] : q[6]; }
function qTrue(q)  { return q[3] === 1; }
function topicName(key) {
  for (var i = 0; i < TOPICS.length; i++) {
    if (TOPICS[i][0] === key) return S.lang === 'hi' ? TOPICS[i][2] : TOPICS[i][1];
  }
  return key;
}
function timerSecFor(key) {
  for (var i = 0; i < TIMERS.length; i++) if (TIMERS[i].key === key) return TIMERS[i].sec;
  return 12;
}

function buildPool() {
  S.pool = QUESTIONS.filter(function (q) {
    return S.aud === 'adults' ? true : (q[1] !== 'adults');
  });
}

function stopClock() { if (S.clockId) { clearInterval(S.clockId); S.clockId = null; } }
function stopTimer() { if (S.timerId) { clearTimeout(S.timerId); S.timerId = null; } }
function startClock() {
  if (S.startedAt) return;
  S.startedAt = Date.now();
  stopClock();
  S.clockId = setInterval(function () {
    S.elapsed = Math.floor((Date.now() - S.startedAt) / 1000);
  }, 500);
}

function startRound() {
  var nm = sanitizeName($('nameInput').value);
  if (!nm) { toast(t('nameNeeded')); $('nameInput').focus(); return; }
  S.name = nm;
  writePrefs({ name: nm, aud: S.aud, lastGame: GAME_ID });

  buildPool();
  var src = S.pool.slice();
  shuffle(src);
  S.deck = (S.round > 0) ? src.slice(0, Math.min(S.round, src.length)) : src;
  S.timerSec = timerSecFor(S.timerKey);

  S.idx = 0; S.score = 0; S.streak = 0; S.best = 0;
  S.correct = 0; S.answered = 0;
  S.startedAt = 0; S.elapsed = 0; S.lock = false; S.missed = []; S.lastRank = 0;
  stopClock(); stopTimer();
  clearLesson();
  $('lbPanel').classList.add('is-hidden');

  setScreen('play');
  showStatement();
  bell(0.05);
}

/* ============================================================
   PLAY
   ============================================================ */
function showStatement() {
  if (S.idx >= S.deck.length) { endRound(); return; }
  var q = S.deck[S.idx];
  S.lock = false;
  $('statement').textContent = qText(q);
  $('topicLine').textContent = topicName(q[2]);
  $('qNum').textContent = (S.lang === 'hi' ? devNum(S.idx + 1) : (S.idx + 1)) +
    ' / ' + (S.lang === 'hi' ? devNum(S.deck.length) : S.deck.length);
  $('btnTrue').disabled = false;
  $('btnFalse').disabled = false;
  $('statementCard').classList.remove('is-shake');
  clearLesson();
  paintHud();
  startTimerBar();
  say(qText(q));
}

function startTimerBar() {
  stopTimer();
  var fill = $('timerFill');
  var bar = fill.parentNode;
  bar.classList.remove('is-warn');
  if (!S.timerSec) {                      // "no timer" — hide the bar entirely
    bar.style.opacity = '0';
    fill.style.transition = 'none';
    fill.style.transform = 'scaleX(1)';
    return;
  }
  bar.style.opacity = '1';
  fill.style.transition = 'none';
  fill.style.transform = 'scaleX(1)';
  void fill.offsetWidth;                   // force reflow so the restart is clean
  if (reduced()) {
    fill.style.transition = 'none';
  } else {
    fill.style.transition = 'transform ' + S.timerSec + 's linear';
    fill.style.transform = 'scaleX(0)';
  }
  S.timerId = setTimeout(function () {
    if (!S.lock) answer(null);
  }, S.timerSec * 1000);
  if (!reduced()) {
    setTimeout(function () { bar.classList.add('is-warn'); },
      Math.round(S.timerSec * (1 - WARN_AT) * 1000));
  }
}

function paintHud() {
  var hi = (S.lang === 'hi');
  $('hudScore').textContent = hi ? devNum(S.score) : String(S.score);
  $('hudStreak').textContent = hi ? devNum(S.streak) : String(S.streak);
  var acc = S.answered ? Math.round((S.correct / S.answered) * 100) : null;
  $('hudAcc').textContent = acc === null ? '—' : (hi ? devNum(acc) : acc) + '%';
  $('progFill').style.transform =
    'scaleX(' + (S.deck.length ? (S.idx / S.deck.length) : 0).toFixed(4) + ')';
}

/** guess === null means the clock ran out. */
function answer(guess) {
  if (S.lock || S.idx >= S.deck.length) return;
  S.lock = true;
  stopTimer();
  startClock();
  $('btnTrue').disabled = true;
  $('btnFalse').disabled = true;

  var q = S.deck[S.idx];
  var right = (guess !== null) && (guess === qTrue(q));
  var gain = BASE + (S.streak >= STREAK_AT ? STREAK_BONUS : 0);

  S.answered++;
  if (right) {
    S.correct++;
    S.streak++;
    if (S.streak > S.best) S.best = S.streak;
    S.score += gain;
    sfx.match();
  } else {
    S.streak = 0;
    S.missed.push(q);
    $('statementCard').classList.add('is-shake');
    sfx.miss();
  }
  paintHud();
  renderLesson(q, right, guess === null, gain);
}

function say(msg) { var e = $('live'); if (e) e.textContent = msg; }

/** Teaching card, inline — built with textContent only, never innerHTML. */
function renderLesson(q, right, timedOut, gain) {
  clearLesson();
  var box = document.createElement('div');
  box.className = 'g-lesson ' + (right ? 'is-correct' : 'is-wrong');

  if (!right && !qTrue(q)) {
    var sw = document.createElement('div');
    sw.className = 'g-stampwrap';
    var stamp = document.createElement('span');
    stamp.className = 'g-stamp';
    stamp.textContent = t('mythStamp');
    sw.appendChild(stamp);
    box.appendChild(sw);
  }

  var head = document.createElement('div');
  head.className = 'g-lesson-head';
  var mark = document.createElement('span');
  mark.className = 'g-lesson-mark';
  mark.innerHTML = right ? artMedal() : artDiya();
  head.appendChild(mark);
  var title = document.createElement('span');
  title.className = 'g-lesson-title';
  title.textContent = right ? t('correctTitle')
    : (timedOut ? t('timeoutTitle') : t('wrongTitle'));
  head.appendChild(title);
  box.appendChild(head);

  var body = document.createElement('p');
  body.className = 'g-lesson-body';
  var lead = right ? (qTrue(q) ? t('trueLead') : t('falseLead')) : '';
  body.textContent = lead + qWhy(q);
  box.appendChild(body);

  var foot = document.createElement('div');
  foot.className = 'g-lesson-foot';
  var tag = document.createElement('span');
  tag.className = 'g-lesson-tag';
  tag.textContent = right
    ? t('points', { n: (S.lang === 'hi' ? devNum(gain) : gain) })
    : topicName(q[2]);
  foot.appendChild(tag);
  var next = document.createElement('button');
  next.type = 'button';
  next.className = 'g-btn g-btn-sm g-btn-primary g-lesson-next';
  next.textContent = t('next');
  next.addEventListener('click', nextStatement);
  foot.appendChild(next);
  box.appendChild(foot);

  var anchor = $('statementCard');
  anchor.parentNode.insertBefore(box, anchor.nextSibling);
  next.focus();
  say(title.textContent + ' ' + body.textContent);
}

function clearLesson() {
  var old = document.querySelector('.g-lesson');
  if (old && old.parentNode) old.parentNode.removeChild(old);
}

function nextStatement() {
  S.idx++;
  clearLesson();
  paintHud();
  if (S.idx >= S.deck.length) { endRound(); return; }
  showStatement();
}

/* ============================================================
   RESULT
   ============================================================ */
function levelKey() {
  return (S.aud === 'adults' ? 'adults' : 'kids') + '-' +
         (S.round > 0 ? S.round : 'all') + '-' + S.timerKey;
}
function levelLabel() {
  var who = S.aud === 'adults' ? t('adults') : t('kids');
  var n = S.round > 0
    ? (S.lang === 'hi' ? devNum(S.round) : String(S.round))
    : t('roundAll');
  return who + ' · ' + n + ' · ' + t('timer')[S.timerKey];
}

function tierOf() {
  var pct = S.deck.length ? (S.correct / S.deck.length) : 0;
  if (pct === 1) return 3;
  if (pct >= 0.8) return 2;
  if (pct >= 0.6) return 1;
  return 0;
}

function endRound() {
  stopTimer(); stopClock();
  if (S.startedAt) S.elapsed = Math.floor((Date.now() - S.startedAt) / 1000);

  var entry = {
    name: S.name,
    level: levelLabel(),
    levelKey: levelKey(),
    duration: S.elapsed,
    score: S.score,
    meta: { correct: S.correct, total: S.deck.length, best: S.best, aud: S.aud },
    ts: Date.now()
  };
  var res = lbSave(entry);
  S.lastRank = res.saved ? res.rank : 0;

  setScreen('result');
  paintResultText();
  renderReview();
  if (tierOf() >= 1) petals(26);
  sfx.finish();
  toast(res.saved ? t('saved', { n: (S.lang === 'hi' ? devNum(S.score) : S.score) })
                  : t('storageOff'));
}

function paintResultText() {
  var tier = tierOf();
  var hi = (S.lang === 'hi');
  $('medalMark').innerHTML = artMedal();
  $('resTitle').textContent = t('resTitle')[tier];
  $('resSub').textContent = t('resSub')[tier];
  $('stScore').textContent = hi ? devNum(S.score) : String(S.score);
  var acc = S.deck.length ? Math.round((S.correct / S.deck.length) * 100) : 0;
  $('stAcc').textContent = (hi ? devNum(acc) : acc) + '%';
  $('stCorrect').textContent = (hi ? devNum(S.correct) : S.correct) + '/' +
                               (hi ? devNum(S.deck.length) : S.deck.length);
  $('stBest').textContent = hi ? devNum(S.best) : String(S.best);
  $('cheerLine').textContent = pick(t('cheers'));
  var rk = $('resRank');
  if (S.lastRank) {
    rk.textContent = t('rankLine', { n: hi ? devNum(S.lastRank) : S.lastRank });
    rk.classList.remove('is-hidden');
  } else {
    rk.classList.add('is-hidden');
  }
  $('resLbPanel').classList.remove('is-hidden');
  renderLbInto('resLbBody');
}

/** Review the misses; when nothing was missed, show four worth remembering. */
function renderReview() {
  var host = $('reviewList');
  host.innerHTML = '';
  var items = S.missed.length ? S.missed : S.deck.slice(0, 4);

  if (!S.missed.length) {
    var note = document.createElement('p');
    note.className = 'g-fb-note';
    note.textContent = t('reviewEmpty');
    host.appendChild(note);
  }

  items.slice(0, 10).forEach(function (q) {
    var row = document.createElement('div');
    row.className = 'g-revitem';
    var topic = document.createElement('span');
    topic.className = 'g-revtopic';
    topic.textContent = topicName(q[2]);
    row.appendChild(topic);
    var st = document.createElement('div');
    var b = document.createElement('b');
    b.textContent = (qTrue(q) ? t('btnTrue') : t('btnFalse')) + ': ';
    st.appendChild(b);
    st.appendChild(document.createTextNode(qText(q)));
    row.appendChild(st);
    var why = document.createElement('span');
    why.className = 'g-revwhy';
    why.textContent = qWhy(q);
    row.appendChild(why);
    host.appendChild(row);
  });
}


/* ============================================================
   LEADERBOARD
   ============================================================ */
function renderLbInto(id) {
  var host = $(id);
  if (!host) return;
  host.innerHTML = '';
  var list = lbList();
  if (!list.length) {
    var p = document.createElement('p');
    p.className = 'g-lb-empty';
    p.textContent = t('lbEmpty');
    host.appendChild(p);
    return;
  }
  var wrap = document.createElement('div');
  wrap.className = 'g-tablewrap';
  var tb = document.createElement('table');
  tb.className = 'g-table';
  var thead = document.createElement('thead');
  var hr = document.createElement('tr');
  [t('thRank'), t('thLbName'), t('thLbLevel'), t('thLbScore'), t('thLbTime')].forEach(function (h) {
    var th = document.createElement('th');
    th.textContent = h;
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  tb.appendChild(thead);
  var body = document.createElement('tbody');
  var medals = ['\uD83E\uDD47', '\uD83E\uDD48', '\uD83E\uDD49'];
  list.slice(0, 10).forEach(function (e, i) {
    var tr = document.createElement('tr');
    var vals = [
      i < 3 ? medals[i] : String(i + 1),
      e.name || '—',
      e.level || e.levelKey || '—',
      (S.lang === 'hi' ? devNum(e.score) : String(e.score)),
      fmtClock(e.duration)
    ];
    vals.forEach(function (v, ci) {
      var td = document.createElement('td');
      td.textContent = v;              // textContent only, never innerHTML
      if (ci === 0 && i < 3) td.className = 'g-medalcell';
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  tb.appendChild(body);
  wrap.appendChild(tb);
  host.appendChild(wrap);
}

function clearLb() {
  askDialog(t('lbConfirmTitle'), t('lbConfirmBody'), t('lbClear'), t('no'), function () {
    lbClear();
    renderLbInto('lbBody');
    renderLbInto('resLbBody');
    toast(t('lbCleared'));
  });
}

/* ============================================================
   SETUP CHIPS
   ============================================================ */
function buildRoundChips() {
  var host = $('roundChips');
  host.innerHTML = '';
  ROUNDS.forEach(function (n) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'g-chip' + (S.round === n ? ' is-on' : '');
    b.textContent = (n === 0) ? t('roundAll') : (S.lang === 'hi' ? devNum(n) : String(n));
    b.setAttribute('aria-pressed', S.round === n ? 'true' : 'false');
    b.addEventListener('click', function () { S.round = n; buildRoundChips(); sfx.tap(); });
    host.appendChild(b);
  });
}

function buildTimerChips() {
  var host = $('timerChips');
  host.innerHTML = '';
  TIMERS.forEach(function (tm) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'g-chip' + (S.timerKey === tm.key ? ' is-on' : '');
    b.textContent = t('timer')[tm.key];
    b.setAttribute('aria-pressed', S.timerKey === tm.key ? 'true' : 'false');
    b.addEventListener('click', function () {
      S.timerKey = tm.key;
      S.timerSec = tm.sec;
      buildTimerChips();
      sfx.tap();
    });
    host.appendChild(b);
  });
}

  else if (k === 'f' || k === '2') { e.preventDefault(); ac(); answer(false); }
  else if (k === 'arrowleft') { e.preventDefault(); ac(); answer(true); }
  else if (k === 'arrowright') { e.preventDefault(); ac(); answer(false); }
});

function parseQuery() {
  var q = {};
  try {
    var sp = new URLSearchParams(window.location.search || '');
    sp.forEach(function (v, k) { q[k] = v; });
  } catch (e) { q = {}; }
  return q;
}

function storageOk() {
  try {
    localStorage.setItem('__jb_t__', '1');
    localStorage.removeItem('__jb_t__');
    return true;
  } catch (e) { return false; }
}

function boot() {
  var prefs = readPrefs();
  S.lang = (prefs.lang === 'en') ? 'en' : 'hi';
  S.sound = prefs.sound !== false;
  S.name = prefs.name || '';
  S.aud = (prefs.aud === 'adults') ? 'adults' : null;

  var q = parseQuery();
  var qLang = (q.lang === 'en' || q.lang === 'hi') ? q.lang : null;
  if (qLang) S.lang = qLang;
  var qAud = (q.aud === 'kids' || q.aud === 'adults') ? q.aud : null;
  if (qAud) S.aud = qAud;
  var qn = parseInt(q.n, 10);
  if (ROUNDS.indexOf(qn) >= 0) S.round = qn;
  if (q.embed === '1') $('hubBtn').classList.add('is-hidden');

  if (S.name) $('nameInput').value = S.name;
  writePrefs({ lang: S.lang, sound: S.sound, lastGame: GAME_ID });

  applyText();
  if (qLang && qAud) { buildPool(); setScreen('setup'); }
  else if (qLang) setScreen('aud');
  else setScreen('lang');

  if (!storageOk()) setTimeout(function () { toast(t('storageOff')); }, 400);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
